# Reviewable source registry for the NYC DOT completion pipeline.
# Every dataset the pipeline touches is declared here, not hardcoded in
# scripts, so a source swap or a new administration window is a config
# edit, not a code change.

administrations:
  adams:
    label: "Adams"
    start: "2022-01-01"
    end: "2025-12-31"
  mamdani:
    label: "Mamdani"
    start: "2026-01-01"
    # `end` is intentionally omitted: Mamdani's window is open-ended
    # ("to present"). The pipeline uses the extraction date as the
    # effective end and computes an annualized rate over the elapsed
    # fraction of a year, never a guessed full-year total.

socrata:
  base_domain: "data.cityofnewyork.us"
  # Socrata's default page size is 1000 rows; every puller must page with
  # $limit/$offset (or a $where date filter tight enough to stay under the
  # limit) until an empty page is returned. Never trust a single request.
  page_size: 50000

datasets:
  street_construction_permits:
    dataset_id: tqtj-sjs8
    resource_url: "https://data.cityofnewyork.us/resource/tqtj-sjs8.json"
    metadata_url: "https://data.cityofnewyork.us/api/views/tqtj-sjs8.json"
    # Field name to filter/sort on. Confirm against metadata_url before
    # trusting this — Socrata field names are the API's own snake_case
    # aliases, which do not always match the human-readable column name
    # shown on the dataset's web page.
    date_field: issue_date
    # Set only after inspect_schema.py confirms a field carrying a linear
    # measurement (e.g. curb-mile or linear-feet) on bike lane permits.
    # Left null (count-only) is a correct, honest default — do not guess a
    # units-bearing field just to produce a miles figure. Applies only to
    # the bike_lane_install category; daylighting is always a count.
    length_field: null
    length_unit: feet # feet | miles — must match length_field's real unit
    role: >
      Primary source for dated installation activity: bike lane and
      daylighting permits. A permit record is an ISSUED/work-authorized
      event, not a verified completion — inspect the dataset's own status
      field (if any) before treating a permit row as "done".

  capital_reconstruction_projects:
    dataset_id: 97nd-ff3i
    resource_url: "https://data.cityofnewyork.us/resource/97nd-ff3i.json"
    metadata_url: "https://data.cityofnewyork.us/api/views/97nd-ff3i.json"
    date_field: null # confirm during schema inspection; do not assume
    # Name of the field distinguishing completed/in-progress/planned, and
    # the exact string value(s) meaning "completed" — both null until
    # confirmed against inspect_schema.py's field list and a distinct-value
    # pull on the candidate field.
    status_field: null
    completed_values: []
    role: >
      Spatial capital-project records, used only as a cross-check on
      anything the permit feed alone can't confirm as "completed" (has a
      status field distinguishing completed/in-progress/planned).

  pedestrian_plazas:
    dataset_id: k5k6-6jex
    resource_url: "https://data.cityofnewyork.us/resource/k5k6-6jex.json"
    metadata_url: "https://data.cityofnewyork.us/api/views/k5k6-6jex.json"
    date_field: null # populated only if schema inspection finds one
    role: >
      Polygon inventory of pedestrian plazas / Open Streets. If it carries
      no install/opening date field, report only a total count as of the
      extraction date; do not bucket it by administration window.

secondary_sources:
  # Manual, non-API sources. See config/testimony.yaml for the actual
  # figures and their citations.
  dot_testimony: config/testimony.yaml
  transalt_tracker:
    url: "https://projects.transalt.org/bikelanes"
    note: >
      Independent advocacy tracker, not a government source. No public API
      found as of authoring; check robots.txt and the network tab again
      before scraping, and rate-limit if scraping is the only option.
      Treat any figure pulled from it as a secondary/comparison series,
      never as the primary number in the final table.
