# Human-reviewable classification of NYC Bike Routes (mzxg-pwib)
# ft_facilit / tf_facilit values into pipeline categories.
#
# This file previously targeted permit_type/work_type on the Street
# Construction Permits dataset (tqtj-sjs8) — schema inspection
# (2026-09-17) confirmed that dataset has neither field, and none of its
# real fields carry a bike-lane category. mzxg-pwib is the dataset that
# actually has bicycle facility classes with an install date, so this
# mapping now targets its ft_facilit/tf_facilit fields instead. Values
# below were confirmed via config/classification.generated.yaml, written
# by inspect_schema.py against the live dataset — not guessed.
#
# Categories:
#   bike_lane_install   - a physically protected bicycle facility
#                         (ft_facilit or tf_facilit == "Protected")
#   other               - any other facility class (painted/conventional,
#                         shared lane, signed route, sidewalk, boardwalk,
#                         unpaved, link, wide parking lane, ped plaza) —
#                         kept for completeness, excluded from the
#                         protected-bike-lane metric
#   ambiguous           - genuinely can't tell from the value alone; flag
#                         for a human decision rather than guessing which
#                         of the above it is
#
# A segment is classified bike_lane_install if EITHER direction's field
# maps to bike_lane_install — classify.py checks all of source_fields,
# not just the first non-null one (a single-field-then-stop check would
# silently miss a "Protected" value on the return direction).

source_fields:
  - ft_facilit
  - tf_facilit

mapping:
  "Protected": bike_lane_install
  "Conventional": other
  "Conventional Buffered": other
  "Curbside": other
  "Curbside Buffered": other
  "Shared": other
  "Signed Route": other
  "Wide Parking Lane": other
  "Sidewalk": other
  "Boardwalk": other
  "Unpaved": other
  "Link": other
  "Ped Plaza": other
