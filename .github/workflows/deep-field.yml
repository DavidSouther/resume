name: Deep Field CI

on:
  pull_request:
    paths:
      - pages/deep_field/**
      - src/components/deep_field/**
      - public/deep_field/**
      - mise.toml
      - package.json
      - package-lock.json
      - vitest.config.ts
      - scripts/vitest-build.ts
      - .github/actions/build-site/action.yml
      - .github/workflows/deep-field.yml
  push:
    branches: [main]
    paths:
      - pages/deep_field/**
      - src/components/deep_field/**
      - public/deep_field/**
      - mise.toml
      - package.json
      - package-lock.json
      - vitest.config.ts
      - scripts/vitest-build.ts
      - .github/actions/build-site/action.yml
      - .github/workflows/deep-field.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-field-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: npm ci

      - name: Build Deep Field WASM
        run: mise run wasm

      - uses: ./.github/actions/build-site
        with:
          fetch-deep-field: "false"

      - name: Test Deep Field Rust
        run: mise run test:rust

      - name: Cache SEP oracle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: deep-field-uv-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pages/deep_field/detect/oracle/sep_oracle.py', 'pages/deep_field/deep-field.feature.test.ts') }}
          restore-keys: |
            deep-field-uv-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
            deep-field-uv-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Test Deep Field against SEP
        env:
          SKIP_SITE_BUILD: "1"
        run: npm run test:site -- pages/deep_field/deep-field.feature.test.ts

      - name: Package Deep Field WASM
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git ls-tree -r HEAD -- pages/deep_field/detect mise.toml package.json | sha256sum | cut -d ' ' -f 1 > public/deep_field/detect/.source-hash
          tar -czf deep-field-wasm.tar.gz -C public/deep_field/detect .

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: deep-field-wasm
          path: deep-field-wasm.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deep-field-wasm

      - name: Publish Deep Field WASM
        run: |
          gh release view deep-field-wasm --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create deep-field-wasm --repo "$GITHUB_REPOSITORY" \
                 --title "Deep Field WASM" --latest=false \
                 --notes "Generated by the Deep Field CI workflow."
          gh release upload deep-field-wasm deep-field-wasm.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Deploy updated WASM
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
