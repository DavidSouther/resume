name: NYC polling data

# Generates the NYC polling map's GeoJSON (public/nyc_polling/*.geojson) and
# publishes it to the nyc-polling-data release. ci.yml and deploy.yml download
# it from there, so the slow, Census-keyed work runs here and not in every site
# build. Run this workflow once (workflow_dispatch) before the first site build.
#
# Runs on pull requests that touch the generator (generate only, no publish),
# on pushes to main that touch it, monthly to refresh the source downloads, and
# on demand.

on:
  pull_request:
    branches: [main]
    paths:
      - pages/nyc_polling/**
      - .github/workflows/census.yml
  push:
    branches: [main]
    paths:
      - pages/nyc_polling/**
      - .github/workflows/census.yml
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pdftotext (poppler) reads the BOE assignment PDFs and uv runs the PEP 723
      # scripts.
      - name: Install NYC polling tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: astral-sh/setup-uv@v6

      - name: Get the month for the source cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Source downloads (Census tables, tract boundaries, BOE PDFs, election
      # districts), about 18 MB. A new month saves a fresh entry that starts from
      # last month's, and the script re-downloads anything older than 30 days.
      # Bump v1 to v2 to throw the cache away, for example when BOE posts a
      # revised poll site list. Geocoder answers are not in here: they are
      # committed in pages/nyc_polling/data/poll_site_locations.json, so no Google
      # key is needed. A poll site that is not in that file fails the build.
      # Pull requests can restore entries saved on main but not the reverse.
      - name: Restore NYC polling source cache
        uses: actions/cache@v4
        with:
          path: pages/nyc_polling/.cache
          key: nyc-polling-sources-v1-${{ steps.month.outputs.month }}
          restore-keys: nyc-polling-sources-v1-

      # Needs the CENSUS_API_KEY repository secret only when the Census tables
      # are not in the cache.
      - name: Build NYC polling map data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: uv run pages/nyc_polling/nyc_tracts_geojson.py

      - uses: actions/upload-artifact@v4
        with:
          name: nyc-polling-geojson
          path: public/nyc_polling/*.geojson
          retention-days: 1
          if-no-files-found: error

  # Pull requests only prove the generator still works; they never overwrite the
  # data the live site builds from.
  publish:
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: nyc-polling-data
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nyc-polling-geojson
          path: data

      # Not "latest" so it never becomes the repository's headline release.
      - name: Publish release assets
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "NYC polling data" --latest=false \
                 --notes "Generated by the NYC polling data workflow. Do not edit."
          gh release upload "$TAG" data/*.geojson --repo "$GITHUB_REPOSITORY" --clobber

      # Publish the new data immediately. Dispatch builds
      # fresh (deploy.yml only reuses an approved build for push events). A
      # token-triggered workflow_dispatch is allowed, unlike other events.
      - name: Deploy fresh data
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
