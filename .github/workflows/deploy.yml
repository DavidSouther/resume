name: Deploy to GitHub Pages

# Builds the static site and deploys it as a Pages artifact. Replaces the old
# "deploy from branch main /docs" model so docs/ no longer needs to be committed.
# REQUIRES the repo's Pages source to be set to "GitHub Actions" (Settings →
# Pages → Build and deployment → Source). The custom domain (davidsouther.com)
# ships via public/CNAME → docs/CNAME at build and is preserved across deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the Pages deployment: read the repo, write the Pages
# artifact, and mint the OIDC token deploy-pages exchanges with Pages.
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deployment at a time; let a running deploy finish rather
# than cancelling it (a half-applied Pages deploy is worse than a slightly stale
# one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tree hash
        id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # ci.yml uploads docs/ as site-<tree hash> when a pull request builds green.
      # If main's tree equals that tree, no other change merged in the interim and
      # the approved build can ship as is. Artifacts older than MAX_AGE_HOURS are
      # ignored so a reused build cannot drift far from the current nyc-polling-data
# release, which the tree hash does not cover.
      # Only for push events. A manual or census-triggered dispatch exists to
      # publish data that changed outside the tree, so it always rebuilds.
      - name: Look for an approved build
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.sha }}
          MAX_AGE_HOURS: 72
        run: |
          cutoff=$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=site-$TREE&per_page=10" \
            --jq "[.artifacts[] | select(.expired == false and .created_at > \"$cutoff\")] | first | .workflow_run.id // empty")
          if [ -n "$found" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$found" >> "$GITHUB_OUTPUT"
            echo "Reusing build from run $found"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No approved build for tree $TREE, building"
          fi

      - name: Download approved build
        if: steps.reuse.outputs.hit == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-${{ steps.tree.outputs.sha }}
          path: docs
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build site
        if: steps.reuse.outputs.hit != 'true'
        uses: ./.github/actions/build-site

      # A reused site artifact can contain an older published WASM build, so
      # take the latest one. Deploy never waits on Deep Field: a missing or
      # older bundle is a warning, and Deep Field CI redeploys when it publishes
      # a bundle for the new sources.
      - name: Fetch current Deep Field WASM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download deep-field-wasm --repo "$GITHUB_REPOSITORY" \
            --pattern deep-field-wasm.tar.gz --dir "$RUNNER_TEMP" --clobber; then
            echo "::warning::No Deep Field WASM release to fetch; deploying without a refreshed detector."
            exit 0
          fi
          rm -rf docs/deep_field/detect
          mkdir -p docs/deep_field/detect
          tar -xzf "$RUNNER_TEMP/deep-field-wasm.tar.gz" -C docs/deep_field/detect
          expected=$(git ls-tree -r HEAD -- pages/deep_field/detect mise.toml mise.deepfield.toml package.json | sha256sum | cut -d ' ' -f 1)
          actual=$(cat docs/deep_field/detect/.source-hash 2>/dev/null || true)
          if [ "$actual" != "$expected" ]; then
            echo "::warning::Deep Field WASM was built from older detector sources; deploying it anyway. Deep Field CI publishes a new build and redeploys."
          fi
          rm -f docs/deep_field/detect/.source-hash

      # Same for the RRF preprint: a reused site artifact can hold an older PDF.
      # Missing is a warning; papers.yml redeploys when it publishes.
      - name: Fetch current RRF preprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/papers
          gh release download rrf-preprint --repo "$GITHUB_REPOSITORY" \
            --pattern rrf-coverage-normalization.pdf --dir docs/papers --clobber \
            || echo "::warning::No rrf-preprint release to fetch; deploying without a refreshed preprint."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
