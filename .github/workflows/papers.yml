name: Papers

# Compiles the RRF preprint (pandoc + typst, MISE_ENV=papers) and publishes the
# PDF to the rrf-preprint release. build-site and deploy.yml download it from
# there, so site builds need neither pandoc nor typst. Pull requests only prove
# the paper still compiles.

on:
  pull_request:
    paths:
      - posts/rrf_coverage_normalization/**
      - scripts/compile-paper.ts
      - mise.toml
      - mise.papers.toml
      - .github/workflows/papers.yml
  push:
    branches: [main]
    paths:
      - posts/rrf_coverage_normalization/**
      - scripts/compile-paper.ts
      - mise.toml
      - mise.papers.toml
      - .github/workflows/papers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: papers
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: npm ci

      - name: Build RRF preprint
        run: mise run papers

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: rrf-preprint
          path: public/papers/rrf-coverage-normalization.pdf
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rrf-preprint

      - name: Publish RRF preprint
        run: |
          gh release view rrf-preprint --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create rrf-preprint --repo "$GITHUB_REPOSITORY" \
                 --title "RRF preprint" --latest=false \
                 --notes "Generated by the Papers workflow. Do not edit."
          gh release upload rrf-preprint rrf-coverage-normalization.pdf --repo "$GITHUB_REPOSITORY" --clobber

      - name: Deploy updated preprint
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
