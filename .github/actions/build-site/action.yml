name: Build site
description: >
  Provision tools, fetch the generated NYC polling data, and build the static
  site into docs/. Shared by the PR check and the release so both build the same
  way. The caller checks the repository out first.

inputs:
  mise-env:
    description: >
      MISE_ENV profiles to install on top of the Node-only base mise.toml
      (comma separated, e.g. "deepfield"). The site build itself needs none.
    required: false
    default: ""
  fetch-deep-field:
    description: Download the published Deep Field WASM before building.
    required: false
    default: "true"
  github-token:
    description: Token used to download the NYC polling data release asset.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Provision Node from mise.toml, plus any profiles the caller asks for.
    - uses: jdx/mise-action@v2
      env:
        MISE_ENV: ${{ inputs.mise-env }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    # The NYC polling map's GeoJSON (public/nyc_polling/*.geojson) is generated
    # by census.yml and published to the nyc-polling-data release, not built
    # here. The site build never reads it; the browser fetches it, so it only
    # has to land in public/ before the SSG copies public/ into docs/. A missing
    # release fails the build: run the "NYC polling data" workflow once.
    - name: Fetch NYC polling data
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: >
        gh release download nyc-polling-data
        --repo "$GITHUB_REPOSITORY"
        --pattern '*.geojson'
        --dir public/nyc_polling
        --clobber

    # The RRF preprint PDF is compiled by papers.yml (pandoc and typst, MISE_ENV
    # =papers) and published to the rrf-preprint release. A missing release is a
    # warning, not a failure: papers.yml redeploys once it publishes.
    - name: Fetch RRF preprint
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        mkdir -p public/papers
        gh release download rrf-preprint --repo "$GITHUB_REPOSITORY" \
          --pattern rrf-coverage-normalization.pdf --dir public/papers --clobber \
          || echo "::warning::No rrf-preprint release to fetch; building without the RRF preprint PDF."

    - name: Fetch Deep Field WASM
      if: inputs.fetch-deep-field == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh release download deep-field-wasm --repo "$GITHUB_REPOSITORY" \
          --pattern deep-field-wasm.tar.gz --dir "$RUNNER_TEMP" --clobber
        mkdir -p public/deep_field/detect
        tar -xzf "$RUNNER_TEMP/deep-field-wasm.tar.gz" -C public/deep_field/detect

    - name: Build site
      shell: bash
      run: npm run check && npm run build:site

    # PDFs are printed into docs/ so the build CI approves is the one that
    # deploys, for every caller of this action. This must run after the site
    # build and stay the last step; a
    # failure here fails CI and blocks the deploy, so it is never
    # continue-on-error.
    - name: Install Chromium for PDFs
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Build resume and CV PDFs
      shell: bash
      run: npm run pdfs
