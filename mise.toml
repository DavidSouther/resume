# Node only, so site builds install nothing heavy. Other tools are opt-in
# profiles in mise.<name>.toml, selected with MISE_ENV (comma separated).
# uv downloads Python itself from the PEP 723 requires-python header of each
# script that has one; the SEP oracle has none, so its uv call passes
# --python 3.12.
[tools]
node = "24"

# Site tasks delegate to npm; Rust commands are owned by mise.
[tasks.dev]
run = "npm run dev"

[tasks.build]
run = "npm run build"

# Site assembly copies any previously built or restored WASM outputs.
[tasks."build:site"]
run = "npm run build:site"

# Print the resume and CV PDFs into docs/ (requires build:site first).
[tasks.pdfs]
run = "npm run pdfs"

[tasks.papers]
run = "npm run papers"

[tasks.start]
run = "npm start"

[tasks.check]
run = "npm run check"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.format]
run = "npm run format"

[tasks.lint]
run = "npm run lint"

[tasks.test]
run = "npm test"

[tasks."test:rust"]
run = [
  "cargo test --locked --workspace --manifest-path pages/deep_field/detect/Cargo.toml",
  "cargo test --locked --manifest-path pages/deep_field/detect/Cargo.toml -p deep-field-core --no-default-features",
]

[tasks."test:site"]
run = "npm run test:site"

[tasks."test:watch"]
run = "npm run test:watch"

[tasks."css:bundle"]
run = "npm run css:bundle"

# Build the Deep Field detector into public/deep_field/detect/ (detect.js and
# detect_bg.wasm). Run explicitly when working on the detector.
[tasks.wasm]
run = "wasm-pack build pages/deep_field/detect --target web --release --no-pack --out-dir ../../../public/deep_field/detect --out-name detect"

# Print SEP's objects for the bundled sample, the reference for the detector.
[tasks.oracle]
run = "uv run --python 3.12 --with sep --with numpy --with pillow python pages/deep_field/detect/oracle/sep_oracle.py public/deep_field/potm2301a.png"
