  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: How does <code>build.rs</code> send instructions back to cargo?
    Back: By printing specially formatted lines to stdout via <code>println!()</code>, e.g. <code>cargo::rerun-if-changed=PATH</code>, <code>cargo::rustc-env=VAR=VALUE</code>, <code>cargo::warning=MSG</code>.
