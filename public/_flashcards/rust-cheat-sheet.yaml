    - tooling
    - docs
    - testing
- noteId: tool-dollar-crate
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What is <code>$crate</code> inside a <code>macro_rules!</code> macro?
