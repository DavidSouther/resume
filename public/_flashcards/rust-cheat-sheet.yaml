- noteId: sl-oneliner-subslice-with-length
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: get a subslice given an offset and a length (instead of an end index)?"
    Back: <code>&original_slice[offset..][..length]</code>
  tags:
