    - esoterics
- noteId: sl-oneliner-try-for-each-inference
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: <code>iter.try_for_each(|x| { ... })?</code> fails to infer its error type. What's the one-liner fix?
    Back: |-
      Annotate the closure's return type explicitly:<br>
      <code>iter.try_for_each(|x| { Ok::&lt;(), Error&gt;(()) })?;</code>
  tags:
    - rust
    - standard-library
    - one-liners
    - closures
- noteId: sl-oneliner-write-append
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: append a <code>Display</code> value onto something that implements <code>Write</code>?"
    Back: <code>write!(x, "{y}")</code>
  tags:
    - rust
