    - macros
    - attributes
- noteId: cg-tc-as-cast-risk
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Why is the <code>as</code> keyword treated with caution for conversions, especially <code>Number as Number</code>?
    Back: <code>as</code> casts are explicit but can silently truncate, wrap, or lose precision — the compiler won't stop you. For correctness-sensitive code, prefer explicit conversion methods (like <code>TryFrom</code>) over a bare <code>as</code>.
  tags:
    - rust
    - type-conversions
    - casts
- noteId: cg-tc-as-cast-table
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: "Give an <code>as</code> cast example for: pointer→integer, integer→pointer, fieldless enum→integer, <code>bool</code>→integer, <code>char</code>→integer, and <code>fn</code>→pointer."
    Back: "<ul><li>pointer→integer: <code>device_ptr as usize</code></li><li>integer→pointer: <code>my_usize as *const Device</code></li><li>enum→integer: <code>E::A as u8</code></li><li>bool→integer: <code>true as u8</code></li><li>char→integer: <code>'A' as u8</code></li><li>fn→pointer: <code>f as *const u8</code></li></ul>"
  tags:
    - rust
    - type-conversions
    - casts
- noteId: cg-tc-box-cell-variance
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Is <code>Box&lt;T&gt;</code> covariant or invariant in <code>T</code>? What about <code>Cell&lt;T&gt;</code>? Why the difference?
    Back: <code>Box&lt;T&gt;</code> is covariant — it only ever hands out <code>T</code> by value or reference, so a subtype substitutes safely. <code>Cell&lt;T&gt;</code> is invariant — its interior mutability means you could write a shorter-lived value through a <code>Cell&lt;&amp;'static T&gt;</code> handle, corrupting the assumed lifetime.
  tags:
    - rust
    - type-conversions
    - variance
- noteId: cg-tc-closure-fn-pointer
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: When can a closure coerce directly to a plain <code>fn</code> pointer?
    Back: Only when it's non-capturing — it closes over no environment, so it behaves exactly like a plain function. E.g. <code>|x| x + x</code> can coerce to <code>fn(u8) -&gt; u8</code>.
  tags:
    - rust
    - type-conversions
    - closures
- noteId: cg-tc-coercion-pointer-weakening
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: What kind of automatic coercion turns <code>&amp;mut T</code> into <code>&amp;T</code>, and what other pointer coercions follow the same pattern?
    Back: "Pointer weakening: a unique reference can always be used where a shared one is expected. The same weakening applies to <code>&amp;mut T → *mut T</code>, <code>&amp;T → *const T</code>, and <code>*mut T → *const T</code> — each loses a guarantee, never gains one."
  tags:
    - rust
    - type-conversions
    - coercion
- noteId: cg-tc-coercion-vs-subtyping
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Coercions and subtyping both convert <code>A</code> to <code>B</code> automatically. How do they differ?
    Back: Coercions usually link <code>A</code> to an unrelated type <code>B</code> — one you'd expect to have different methods (e.g. <code>&amp;mut T</code> to <code>&amp;T</code>). Subtyping links <code>A</code> to a <code>B</code> that differs <b>only in lifetimes</b> — same methods, same layout.
  tags:
    - rust
    - type-conversions
    - coercion
- noteId: cg-tc-conversion-traits-table
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: "Match each conversion trait to what it implies about the relationship between <code>A</code> and <code>B</code>: <code>Deref</code>, <code>AsRef&lt;B&gt;</code>, <code>AsMut&lt;B&gt;</code>, <code>Borrow&lt;B&gt;</code>, <code>ToOwned</code>."
    Back: <ul><li><code>impl Deref for A</code> — <code>A</code> is a smart pointer carrying a <code>B</code>; also enables coercions (<code>*a</code>)</li><li><code>impl AsRef&lt;B&gt; for A</code> — <code>A</code> can be cheaply <i>viewed</i> as <code>B</code> (<code>a.as_ref()</code>)</li><li><code>impl AsMut&lt;B&gt; for A</code> — same, mutably (<code>a.as_mut()</code>)</li><li><code>impl Borrow&lt;B&gt; for A</code> — <code>A</code> has a borrowed analog <code>B</code> that behaves the same under <code>Eq</code>/<code>Hash</code> (<code>a.borrow()</code>)</li><li><code>impl ToOwned for A</code> — <code>A</code> has an owned analog it can produce (<code>a.to_owned()</code>)</li></ul>
  tags:
    - rust
    - type-conversions
    - traits
- noteId: cg-tc-covariance-shared-ref
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Why does <code>&amp;'a &amp;'static u8</code> substitute for <code>&amp;'a &amp;'b u8</code>, while <code>&amp;'a mut &amp;'static u8</code> does <b>not</b> substitute for <code>&amp;'a mut &amp;'b u8</code>?
    Back: <code>&amp;T</code> is covariant in <code>T</code> — since <code>&amp;'static u8</code> is itself a subtype of <code>&amp;'b u8</code>, wrapping both in a shared <code>&amp;'a</code> preserves the relationship. <code>&amp;mut T</code> is invariant in <code>T</code> — through a mutable reference you could write a shorter-lived value into a slot the caller believes lives forever, so substitution is disallowed in both directions.
  tags:
    - rust
    - type-conversions
    - variance
- noteId: cg-tc-deref-coercion
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: What is Deref coercion?
    Back: If <code>T</code> implements <code>Deref&lt;Target=U&gt;</code>, a <code>&amp;T</code> automatically coerces to <code>&amp;U</code> wherever needed — e.g. <code>&amp;String</code> to <code>&amp;str</code>.
  tags:
    - rust
    - type-conversions
    - coercion
- noteId: cg-tc-five-ways
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: What are the five general ways to convert a value of type <code>A</code> into <code>B</code> in Rust?
    Back: <ul><li><b>Identity</b> — <code>B</code> is exactly <code>A</code></li><li><b>Computation</b> — write code that builds a new <code>B</code> from <code>A</code>'s data</li><li><b>Casts</b> — explicit, on-demand conversion with the <code>as</code> keyword; caution needed</li><li><b>Coercions</b> — automatic conversion under a "weakening" ruleset</li><li><b>Subtyping</b> — automatic conversion between types differing only in lifetimes</li></ul>
  tags:
    - rust
    - type-conversions
    - overview
- noteId: cg-tc-fn-variance
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: For <code>fn(T) -&gt; U</code>, is the parameter type <code>T</code> covariant or contravariant? What about the return type <code>U</code>?
    Back: The parameter is contravariant, the return type is covariant. A function accepting <code>&amp;'a u8</code> can stand in for one expecting <code>&amp;'static u8</code> (it accepts even more inputs), but not the reverse — while a function returning <code>&amp;'static u8</code> can stand in for one returning <code>&amp;'a u8</code>.
  tags:
    - rust
    - type-conversions
    - variance
- noteId: cg-tc-from-into
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: What does implementing <code>From&lt;A&gt; for B</code> give you, and how do you use it at the call site?
    Back: "It's an always-valid, infallible conversion. Implementing <code>From&lt;A&gt; for B</code> automatically gives you the reverse-direction method: <code>let b: B = a.into();</code>"
  tags:
    - rust
    - type-conversions
    - traits
- noteId: cg-tc-higher-ranked
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Why can a function of type <code>for&lt;'r&gt; fn(&amp;'r u8)</code> be used wherever <code>fn(&amp;'a u8)</code> is expected, for any concrete <code>'a</code>?
    Back: The higher-ranked type works for every possible lifetime, so it necessarily also works for the one specific lifetime <code>'a</code> the caller needs — it's a subtype of every one of its monomorphic instantiations.
  tags:
    - rust
    - type-conversions
    - lifetimes
- noteId: cg-tc-not-subtyping
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Why isn't <code>u8</code> a subtype of <code>u16</code>, even though every <code>u8</code> value fits inside a <code>u16</code>?
    Back: Subtyping in Rust only ever varies lifetimes, never data representation. <code>u8</code> and <code>u16</code> have genuinely different layouts, so no subtype relation exists in either direction — even though a numeric conversion is possible via <code>as</code> or <code>From</code>.
  tags:
    - rust
    - type-conversions
    - lifetimes
- noteId: cg-tc-static-subtype-of-all
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: What does it mean that <code>'static</code> is 'a subtype of all other lifetimes'?
    Back: The general rule is that a longer lifetime is a subtype of any shorter lifetime it outlives. <code>'static</code> outlives everything, so any reference that lives forever can always stand in for one that only needs to live for some shorter <code>'a</code>.
  tags:
    - rust
    - type-conversions
    - lifetimes
- noteId: cg-tc-subtyping-basic
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Is <code>&amp;'static u8</code> a valid substitute for <code>&amp;'a u8</code>? What about the reverse?
    Back: <code>&amp;'static u8 → &amp;'a u8</code> is valid — a pointer that lives forever can stand in for one that only needs to live for <code>'a</code>. The reverse, <code>&amp;'a u8 → &amp;'static u8</code>, is invalid — a transient pointer can't be promoted to live forever.
  tags:
    - rust
    - type-conversions
    - lifetimes
- noteId: cg-tc-transitivity
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: If <code>T</code> coerces to <code>U</code>, and <code>U</code> coerces to <code>V</code>, does <code>T</code> coerce directly to <code>V</code>?
    Back: Yes — coercions are transitive; the compiler chains them automatically.
  tags:
    - rust
    - type-conversions
    - coercion
- noteId: cg-tc-trojan-horse
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Is converting <code>&amp;'a mut u8</code> to <code>&amp;'a u8</code> an example of subtyping?
    Back: No — it's a coercion, not subtyping (sometimes called the 'Trojan horse' case). It still compiles, but weakening a unique reference to a shared one is a different mechanism than lifetime subtyping.
  tags:
    - rust
    - type-conversions
    - coercion
- noteId: cg-tc-tryfrom-tryinto
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: How do you express a conversion that might fail?
    Back: Implement <code>TryFrom&lt;A&gt; for B</code>. Callers use <code>a.try_into()?</code>, which returns a <code>Result</code>.
  tags:
    - rust
    - type-conversions
    - error-handling
- noteId: cg-tc-unsizing-coercion
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: What is unsizing coercion, and which three cases does it cover by default?
    Back: "It converts a sized type <code>T</code> to an unsized <code>U</code> when <code>T</code> implements <code>CoerceUnsized&lt;U&gt;</code>. Built-in cases: <code>[T; n] → [T]</code>, <code>T → dyn Trait</code> (if <code>T</code> implements that trait), and <code>Foo&lt;T&gt; → Foo&lt;U&gt;</code> for certain wrapper types under specific rules."
  tags:
    - rust
    - type-conversions
    - coercion
- noteId: cg-tc-variance-definitions
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Type Conversions
  fields:
    Front: Define covariant, contravariant, and invariant in terms of a type constructor <code>T[X]</code>.
    Back: "<ul><li><b>Covariant</b>: if <code>A</code> is a subtype of <code>B</code>, then <code>T[A]</code> is a subtype of <code>T[B]</code>.</li><li><b>Contravariant</b>: if <code>A</code> is a subtype of <code>B</code>, then <code>T[B]</code> is a subtype of <code>T[A]</code> (reversed).</li><li><b>Invariant</b>: neither direction holds — <code>T[A]</code> and <code>T[B]</code> are unrelated regardless of <code>A</code>/<code>B</code>.</li></ul>"
  tags:
    - rust
    - type-conversions
    - variance
- noteId: tg1-array-length-is-const-generic
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Why are <code>[u8; 0]</code> and <code>[u8; 1]</code> different, unrelated types?
    Back: The array length <code>N</code> in <code>[T; N]</code> is a const generic parameter, not a runtime value. Each concrete <code>N</code> instantiates its own distinct type, with its own fixed size baked in.
  tags:
    - rust
    - types-traits-generics
    - generics
    - const-generics
- noteId: tg1-associated-fn-vs-method
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Associated function vs. method &mdash; syntax difference?
    Back: "An <b>associated function</b> is called on the type itself, no <code>self</code> parameter: <code>Port::new(80)</code>. A <b>method</b> is called on an instance via dot syntax and takes <code>self</code>: <code>port.close()</code>."
  tags:
    - rust
    - types-traits-generics
    - impl-blocks
- noteId: tg1-blanket-impl-def
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What is a blanket implementation?
    Back: "A generic trait impl written for every type that satisfies some bound, not just one concrete type.<pre><code>impl&lt;T&gt; Serialize for T where T: ToHex { &hellip; }</code></pre>This grants <code>Serialize</code> to any type that already implements <code>ToHex</code>."
  tags:
    - rust
    - types-traits-generics
    - generics
    - blanket-impls
- noteId: tg1-blanket-impl-use-case
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Why are blanket implementations useful?
    Back: They grant a trait's functionality to many types at once &mdash; including foreign ones you don't own &mdash; as long as those types already implement some other trait your blanket impl depends on. A modular way to extend behavior without touching each type individually.
  tags:
    - rust
    - types-traits-generics
    - generics
    - blanket-impls
- noteId: tg1-bounds-purpose
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What do trait bounds do for a generic parameter?
    Back: They restrict which concrete types <code>T</code> may be instantiated with, requiring <code>T</code> be a member of a given trait's list. That's what lets code inside the generic item safely call that trait's methods on values of type <code>T</code>.
  tags:
    - rust
    - types-traits-generics
    - trait-bounds
- noteId: tg1-cast-vs-coercion
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Cast vs. coercion &mdash; how do they differ?
    Back: "A <b>cast</b> is an explicit, manual conversion using <code>as</code>: <code>0_i8 as u8</code>. A <b>coercion</b> is an implicit, automatic conversion the compiler inserts only when considered safe: <code>let x: &amp;u8 = &amp;mut 0_u8;</code>."
  tags:
    - rust
    - types-traits-generics
    - casts-coercions
- noteId: tg1-compound-bounds
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "What does <code>where T: X + Y</code> require of <code>T</code>?"
    Back: <code>T</code> must implement both trait <code>X</code> and trait <code>Y</code> &mdash; each <code>+</code> further narrows eligible types to those on both membership lists at once.
  tags:
    - rust
    - types-traits-generics
    - trait-bounds
- noteId: tg1-const-generics-def
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What is a const generic?
    Back: "A generic parameter standing for a constant value rather than a type &mdash; e.g. the <code>N</code> in <code>[T; N]</code> or <code>struct S&lt;const N: usize&gt;</code>. Varying it produces a family of distinct concrete types, like <code>S&lt;1&gt;</code>, <code>S&lt;6&gt;</code>, <code>S&lt;123&gt;</code>."
  tags:
    - rust
    - types-traits-generics
    - generics
    - const-generics
- noteId: tg1-conversion-vs-subtyping
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: How do casts/coercions differ from true subtyping?
    Back: Casts and coercions convert a value from one set (e.g. <code>u8</code>) to another (e.g. <code>u16</code>), possibly emitting real instructions to do it. True subtyping would mean the type and its "subtype" share the same value set (so <code>0_u8</code> and <code>0_u16</code> would literally be the same value) and conversion would be a pure compile-time check. Rust doesn't use subtyping for ordinary types &mdash; only, loosely, for lifetimes.
  tags:
    - rust
    - types-traits-generics
    - casts-coercions
    - subtyping
- noteId: tg1-distinct-types-not-interchangeable
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Are <code>u8</code>, <code>&amp;u8</code>, and <code>&amp;mut u8</code> interchangeable?
    Back: "No &mdash; they are entirely distinct types. A parameter of type <code>T</code> only accepts values of exactly <code>T</code>: <code>f(0_u8)</code> can't be called as <code>f(&amp;0_u8)</code>, and <code>f(&amp;mut my_u8)</code> can't be called as <code>f(&amp;my_u8)</code>. Even <code>u8</code> vs <code>i8</code> is a hard boundary."
  tags:
    - rust
    - types-traits-generics
    - type-system
- noteId: tg1-generic-impl-block
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "What does <code>impl&lt;T&gt; S&lt;T&gt; where T: Bound { }</code> describe?"
    Back: A generic implementation &mdash; one recipe applying to the whole family of types <code>S&lt;T&gt;</code>, for any <code>T</code> meeting the bound. Third parties materialize a concrete impl just by using <code>S</code> with some concrete <code>T</code>, the same way type constructors materialize concrete types.
  tags:
    - rust
    - types-traits-generics
    - generics
    - impl-blocks
- noteId: tg1-generic-parameter-T
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What does the <code>T</code> in <code>Vec&lt;T&gt;</code> represent?
    Back: A placeholder &mdash; a "variable name for a type" &mdash; that a user fills with something concrete, e.g. <code>Vec&lt;f32&gt;</code>. <code>T</code> is just a convention; any identifier works.
  tags:
    - rust
    - types-traits-generics
    - generics
- noteId: tg1-impl-trait-for-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What does <code>impl A for B { }</code> do, in membership-list terms?
    Back: It adds type <code>B</code> to trait <code>A</code>'s membership list &mdash; from that point on, <code>B</code> is considered to implement <code>A</code> and gains its behavior.
  tags:
    - rust
    - types-traits-generics
    - traits
- noteId: tg1-inherent-impl
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What is an inherent implementation?
    Back: |-
      An <code>impl</code> block attached directly to a type, providing behavior considered related to it &mdash; without going through any trait.<pre><code>impl Port {
          fn f() { &hellip; }
      }</code></pre>
  tags:
    - rust
    - types-traits-generics
    - impl-blocks
- noteId: tg1-many-bounds-intuition
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "Is a long trait-bound list, e.g. <code>T: A + B + C + D + E</code>, conceptually complex?"
    Back: Not really &mdash; despite looking intimidating, each additional <code>+ Trait</code> is just one more filter cutting down the space of eligible types. It's successive narrowing, not compounding complexity.
  tags:
    - rust
    - types-traits-generics
    - trait-bounds
- noteId: tg1-marker-trait
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What is a marker trait?
    Back: "A trait with no methods at all &mdash; it exists only to mark membership. Example: <code>trait Copy {}</code>. Implementing it declares \"this type's memory may be copied bitwise,\" with no methods to call."
  tags:
    - rust
    - types-traits-generics
    - traits
    - marker-traits
- noteId: tg1-monomorphization-intuition
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "Given <code>impl&lt;T&gt; S&lt;T&gt; { fn f(&amp;self, x: T) {&hellip;} }</code>, what happens when the compiler sees <code>s.f(0_u32); s.f('x');</code>?"
    Back: It checks that <code>u32</code> and <code>char</code> satisfy <code>T</code>'s bounds, then generates a separate concrete version of <code>f</code> for each type actually used &mdash; one specialized for <code>u32</code>, another for <code>char</code>.
  tags:
    - rust
    - types-traits-generics
    - generics
    - monomorphization
- noteId: tg1-no-cross-type-equality
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Does <code>0_u8 == 0_u16</code> compile in Rust?
    Back: No. Rust doesn't define <code>==</code> across two different types, even when the underlying value looks identical (<code>0</code>). This is deliberate &mdash; comparing across types is usually a mistake, not something to allow silently.
  tags:
    - rust
    - types-traits-generics
    - type-system
- noteId: tg1-orphan-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Who is allowed to write <code>impl Eat for Venison</code>?
    Back: Only code in the crate that defines <code>Venison</code>, or the crate that defines <code>Eat</code> &mdash; not any arbitrary third crate. This coherence rule prevents two unrelated crates from providing conflicting implementations of the same trait for the same type.
  tags:
    - rust
    - types-traits-generics
    - traits
    - coherence
- noteId: tg1-related-is-convention
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Does Rust enforce that an inherent impl's methods be conceptually related to the type?
    Back: No. "Related" is a convention, not a compiler rule &mdash; nothing stops <code>u8::play_sound()</code> from existing except good taste.
  tags:
    - rust
    - types-traits-generics
    - impl-blocks
- noteId: tg1-sized-trait
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What's special about the <code>Sized</code> trait, compared to traits you implement yourself?
    Back: It's outside your control &mdash; the compiler grants it automatically to any type whose size is known at compile time. A type simply is or isn't <code>Sized</code>; you never write <code>impl Sized for &hellip;</code> yourself.
  tags:
    - rust
    - types-traits-generics
    - traits
    - sized
- noteId: tg1-trait-as-membership-list
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: How can a trait be thought of, conceptually?
    Back: "As a membership list: every type that implements the trait is added to that list and thereby gains the trait's behavior. Inside the trait's own definition, <code>Self</code> stands for whichever type is currently on the list."
  tags:
    - rust
    - types-traits-generics
    - traits
- noteId: tg1-trait-purpose
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What problem do traits solve?
    Back: They let one author declare a piece of abstract behavior ("this trait means X"), and let other, unrelated types opt into (implement) that behavior independently of the trait's own definition.
  tags:
    - rust
    - types-traits-generics
    - traits
- noteId: tg1-trait-required-vs-provided
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Required vs. provided methods in a trait definition &mdash; what's the difference?
    Back: |-
      A <b>required</b> method has no body; every implementer must supply one. A <b>provided</b> method ships with a default body from the trait author, and implementers may use it as-is or override it.<pre><code>trait ShowHex {
          fn as_hex() -&gt; String; // required
          fn print_hex() {}      // provided
      }</code></pre>
  tags:
    - rust
    - types-traits-generics
    - traits
- noteId: tg1-traits-vs-interfaces-declare-time
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Traits vs. Java-style interfaces &mdash; when must a type commit to implementing a piece of behavior?
    Back: "Java interfaces: exhaustively, at the type's own definition &mdash; its author must decide up front whether it implements the interface. Rust traits: can be added later, by someone other than the type's original author, at any point after the type already exists."
  tags:
    - rust
    - types-traits-generics
    - traits
    - interfaces
- noteId: tg1-traits-vs-interfaces-import
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Why does calling a trait method in Rust often require importing the trait itself, not just the type?
    Back: Trait methods are only callable when the trait is in scope. So even with <code>use food::Venison;</code> already in place, calling <code>venison.eat()</code> also needs <code>use tasks::Eat;</code> &mdash; importing the type alone isn't enough.
  tags:
    - rust
    - types-traits-generics
    - traits
    - interfaces
- noteId: tg1-type-constructor-def
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Is <code>Vec&lt;&gt;</code> (with no parameter filled in) itself a type?
    Back: No. It's a <b>type constructor</b> &mdash; a template/recipe for producing types. It occupies no memory and can't be compiled into code on its own. Only once a parameter is supplied, e.g. <code>Vec&lt;u8&gt;</code>, does it become a real, concrete type.
  tags:
    - rust
    - types-traits-generics
    - generics
- noteId: tg1-type-definition
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What is a type, in the "set of values" sense used throughout this cheat sheet?
    Back: A set of values that share given semantics and memory layout. E.g. <code>u8</code> is the set <code>{0, 1, &hellip;, 255}</code>; <code>char</code> is the set of valid Unicode scalar values.
  tags:
    - rust
    - types-traits-generics
    - type-system
- noteId: tg1-where-bound-syntax
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Write a bound requiring struct <code>Num&lt;T&gt;</code>'s parameter to implement <code>Absolute</code>.
    Back: |-
      <pre><code>struct Num&lt;T&gt; where T: Absolute {
          &hellip;
      }</code></pre>Only types on <code>Absolute</code>'s membership list can instantiate <code>Num&lt;T&gt;</code>.
  tags:
    - rust
    - types-traits-generics
    - trait-bounds
- noteId: tg2-blanket-impl-family
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What's the difference between <code>impl A&lt;u32&gt; for X {}</code> and <code>impl&lt;T&gt; A&lt;T&gt; for Y {}</code> in terms of who can extend the trait relation?
    Back: <code>impl A&lt;u32&gt; for X</code> adds one specific row <code>(X, u32)</code>. <code>impl&lt;T&gt; A&lt;T&gt; for Y</code> adds a whole <i>family</i> of rows <code>(Y, T)</code> for any <code>T</code> &mdash; effectively letting the caller pick <code>T</code> and materialize the impl.
  tags:
    - rust
    - traits
    - generics
    - api-design
- noteId: tg2-complex-invalid-impl
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Why is it invalid to have two impls of the same trait that share identical input parameters but produce different associated-type outputs?
    Back: "Because outputs must be a function of inputs: once <code>(Self, I1, I2, &hellip;)</code> is fixed, the output types are already uniquely determined &mdash; a second impl with the same inputs but a different output would violate that."
  tags:
    - rust
    - generics
    - traits
    - associated-types
- noteId: tg2-complex-trait-inputs-outputs
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: For <code>trait Complex&lt;I1, I2&gt; { type O1; type O2; }</code>, how many inputs and outputs does the trait relation have?
    Back: 3 inputs (<code>Self</code>, <code>I1</code>, <code>I2</code>) and 2 outputs (<code>O1</code>, <code>O2</code>). The relation holds <code>(Self, I1, I2) =&gt; (O1, O2)</code>.
  tags:
    - rust
    - generics
    - traits
    - associated-types
- noteId: tg2-dst-definition
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What is a dynamically sized type (DST)? Give examples.
    Back: "A type that is not <code>Sized</code> &mdash; its size isn't known at compile time. Examples: <code>str</code>, slices like <code>[u8]</code>, and <code>dyn Trait</code>."
  tags:
    - rust
    - generics
    - sized
    - dst
- noteId: tg2-dst-field-propagates
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "If <code>struct B { x: [u8] }</code> has a DST field, what happens to <code>B</code> itself?"
    Back: <code>B</code> becomes a DST too &mdash; it does not implement <code>Sized</code>, since one of its fields has unknown size.
  tags:
    - rust
    - generics
    - sized
    - dst
- noteId: tg2-dyn-trait-unsized
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Is <code>dyn Trait</code> a <code>Sized</code> type? Why does this matter in practice?
    Back: No, <code>dyn Trait</code> is unsized &mdash; its actual size depends on whatever concrete type implements the trait. That's why trait objects are always used behind a pointer, e.g. <code>&amp;dyn Trait</code> or <code>Box&lt;dyn Trait&gt;</code>.
  tags:
    - rust
    - generics
    - sized
    - dyn-trait
- noteId: tg2-from-vs-deref-params
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Concretely, is <code>From&lt;I&gt;</code>'s <code>I</code> an input or output parameter? What about <code>Deref</code>'s associated type?
    Back: "<code>From&lt;I&gt;</code>: <code>I</code> is an <b>input</b> parameter &mdash; e.g. <code>impl From&lt;u8&gt; for u16 {}</code>.<br><code>Deref</code>: its associated type is an <b>output</b> parameter &mdash; e.g. <code>impl Deref for Port { type O = u8; }</code>."
  tags:
    - rust
    - generics
    - traits
    - associated-types
- noteId: tg2-generic-implicit-sized-bound
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Do generic type parameters carry an implicit bound? Which one?
    Back: "Yes &mdash; a bare generic parameter like <code>T</code> in <code>struct C&lt;T&gt; { x: T }</code> implicitly requires <code>T: Sized</code>. So <code>C&lt;A&gt;</code> (A sized) is valid but <code>C&lt;B&gt;</code> (B a DST) is not."
  tags:
    - rust
    - generics
    - sized
    - trait-bounds
- noteId: tg2-input-output-naming-caveat
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Is a trait's "output" parameter always used as a function's return type?
    Back: "No. \"Input\"/\"output\" describes the trait's own type relation (what determines what), not the function signature. In <code>fn search(&amp;self, needle: Self::O)</code>, the output-parameter <code>O</code> is actually used as a function <i>parameter</i> type, not a return type."
  tags:
    - rust
    - traits
    - associated-types
    - generics
- noteId: tg2-input-param-who-controls
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: When a trait has an input parameter (e.g. <code>trait A&lt;I&gt;</code>), who ends up choosing which <code>I</code> is used?
    Back: The trait author assumes the implementor may want to support multiple <code>I</code>s for the same <code>Self</code> type, and that the caller/user should be able to pick which <code>I</code>-flavored impl to invoke.
  tags:
    - rust
    - traits
    - generics
    - api-design
- noteId: tg2-lifetime-as-type-param
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: In what sense do lifetimes act like type parameters on a generic struct such as <code>S&lt;'a&gt;</code>?
    Back: "Instantiating with a different lifetime produces a different type, just like instantiating with a different type would: <code>S&lt;'p&gt;</code> and <code>S&lt;'q&gt;</code> are distinct types, the same way <code>Vec&lt;f32&gt;</code> and <code>Vec&lt;u8&gt;</code> are distinct."
  tags:
    - rust
    - generics
    - lifetimes
    - type-system
- noteId: tg2-lifetime-assignment-restriction
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Can a value of type <code>S&lt;'a&gt;</code> be assigned to a variable expecting <code>S&lt;'b&gt;</code>?
    Back: Not in general &mdash; they're distinct types. The exception is when a subtype relationship holds between the lifetimes, i.e. <code>'a</code> outlives <code>'b</code>.
  tags:
    - rust
    - generics
    - lifetimes
    - type-system
- noteId: tg2-lifetime-elision-nongeneric
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "Given <code>struct S&lt;'a&gt; { x: &amp;'a u32 }</code>, how do you usually write a variable's type in ordinary (non-generic) code &mdash; <code>let b: S&lt;'a&gt;</code> or something else?"
    Back: "Usually omit the lifetime and let Rust infer it: <code>let b: S;</code>. Explicitly naming a lifetime is mostly limited to <code>'static</code>, e.g. <code>let a: S&lt;'static&gt;;</code>."
  tags:
    - rust
    - generics
    - lifetimes
    - type-system
- noteId: tg2-opt-out-sized-bound
  modelName: Cloze
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Text: "To let a generic parameter accept unsized types, opt out of the implicit <code>Sized</code> bound: <code>struct D&lt;T: {{c1::?Sized}}&gt; { x: T }</code>."
    Back Extra: Now <code>D&lt;B&gt;</code> is valid even when <code>B</code> is a DST.
  tags:
    - rust
    - generics
    - sized
    - trait-bounds
- noteId: tg2-output-determined-by-input
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What rule must hold between a trait's input parameters (including <code>Self</code>) and its output (associated type) parameters?
    Back: "Outputs must be uniquely determined by inputs &mdash; like a mathematical function: <code>(Self, I...) =&gt; (O...)</code>. The same combination of inputs can't map to two different outputs across impls."
  tags:
    - rust
    - generics
    - traits
    - associated-types
- noteId: tg2-output-param-who-controls
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: When a trait has an output parameter (associated type, e.g. <code>trait B { type O; }</code>), who decides its value, and can the caller influence it?
    Back: The <b>implementor</b> decides one specific <code>O</code> per <code>Self</code> type when writing the impl. The caller has no say &mdash; it's fixed, not chosen at the call site.
  tags:
    - rust
    - traits
    - generics
    - api-design
- noteId: tg2-query-both-in-out
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "What does combining an input parameter and an output associated type buy you, e.g. <code>trait Query&lt;I&gt; { type O; fn search(&amp;self, needle: I) -&gt; Self::O; }</code>?"
    Back: The caller picks which input type <code>I</code> to search with, and for each <code>(Self, I)</code> pair the implementor fixes a specific result type <code>O</code> &mdash; supporting multiple input types while keeping each one's output type-safe and implementation-determined.
  tags:
    - rust
    - traits
    - generics
    - associated-types
- noteId: tg2-query-input-param
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "For <code>trait Query&lt;I&gt; { fn search(&amp;self, needle: I); }</code>, what does adding the input parameter <code>I</code> let implementors and callers do?"
    Back: The implementor can provide multiple impls for the same <code>Self</code>, each accepting a different <code>I</code> (e.g. <code>Query&lt;&amp;str&gt;</code> and <code>Query&lt;String&gt;</code> for <code>PostgreSQL</code>), and the caller picks which <code>I</code>-typed overload to call.
  tags:
    - rust
    - traits
    - api-design
    - generics
- noteId: tg2-query-no-params
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "For <code>trait Query { fn search(&amp;self, needle: &amp;str); }</code> (no extra parameters), what does the trait author assume?"
    Back: Neither the implementor nor the caller needs to customize the API &mdash; one fixed method signature works for every implementing type.
  tags:
    - rust
    - traits
    - api-design
    - generics
- noteId: tg2-query-output-param
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "For <code>trait Query { type O; fn search(&amp;self, needle: Self::O); }</code>, what does the associated type <code>O</code> let the implementor do, and what can the caller not do?"
    Back: The implementor customizes the type used by <code>search</code> once per <code>Self</code> (e.g. <code>O = String</code> for <code>PostgreSQL</code>, <code>O = Vec&lt;u8&gt;</code> for <code>Sled</code>). The caller cannot choose or influence <code>O</code> &mdash; it's fixed by the impl.
  tags:
    - rust
    - traits
    - api-design
    - associated-types
- noteId: tg2-question-mark-meaning
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: "How does <code>?Sized</code> differ conceptually from a normal trait bound like <code>T: SomeTrait</code>?"
    Back: A normal bound <i>adds</i> a requirement. <code>?Sized</code> <i>relaxes</i> (removes) an implicit default bound that's already there. <code>Sized</code> is the only trait bound that works this special "maybe not" way.
  tags:
    - rust
    - generics
    - sized
    - trait-bounds
- noteId: tg2-self-by-value-dst-issue
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: For <code>trait G { fn g(self); }</code> (self taken by value), why might <code>impl G for SomeDST</code> still fail to be usable, even though traits have no implicit Sized bound?
    Back: Passing <code>self</code> by value requires putting it on the stack, which needs a known size. A DST can't satisfy that, so the by-value method effectively demands <code>Sized</code> at the call site even though the trait itself doesn't.
  tags:
    - rust
    - traits
    - sized
    - dst
- noteId: tg2-sized-auto-impl
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Can you write <code>impl Sized for MyType {}</code> yourself?
    Back: No. <code>Sized</code> is implemented automatically by the compiler for eligible types; it cannot be manually implemented.
  tags:
    - rust
    - generics
    - sized
    - marker-traits
- noteId: tg2-sized-meaning
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What does it mean for a type <code>T</code> to be <code>Sized</code>?
    Back: Its size in bytes is known at compile time. <code>u8</code> and <code>&amp;[u8]</code> are <code>Sized</code>; <code>[u8]</code> itself is not.
  tags:
    - rust
    - generics
    - sized
    - marker-traits
- noteId: tg2-static-lifetime-special
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What makes <code>'static</code> different from other lifetimes when writing types explicitly?
    Back: <code>'static</code> is the only lifetime that's globally available and can be explicitly named in non-generic code. Other specific lifetimes generally can't be written by hand &mdash; the compiler determines them for you.
  tags:
    - rust
    - generics
    - lifetimes
    - static
- noteId: tg2-trait-as-relation
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: How can you picture a generic trait with input/output parameters as a table?
    Back: "Each column is a parameter: <code>Self</code> is always the first input column, other generic parameters (<code>I</code>) are more input columns, and associated types (<code>O</code>) are output columns. Each <code>impl</code> adds one row to that table."
  tags:
    - rust
    - generics
    - traits
    - associated-types
- noteId: tg2-trait-no-implicit-sized
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: Do traits have an implicit <code>Sized</code> bound on <code>Self</code>, the way generic struct parameters do?
    Back: "No. A trait like <code>trait F { fn f(&amp;self); }</code> has no implicit <code>Self: Sized</code> bound, so <code>impl F for B {}</code> is valid even if <code>B</code> is a DST."
  tags:
    - rust
    - traits
    - sized
    - trait-bounds
- noteId: tg2-trait-param-kinds
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: A trait can be generic over two kinds of parameters. What are they, and how is each written?
    Back: "<b>Input</b> parameters: ordinary generic parameters on the trait itself, e.g. <code>trait From&lt;I&gt; {}</code>.<br><b>Output</b> parameters: associated types, e.g. <code>trait Deref { type O; }</code>."
  tags:
    - rust
    - generics
    - traits
    - associated-types
- noteId: tg2-trait-sized-supertrait
  modelName: Cloze
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Text: "A trait can opt into requiring <code>Sized</code> implementors via a supertrait bound: <code>trait F: {{c1::Sized}} {}</code>."
    Back Extra: "Without this, traits do not require Self: Sized by default."
  tags:
    - rust
    - traits
    - sized
    - trait-bounds
- noteId: tg2-zst-definition
  modelName: Basic
  deckName: Rust Cheat Sheet::Working with Types::Types, Traits, Generics
  fields:
    Front: What is a zero sized type (ZST)? Is it <code>Sized</code>?
    Back: A type with no data that consumes zero bytes at runtime, e.g. <code>struct E;</code>. It is still <code>Sized</code> &mdash; its (zero) size is known at compile time.
  tags:
    - rust
    - generics
    - sized
    - zst
