- noteId: tool-fragment-tt
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:tt</code> capture?
    Back: A single token tree &mdash; one token, or a balanced group delimited by <code>()</code>, <code>[]</code>, or <code>{}</code>.
  tags:
