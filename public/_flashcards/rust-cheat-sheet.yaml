- noteId: tool-fragment-pat-vs-pat-param
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What's the difference between the macro fragment specifiers <code>$x:pat</code> and <code>$x:pat_param</code>?
    Back: <code>$x:pat</code> matches any pattern, including a top-level <code>|</code> alternation (e.g. <code>x | y</code>). <code>$x:pat_param</code> matches only the subset without a top-level <code>|</code>, e.g. <code>Some(x)</code> or <code>x</code>.
  tags:
