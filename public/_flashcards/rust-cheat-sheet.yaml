- noteId: tool-fragment-ty
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:ty</code> capture?
    Back: A type, e.g. <code>String</code>, <code>usize</code>, <code>Vec&lt;u8&gt;</code>.
  tags:
