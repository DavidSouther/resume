- noteId: tool-buildrs-rerun-if
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What's the difference between <code>cargo::rerun-if-changed=PATH</code> and <code>cargo::rerun-if-env-changed=VAR</code>, printed from <code>build.rs</code>?
    Back: <code>rerun-if-changed</code> re-runs the build script only if the file/directory at <code>PATH</code> changes. <code>rerun-if-env-changed</code> re-runs it only if environment variable <code>VAR</code> changes. Without either, cargo may re-run the script on every build.
  tags:
