    - strings
- noteId: sl-oneliner-split-regex
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: split a string using a regular expression?"
    Back: <code>Regex::new(r"\s")?.split("one two three")</code><br>Needs the external <code>regex</code> crate &mdash; not part of <code>std</code>.
  tags:
    - rust
    - standard-library
    - one-liners
    - strings
- noteId: sl-oneliner-split-whitespace
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: split a string on runs of whitespace?"
    Back: <code>s.split_whitespace()</code>
  tags:
