- noteId: tool-doc-test-modifiers
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What do the doc-test fence modifiers <code>should_panic</code>, <code>no_run</code>, <code>compile_fail</code>, <code>ignore</code>, and <code>edition2018</code> each do?
    Back: "<code>should_panic</code>: compile and run, must panic to pass.<br><code>no_run</code>: compile only, fail if it won't compile, don't run it.<br><code>compile_fail</code>: compile only, and fail the test if it <em>does</em> compile.<br><code>ignore</code>: neither compile nor run (prefer one of the above instead).<br><code>edition2018</code>: execute the snippet as Rust 2018 (the implicit default is Rust 2015)."
  tags:
