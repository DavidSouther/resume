- noteId: tool-doc-test-hide-line
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does a leading <code>#</code> on a line inside a doc-test code fence do?
    Back: Hides that line from the rendered documentation while still including it in the compiled test, e.g. <code># use x::hidden;</code>.
