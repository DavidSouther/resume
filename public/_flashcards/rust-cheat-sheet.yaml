    - one-liners
    - strings
- noteId: sl-oneliner-split-pattern
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: split a string by a separator pattern?"
    Back: |-
      <code>s.split(pattern)</code> &mdash; the pattern can be a string, a char, or a closure:<br>
      <pre><code>s.split("abc")
      s.split('/')
      s.split(char::is_numeric)</code></pre>
  tags:
    - rust
