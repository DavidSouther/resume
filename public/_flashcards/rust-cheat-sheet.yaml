- noteId: tool-fragment-literal
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:literal</code> capture?
    Back: A literal value, e.g. <code>3</code>, <code>"foo"</code>, <code>b"bar"</code>.
  tags:
