- noteId: tool-fragment-meta
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:meta</code> capture?
    Back: A meta item &mdash; the content that goes inside <code>#[...]</code> or <code>#![...]</code> attributes.
  tags:
