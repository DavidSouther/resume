- noteId: tool-fragment-vis
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:vis</code> capture?
    Back: A visibility modifier, e.g. <code>pub</code>, <code>pub(crate)</code>.
  tags:
