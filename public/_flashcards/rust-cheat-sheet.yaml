    - attributes
- noteId: tool-fragment-path
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:path</code> capture?
    Back: A path, e.g. <code>foo</code>, <code>::std::mem::replace</code>, <code>transmute::&lt;_, int&gt;</code>.
  tags:
    - rust
    - tooling
    - macros
    - attributes
- noteId: tool-fragment-stmt
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:stmt</code> capture?
    Back: A statement, e.g. <code>let x = 1 + 1;</code>, <code>String::new();</code>, <code>vec![];</code>.
  tags:
