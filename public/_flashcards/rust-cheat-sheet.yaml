- noteId: tool-fragment-lifetime
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does the macro fragment specifier <code>$x:lifetime</code> capture?
    Back: A lifetime, e.g. <code>'a</code> or <code>'static</code>.
  tags:
