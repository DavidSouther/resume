- noteId: cg-idiom-avoid-global-state
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Why is global (<code>static</code>) state riskier in a Rust library than it first appears?
    Back: If your crate is depended on at multiple incompatible versions within one build, each version can get its own copy of the 'global' static — silently duplicating state you assumed was singular.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - cargo
- noteId: cg-idiom-avoid-unsafe
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: What's the guideline on reaching for <code>unsafe {}</code>?
    Back: Avoid it where you can — there's often a safe solution that's just as fast, sometimes faster, without the burden of manually upholding invariants yourself.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - unsafe
- noteId: cg-idiom-builders
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: What pattern handles constructing a type with many optional or named parameters?
    Back: 'The builder pattern: <code>Car::builder().name("Model T").hp(20).build();</code> — chain setter-style calls, then finish with <code>build()</code>, which validates and produces the final value.'
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - api-design
- noteId: cg-idiom-documentation
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: What should a well-documented public API's doc comments include?
    Back: A summary sentence, an <b>Examples</b> section, and — where applicable — <b>Panics</b>, <b>Errors</b>, <b>Safety</b>, and <b>Undefined Behavior</b> sections. These render on docs.rs and tell callers exactly what to expect.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - documentation
- noteId: cg-idiom-dont-panic
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Why does idiomatic Rust say 'don't panic', and what are the exceptions?
    Back: A panic isn't like a catchable exception — by default it suggests the process should abort, so reserve it for programming errors. Prefer <code>Option&lt;T&gt;</code>/<code>Result&lt;T, E&gt;</code> for expected failure. Panicking is fine when the caller clearly opted in (e.g. calling <code>obtain()</code> instead of <code>try_obtain()</code>), or when it happens inside a <code>const { .. }</code> block, where it becomes a compile error instead.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - error-handling
- noteId: cg-idiom-expressions
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Why does idiomatic Rust favor 'thinking in expressions' instead of statements plus mutation?
    Back: "Almost everything in Rust produces a value: <code>y = if x { a } else { b };</code>, <code>y = loop { break 5 };</code>, <code>fn f() -&gt; u32 { 0 }</code>. Writing this way avoids declare-then-assign-later variables and reads closer to the underlying logic."
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - expressions
- noteId: cg-idiom-generics-moderation
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: What's the guideline for how much to reach for generics in an API?
    Back: "A simple bound like <code>&lt;T: AsRef&lt;Path&gt;&gt;</code> can make an API nicer to call. But complex, layered bounds become impossible to follow — when in doubt, don't get creative with generics."
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - generics
- noteId: cg-idiom-illegal-state
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: What does 'make illegal states impossible' mean as a design goal, and give an example?
    Back: "Encode invariants in the type system so the compiler rejects violations at compile time instead of checking them at runtime. Example: <code>thread::scope(|s| { .. })</code> makes it a compile error for a spawned thread to outlive the scope."
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - types
- noteId: cg-idiom-iterators
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: What's the idiomatic alternative to hand-written index loops for processing collections?
    Back: Iterator adapter chains, e.g. <code>(1..10).map(f).collect()</code> or <code>names.iter().filter(|x| x.starts_with("A"))</code>. They compose, avoid off-by-one errors, and often optimize as well as a manual loop.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - iterators
- noteId: cg-idiom-make-const
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Beyond marking functions <code>const fn</code>, what's another way to push work to compile time?
    Back: Run code inside a <code>const { .. }</code> block. Both let the compiler evaluate logic ahead of time where inputs are known statically, moving cost — and even some panics — out of runtime.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - performance
- noteId: cg-idiom-question-mark
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: What does the <code>?</code> operator let you write instead of manually matching on every fallible call?
    Back: "Chain fallible/optional calls directly: <code>y = try_something()?;</code> or <code>get_option()?.run()?</code>. Each <code>?</code> returns early with the <code>Err</code>/<code>None</code>, propagating it to the caller."
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - error-handling
- noteId: cg-idiom-split-impls
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Why would you split <code>impl&lt;T&gt; Point&lt;T&gt;</code> into a generic impl block plus a concrete one like <code>impl Point&lt;f32&gt;</code>?
    Back: The generic block holds methods common to every <code>T</code>; the concrete block adds methods that only make sense for that specific specialization (e.g. floating-point-only math) without forcing every instantiation to carry them.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - generics
- noteId: cg-idiom-strong-types
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Why prefer <code>enum E { Invalid, Valid { .. } }</code> over a sentinel constant like <code>ERROR_INVALID = -1</code>?
    Back: A strong type makes an invalid state a distinct, exhaustively-matched variant instead of a magic value that can be silently ignored or confused with real data. The same reasoning favors <code>enum { Visible, Hidden }</code> over a bare <code>bool</code>, and a newtype like <code>struct Charge(f32)</code> over a bare <code>f32</code> — the type documents intent and blocks mixing up unrelated numbers.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - types
- noteId: cg-idiom-tooling
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Name the four tooling habits recommended for idiomatic Rust projects.
    Back: <ul><li>Run <b>clippy</b> regularly for lint-driven code quality</li><li>Format with <b>rustfmt</b> for consistency</li><li>Add <b>unit tests</b> (<code>#[test]</code>)</li><li>Add <b>doc tests</b> (runnable examples inside doc comments) so docs can't silently drift from the code</li></ul>
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - tooling
- noteId: cg-idiom-unwrap-lock
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Idiomatic Rust
  fields:
    Front: Why is <code>.unwrap()</code> on a lock's <code>PoisonError</code> often the right call, when <code>?</code> is normally preferred for propagating errors?
    Back: A <code>PoisonError</code> means another thread already panicked while holding the lock. Propagating that panic via <code>.unwrap()</code> is usually more honest than swallowing it with <code>?</code>, since the poisoned state likely means your invariants are already broken.
  tags:
    - rust
    - coding-guides
    - idiomatic-rust
    - concurrency
- noteId: cg-perf-append-strings
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What's a lower-allocation way to build up a <code>String</code> than repeated formatting and concatenation?
    Back: <code>write!(&amp;mut s, "{}", value)</code> writes directly into the existing string's buffer instead of allocating a new temporary string per append.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - strings
- noteId: cg-perf-async-when
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: When is reaching for <code>async</code>/<code>await</code> a good performance idea?
    Back: When your code does a lot of 'parallel waiting' — e.g. server I/O — where many tasks are mostly idle waiting on external events rather than using the CPU.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - async
- noteId: cg-perf-avoid-atomics
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why prefer <code>Rc</code> over <code>Arc</code> when a value never crosses a thread boundary?
    Back: <code>Arc</code>'s atomic reference counting has real cost — atomics force synchronization that impacts other memory access, not just the count itself. Needless atomics should be avoided when a non-atomic type would do.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - concurrency
- noteId: cg-perf-avoid-locks
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why avoid locks in multi-threaded code where possible?
    Back: Locks serialize access to shared data, which kills the parallelism you introduced threads to gain in the first place.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - concurrency
- noteId: cg-perf-avoid-trait-objects
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What's the performance tradeoff of using trait objects (<code>dyn Trait</code>) instead of generics?
    Back: Trait objects reduce code size — one shared implementation instead of one per concrete type via monomorphization — but every call goes through a vtable, adding indirection compared to generics' static, potentially-inlined dispatch.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - trait-objects
- noteId: cg-perf-batch-apis
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why design an API to accept a slice of elements rather than calling it once per element?
    Back: Batch APIs amortize per-call overhead (setup, dispatch, bounds checks) across many elements at once instead of paying it for every single item.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - api-design
- noteId: cg-perf-buffered-io
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why is raw <code>File</code> I/O in Rust usually a performance trap, and what fixes it?
    Back: Unbuffered reads/writes make a syscall per operation, which is expensive. Wrapping with <code>BufReader</code>/<code>BufWriter</code> batches many small operations into fewer, larger syscalls.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - io
- noteId: cg-perf-bump-allocations
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What problem does a bump allocator (e.g. the <code>bumpalo</code> crate) solve?
    Back: It cheaply hands out temporary, dynamic memory in hot loops — allocation is just pointer-bumping, and everything frees at once when the arena drops, instead of paying per-allocation cost repeatedly.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - allocation
- noteId: cg-perf-codegen-units
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What's the tradeoff of setting codegen units to <code>1</code>?
    Back: It can produce faster code by giving the optimizer a single, whole-program view, but it slows compile times since codegen can no longer be parallelized across units.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - cargo
- noteId: cg-perf-defer-drop
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What does 'defer drop' mean as a performance technique?
    Back: Dropping a heavy object can itself be expensive (deallocation, recursive drops). Sending it to another thread to be dropped there frees up the current thread immediately instead of blocking on the teardown.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - concurrency
- noteId: cg-perf-false-sharing
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What is false sharing, and how do you avoid it?
    Back: When data written by different CPUs lives on the same cache line, each CPU's write invalidates the other's cached copy even though they're logically touching unrelated data. Keep such data at least 64 bytes apart (a typical cache-line size) to avoid it.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - concurrency
- noteId: cg-perf-faster-hasher
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why might you swap the default <code>HashMap</code> hasher for something like <b>seahash</b>?
    Back: The default hasher is chosen to resist hash-flooding denial-of-service attacks, at the cost of raw speed. If your keys aren't attacker-controlled, a faster non-DoS-resistant hasher can be a meaningful win — but it trades away that resilience.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - collections
- noteId: cg-perf-faster-rng
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: When would you swap a cryptographic RNG for a non-cryptographic one for performance?
    Back: When the randomness doesn't need to resist prediction or attack (e.g. simulations, jitter, sampling) — crypto RNGs pay extra cost for guarantees you don't need in that case.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - random
- noteId: cg-perf-global-allocator
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: When would you swap Rust's default global allocator for something like <b>mimalloc</b>?
    Back: "On platforms where the default allocator is a bottleneck, an external allocator can be meaningfully faster — set it via the <code>#[global_allocator]</code> attribute. It's a tradeoff: an extra dependency and less predictable behavior across platforms."
  tags:
    - rust
    - coding-guides
    - performance-tips
    - allocation
- noteId: cg-perf-keep-data-nearby
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What's the performance argument behind 'data-oriented design' — keeping related, often-used data physically nearby in memory?
    Back: Data accessed together that's stored together loads together into cache, reducing separate memory fetches versus a scattered, pointer-chasing layout.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - data-layout
- noteId: cg-perf-pass-by-size
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: When should you pass a struct by value versus by reference for performance?
    Back: Small structs (roughly 2-3 machine words) are usually best passed by value — copying is cheap and avoids an indirection. Larger structs are better passed by reference, since copying them costs more than the indirection would.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - api-design
- noteId: cg-perf-profilers-limits
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why can't you rely on profilers alone to find every performance opportunity?
    Back: Profilers are indispensable for finding hot spots in code that already exists, but some performance wins — data layout, API shape, algorithmic choices — have to be designed in from the start; a profiler won't surface a better architecture.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - tooling
- noteId: cg-perf-profiling-setup
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What Cargo.toml setting should you add before profiling a release build, and why?
    Back: |-
      <pre><code>[profile.release]
      debug = true</code></pre> Release builds normally strip debug info; keeping it lets a profiler (e.g. Superluminal on Windows, Instruments on macOS) map hot samples back to source locations.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - tooling
- noteId: cg-perf-rating-legend
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: In the performance tips table, what do the boost / simple / tradeoff / risk ratings mean?
    Back: "<ul><li><b>Boost</b>: often a massive (&gt;2x) performance gain</li><li><b>Simple</b>: easy to apply even after the fact</li><li><b>Tradeoff</b>: may carry costly side effects (memory, complexity)</li><li><b>Risk</b>: carries special risks (security, correctness)</li></ul>"
  tags:
    - rust
    - coding-guides
    - performance-tips
    - overview
- noteId: cg-perf-recycle-collections
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why call <code>x.clear()</code> and reuse <code>x</code> instead of dropping it and creating a new collection?
    Back: <code>clear()</code> empties the collection but keeps its already-allocated buffer, so the next round of pushes doesn't need to allocate again.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - collections
- noteId: cg-perf-reduce-data-size
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why prefer <code>u8</code> over <code>u32</code> when the value's range allows it?
    Back: Smaller types mean more values fit in a cache line at once, improving cache use — the same reasoning that favors using niches to shrink enum representations.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - data-layout
- noteId: cg-perf-release-mode
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What is the single highest-leverage, simplest performance change for a Rust build?
    Back: "Build in release mode: <code>cargo build --release</code>. It's both a massive boost and trivial to apply."
  tags:
    - rust
    - coding-guides
    - performance-tips
    - cargo
- noteId: cg-perf-reserve-capacity
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Why call something like <code>Vec::with_capacity</code> up front instead of letting a collection grow organically?
    Back: Pre-allocating avoids repeated reallocate-and-copy as the collection grows, reducing allocation pressure.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - collections
- noteId: cg-perf-simd
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: When does reaching for SIMD (<code>std::simd</code>) pay off most?
    Back: Inside math-heavy batch APIs, where processing multiple values per instruction can give a 2x-8x boost — though as of this cheat sheet the API is still experimental.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - simd
- noteId: cg-perf-soa
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What is 'struct of arrays' (SoA), and why might it beat the default 'array of structs' layout?
    Back: Instead of one array of structs with fields interleaved per element, SoA stores each field in its own parallel array. When code only touches a subset of fields per pass, SoA keeps the accessed data packed tightly, improving cache use.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - data-layout
- noteId: cg-perf-target-cpu
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: How do you tell rustc to optimize for the exact CPU it's running on, and what's the risk?
    Back: Add <code>rustflags = ["-Ctarget-cpu=native"]</code> to <code>config.toml</code>. It's simple, but risky — the resulting binary may run poorly, or not at all, on a different CPU than the one it was built on.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - cargo
- noteId: cg-perf-threading-context
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: Threading is often good for apps but risky inside libraries — why the distinction?
    Back: In an app, threading lowers wait times and improves UX directly. Inside a library's internals, an opaque threading choice bakes in an opinion the caller can't undo. But exposing thread-safety so <i>the library's caller</i> can parallelize their own use of it is usually an excellent idea — that choice belongs to them.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - concurrency
- noteId: cg-perf-unchecked-apis
  modelName: Basic
  deckName: Rust Cheat Sheet::Coding Guides::Performance Tips
  fields:
    Front: What do 'unchecked' APIs (e.g. under <code>unsafe { unchecked_.. }</code>) trade away, and when is that trade acceptable?
    Back: They skip runtime checks — bounds, overflow, and similar — for speed. Only reach for them when you're 100% certain the invariant they'd have checked already holds — getting it wrong is undefined behavior, not a panic.
  tags:
    - rust
    - coding-guides
    - performance-tips
    - unsafe
- noteId: lc-associated-fn-disambiguation
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: What's the difference between <code>X::f()</code> and <code>&lt;X as T&gt;::f()</code>?
    Back: <code>X::f()</code> calls an associated function on <code>X</code> directly (e.g. <code>X::new()</code>). <code>&lt;X as T&gt;::f()</code> disambiguates which trait's <code>f</code> to call, for when <code>X</code> implements multiple traits (or has an inherent method) all named <code>f</code>.
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-await-desugars
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: What does <code>x.await</code> do under the hood, and where can it be used?
    Back: Converts <code>x</code> to a proper future via <code>IntoFuture::into_future()</code>, then repeatedly calls <code>poll()</code>, yielding control back to the executor whenever the result is <code>Poll::Pending</code>. It's only valid inside an <code>async</code> context.
  tags:
    - rust
    - language-constructs
    - async-await
- noteId: lc-block-and-loop-labels
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: "What are <code>'label: {}</code> and <code>'label: loop {}</code> for?"
    Back: They name a block or loop so <code>break 'label</code> (optionally with a value) can target it specifically &mdash; especially useful for breaking out of a particular loop when loops are nested.
  tags:
    - rust
    - language-constructs
    - control-flow
- noteId: lc-break-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: Distinguish <code>break</code>, <code>break x</code>, <code>break 'label</code>, and <code>break 'label x</code>.
    Back: <code>break</code> exits the innermost loop/labelled block with no value. <code>break x</code> exits the innermost <code>loop</code>, making <code>x</code> its resulting value (only valid in an actual <code>loop</code>, since other loop forms don't produce values). <code>break 'label</code> / <code>break 'label x</code> do the same but target a specific named block or loop instead of the innermost one.
  tags:
    - rust
    - language-constructs
    - control-flow
- noteId: lc-call-syntax-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: What are the fully-qualified equivalents of <code>x.f()</code>, and how do they differ?
    Back: <ul><li><code>X::f(x)</code> &mdash; passes <code>x</code> by value; if <code>X</code> isn't <code>Copy</code>, <code>f</code> can effectively only run once on that value.</li><li><code>X::f(&amp;x)</code> / <code>X::f(&amp;mut x)</code> &mdash; matches <code>f</code> taking <code>&amp;self</code> / <code>&amp;mut self</code>.</li><li><code>S::f(&amp;x)</code> &mdash; works if <code>x</code>'s type derefs to <code>S</code>.</li><li><code>T::f(&amp;x)</code> &mdash; works if <code>x</code>'s type implements trait <code>T</code> and <code>T</code> is in scope.</li></ul>
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-continue
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: What's the difference between <code>continue</code> and <code>continue 'label</code>?
    Back: <code>continue</code> skips to the next iteration of the current (innermost) loop. <code>continue 'label</code> skips to the next iteration of an outer loop marked with that label instead.
  tags:
    - rust
    - language-constructs
    - control-flow
- noteId: lc-for-loop-desugars
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: What does <code>for x in collection {}</code> desugar to?
    Back: It converts <code>collection</code> into a proper iterator via <code>IntoIterator::into_iter()</code>, then repeatedly calls <code>Iterator::next()</code>, binding the result to <code>x</code> each time, until the first <code>None</code> is returned.
  tags:
    - rust
    - language-constructs
    - iterators
- noteId: lc-question-mark-operator
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: What does the <code>?</code> operator do when applied to <code>x</code>?
    Back: If <code>x</code> is <code>Err(..)</code> or <code>None</code>, it returns early from the enclosing function, propagating that error/absence outward. Otherwise it unwraps to the contained <code>Ok</code>/<code>Some</code> value and execution continues.
  tags:
    - rust
    - language-constructs
    - error-handling
- noteId: lc-return-scoping
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: Where does <code>return</code> actually exit to, inside a plain block, a closure, and an <code>async</code> block?
    Back: Inside a normal <code>{}</code> block, <code>return</code> exits the surrounding <em>function</em>. Inside a closure, it only exits that closure &mdash; a closure body acts like its own small function. Inside <code>async {}</code>, <code>return</code> likewise only exits that async block, not the function containing it &mdash; a common surprise, since the async block behaves like its own function too.
  tags:
    - rust
    - language-constructs
    - control-flow
- noteId: lc-while-loop
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Control Flow
  fields:
    Front: What does <code>while x {}</code> vs <code>loop {}</code> control?
    Back: <code>while x {}</code> runs the body repeatedly as long as expression <code>x</code> evaluates to true. <code>loop {}</code> runs indefinitely until a <code>break</code> is hit, and can yield a value via <code>break x</code>.
  tags:
    - rust
    - language-constructs
    - control-flow
- noteId: lc-array-vs-slice-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: How do <code>[S]</code>, <code>[S; n]</code>, and <code>[x; n]</code> differ?
    Back: "<ul><li><code>[S; n]</code> &mdash; array <em>type</em>: fixed length <code>n</code> known at compile time, holding elements of type <code>S</code>.</li><li><code>[x; n]</code> &mdash; array <em>instance</em> (expression): <code>n</code> copies of value <code>x</code>.</li><li><code>[S]</code> &mdash; a slice type: an array of unspecified length. It's unsized and can't live directly on the stack; you only ever meet it behind a reference like <code>&amp;[S]</code>.</li></ul>"
  tags:
    - rust
    - language-constructs
    - collections
- noteId: lc-enum-basics
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What can an <code>enum</code> variant look like in Rust, and what is an enum conceptually?
    Back: "An enum is an algebraic data type / tagged union. Variants can be unit-like (<code>A</code>), tuple-like (<code>B(T)</code>), or struct-like (<code>C { x: T }</code>) &mdash; all within one <code>enum E {}</code>."
  tags:
    - rust
    - language-constructs
    - enums
- noteId: lc-enum-discriminant
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What does <code>enum E { A = 1 }</code> do, and what's it typically used for?
    Back: Assigns an explicit discriminant (integer tag) value to a fieldless enum variant. Mainly useful for FFI, where the underlying numeric representation of a variant needs to be predictable.
  tags:
    - rust
    - language-constructs
    - enums
- noteId: lc-field-access
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What's the difference between <code>s.x</code> and <code>s.0</code>?
    Back: <code>s.x</code> is named field access on a struct (and may trigger a <code>Deref</code> coercion if <code>x</code> isn't actually a field of <code>s</code>'s type). <code>s.0</code> is numbered field access, used for tuples and tuple structs.
  tags:
    - rust
    - language-constructs
    - structs
- noteId: lc-indexing
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What traits back the <code>x[0]</code> indexing syntax?
    Back: <code>Index</code> (read access) and <code>IndexMut</code> (mutable access). Indexing with a range, e.g. <code>x[..]</code> or <code>x[a..b]</code>, goes through the same mechanism.
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-let-mut
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: "What's the difference between <code>let x: T;</code> and <code>let mut x: T;</code>?"
    Back: Both bind stack space for a value of type <code>T</code>. Plain <code>let</code> allows assigning the binding exactly once and forbids mutation or mutable borrows afterward. <code>let mut</code> allows reassignment and taking <code>&amp;mut</code> borrows of it.
  tags:
    - rust
    - language-constructs
    - ownership
- noteId: lc-move-vs-copy-assign
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What happens on <code>x = y;</code> depending on whether <code>T</code> implements <code>Copy</code>?
    Back: "If <code>T</code> is <code>Copy</code>, the bits of <code>y</code> are duplicated into <code>x</code> and <code>y</code> stays usable. Otherwise the value is <em>moved</em>: ownership transfers to <code>x</code> and <code>y</code> becomes invalid."
  tags:
    - rust
    - language-constructs
    - ownership
- noteId: lc-range-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What do <code>a..b</code>, <code>a..=b</code>, <code>..b</code>, <code>..=b</code>, <code>a..</code>, and <code>..</code> each mean?
    Back: <ul><li><code>a..b</code> &mdash; right-exclusive range (<code>1..3</code> is 1, 2).</li><li><code>a..=b</code> &mdash; inclusive range (<code>1..=3</code> is 1, 2, 3).</li><li><code>..b</code> / <code>..=b</code> &mdash; same but with no start ("range to", exclusive/inclusive).</li><li><code>a..</code> &mdash; "range from", no end.</li><li><code>..</code> &mdash; full range, usually meaning "the whole collection".</li></ul>
  tags:
    - rust
    - language-constructs
    - ranges
- noteId: lc-static-vs-const
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: "How do <code>static X: T = T();</code> and <code>const X: T = T();</code> differ?"
    Back: "<code>static</code> is a global variable with <code>'static</code> lifetime: a single, fixed memory location (though a library pulled into a crate graph in multiple versions can end up with more than one copy). <code>const</code> defines a constant that is inlined/copied into a fresh temporary at each use site &mdash; it doesn't have one canonical address."
  tags:
    - rust
    - language-constructs
    - memory-lifetimes
- noteId: lc-struct-construction-syntax
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: "Match each struct-construction syntax to its meaning: <code>S { x: y }</code>, <code>S { x }</code>, <code>S { ..s }</code>, <code>S(x)</code>."
    Back: "<ul><li><code>S { x: y }</code> &mdash; set field <code>x</code> to value <code>y</code>.</li><li><code>S { x }</code> &mdash; shorthand: use local variable <code>x</code> to fill field <code>x</code>.</li><li><code>S { ..s }</code> &mdash; fill any remaining fields by copying/moving them from an existing <code>s</code> (handy with <code>Default::default()</code>).</li><li><code>S(x)</code> &mdash; construct a tuple struct, setting field <code>.0</code> to <code>x</code>.</li></ul>"
  tags:
    - rust
    - language-constructs
    - structs
- noteId: lc-struct-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: "What do these struct forms declare?<br><code>struct S {}</code><br><code>struct S { x: T }</code><br><code>struct S(T);</code><br><code>struct S;</code>"
    Back: "<ul><li>Empty struct with named-field syntax.</li><li>Struct with named field <code>x</code> of type <code>T</code>.</li><li>Tuple struct: unnamed field accessed as <code>.0</code>.</li><li>Unit struct: zero-sized, occupies no memory, optimized away entirely.</li></ul>"
  tags:
    - rust
    - language-constructs
    - structs
- noteId: lc-struct-vs-array-cloze
  modelName: Cloze
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Text: An array type of fixed length <code>n</code> holding elements of type <code>S</code> is written <code>{{c1::[S; n]}}</code>; the unsized "array of unknown length" form is written <code>{{c2::[S]}}</code> and can only be used behind a reference.
    Back Extra: ""
  tags:
    - rust
    - language-constructs
    - collections
- noteId: lc-tuple-single-element
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: Why does <code>(x,)</code> need a trailing comma, and how does that differ from <code>(x)</code>?
    Back: <code>(x)</code> is just a parenthesized expression &mdash; it evaluates to the same value and type as <code>x</code>. <code>(x,)</code> is a genuine single-element tuple; the comma is what makes it a tuple rather than a grouped expression. Likewise <code>(S,)</code> is a single-element tuple <em>type</em>.
  tags:
    - rust
    - language-constructs
    - tuples
- noteId: lc-uninhabited-enum
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What is special about <code>enum E {}</code> &mdash; an enum with zero variants?
    Back: "It's <em>uninhabited</em>: no value of this type can ever exist, so it can never be constructed. Conceptually related to the never type <code>!</code>."
  tags:
    - rust
    - language-constructs
    - enums
- noteId: lc-union
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What is <code>union U {}</code> and where does it show up?
    Back: "An unsafe, C-like union: all fields share the same memory, and reading a field is unsafe because the compiler can't track which one is currently valid. Used mainly for FFI compatibility with C unions."
  tags:
    - rust
    - language-constructs
    - ffi
- noteId: lc-unit-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Data Structures
  fields:
    Front: What is <code>()</code> in Rust?
    Back: The empty tuple, called <em>unit</em>. It's both a type and its own only value &mdash; used where a function has "nothing" to return.
  tags:
    - rust
    - language-constructs
    - types
- noteId: lc-block-comments-discouraged
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Documentation
  fields:
    Front: Why are block comments (<code>/* ... */</code>, <code>/** ... */</code>, <code>/*! ... */</code>) generally discouraged in Rust?
    Back: They're considered deprecated in practice due to poor editor/IDE support (e.g. nesting and highlighting issues) compared to line comments. Prefer the equivalent line-comment form (<code>//</code>, <code>///</code>, <code>//!</code>) where possible.
  tags:
    - rust
    - language-constructs
    - documentation
- noteId: lc-doc-comment-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Documentation
  fields:
    Front: What's the difference between <code>///</code> and <code>//!</code>?
    Back: <code>///</code> is an outer line doc comment, documenting the item that follows (types, traits, functions, ...). <code>//!</code> is an inner line doc comment, documenting the item it's inside of &mdash; typically placed at the top of a file to document the whole module.
  tags:
    - rust
    - language-constructs
    - documentation
- noteId: lc-line-vs-doc-comment
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Documentation
  fields:
    Front: How does a plain <code>//</code> comment differ in purpose from a doc comment like <code>///</code>?
    Back: <code>//</code> is a regular line comment, meant for explaining code flow or implementation details to other readers of the source. Doc comments (<code>///</code>, <code>//!</code>) are picked up by the compiler's documentation tooling and rendered as generated API docs.
  tags:
    - rust
    - language-constructs
    - documentation
- noteId: lc-async-block-vs-move
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: What's the difference between <code>async { x }</code> and <code>async move { x }</code>?
    Back: Both turn <code>{ x }</code> into a value implementing <code>impl Future&lt;Output = X&gt;</code>. Plain <code>async {}</code> borrows its captures; <code>async move {}</code> moves the captured variables into the resulting future instead, the same distinction as with closures.
  tags:
    - rust
    - language-constructs
    - async-await
- noteId: lc-async-fn
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: What does putting <code>async</code> in front of a function do to its return type?
    Back: <code>async fn f() {}</code> transforms <code>f</code> so that calling it returns a value implementing <code>Future</code> instead of running the body immediately. <code>async fn f() -> S {}</code> returns <code>impl Future&lt;Output = S&gt;</code>.
  tags:
    - rust
    - language-constructs
    - async-await
- noteId: lc-async-fn-traits
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: What is <code>AsyncFn() -&gt; S</code>?
    Back: "The async counterpart to <code>Fn</code>: a callable trait implemented by async closures/functions, with <code>AsyncFnMut</code> and <code>AsyncFnOnce</code> siblings mirroring <code>FnMut</code>/<code>FnOnce</code>."
  tags:
    - rust
    - language-constructs
    - async-await
- noteId: lc-closure-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: "Contrast these closure forms: <code>|x| {}</code>, <code>|x| x + x</code>, <code>move |x| x + y</code>, <code>async |x| x + x</code>."
    Back: "<ul><li><code>|x| {}</code> &mdash; takes argument <code>x</code>, body is a block expression.</li><li><code>|x| x + x</code> &mdash; no block braces, body is a single expression.</li><li><code>move |x| x + y</code> &mdash; a move closure: <code>y</code> is transferred (owned) into the closure rather than borrowed.</li><li><code>async |x| x + x</code> &mdash; an async closure: its result becomes an <code>impl Future&lt;Output = X&gt;</code>. It can also be combined with <code>move</code>.</li></ul>"
  tags:
    - rust
    - language-constructs
    - closures
- noteId: lc-const-fn-and-block
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: What do <code>const fn f() {}</code> and <code>const { x }</code> enable?
    Back: "<code>const fn</code> marks a function as usable in compile-time contexts, e.g. <code>const X: u32 = f(Y);</code>. A <code>const { x }</code> block, used inside a regular function body, forces the enclosed expression to be evaluated at compile time."
  tags:
    - rust
    - language-constructs
    - const-eval
- noteId: lc-fn-pointer-vs-fn-trait
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: How do <code>fn() -&gt; S</code> and <code>Fn() -&gt; S</code> differ?
    Back: <code>fn() -&gt; S</code> is a concrete function pointer type &mdash; memory holding the address of a specific callable (can't be null, must point to a valid target, so "function reference" is arguably the more accurate name). <code>Fn() -&gt; S</code> is a trait describing anything callable this way &mdash; implemented by closures, plain functions, and function pointers alike (siblings <code>FnMut</code>, <code>FnOnce</code> cover mutable/move-only calling).
  tags:
    - rust
    - language-constructs
    - closures
- noteId: lc-negative-impl
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: What does <code>impl !T for S {}</code> do?
    Back: Explicitly opts <code>S</code> out of an auto trait <code>T</code> (like <code>Send</code> or <code>Sync</code>) that would otherwise be automatically derived for it. Experimental / rarely needed.
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-supertrait
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: "What does <code>trait T: R {}</code> mean?"
    Back: "<code>T</code> has <code>R</code> as a supertrait: any type must already implement <code>R</code> before it's allowed to implement <code>T</code>."
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-trait-vs-impl
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: How do <code>impl S {}</code> and <code>impl T for S {}</code> differ?
    Back: "<code>impl S {}</code> is an inherent implementation: it adds functionality (methods, associated items) directly to type <code>S</code>. <code>impl T for S {}</code> implements trait <code>T</code> for <code>S</code>, specifying how <code>S</code> satisfies that shared behavior contract."
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-tuple-struct-constructor-fn
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: Besides defining a type, what else does <code>struct S(T);</code> implicitly define?
    Back: "A constructor function <code>fn S(x: T) -> S</code>, so the tuple struct's name can be used directly as a callable that builds an instance."
  tags:
    - rust
    - language-constructs
    - structs
- noteId: lc-unsafe-extern-block
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: Since Rust 2024, what changed about <code>extern "abi" {}</code> blocks, and what does <code>pub safe fn f();</code> mean inside one?
    Back: As of the 2024 edition, <code>extern</code> blocks must be written <code>unsafe extern "abi" {}</code>. Inside one, <code>pub safe fn f();</code> marks that particular external function as actually safe to call, opting it out of the surrounding block's unsafe requirement.
  tags:
    - rust
    - language-constructs
    - ffi
- noteId: lc-unsafe-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Functions & Behavior
  fields:
    Front: "What does each of these promise: <code>unsafe fn f() {}</code>, <code>unsafe trait T {}</code>, <code>unsafe { f(); }</code>, <code>unsafe impl T for S {}</code>?"
    Back: <ul><li><code>unsafe fn</code> &mdash; "calling me can cause UB; <b>you</b> must verify the preconditions."</li><li><code>unsafe trait</code> &mdash; "implementing me carelessly can cause UB; the <b>implementor</b> must verify."</li><li><code>unsafe { }</code> block &mdash; "I, the caller, have checked the preconditions; trust me."</li><li><code>unsafe impl</code> &mdash; "I guarantee this type behaves correctly with respect to this unsafe trait."</li></ul>
  tags:
    - rust
    - language-constructs
    - unsafe
- noteId: lc-anonymous-lifetime-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What's the difference between <code>S&lt;'_&gt;</code> and <code>S&lt;_&gt;</code>?
    Back: "<code>S&lt;'_&gt;</code> asks the compiler to infer an anonymous <em>lifetime</em> when it's obvious from context. <code>S&lt;_&gt;</code> asks it to infer an anonymous <em>type</em>, e.g. <code>let x: Vec&lt;_&gt; = iter.collect();</code>."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-const-generics
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "What is <code>S&lt;const N: usize&gt;</code>, and how would a user supply <code>N</code>?"
    Back: "A const generic: instead of a type parameter, <code>S</code> takes a compile-time constant value <code>N</code>. Users supply it as a literal (<code>S&lt;10&gt;</code>) or, for expressions, wrapped in curly braces (<code>S&lt;{5+5}&gt;</code>)."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-default-generic-params
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What does <code>S&lt;T = R&gt;</code> do, and does the same idea apply to const generics?
    Back: "It gives type parameter <code>T</code> a default of <code>R</code>, so <code>S</code> can be used without specifying it while staying overridable. Yes &mdash; <code>S&lt;const N: u8 = 0&gt;</code> does the same for a const generic parameter."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-gat
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What is a GAT (generic associated type), e.g. <code>trait T { type X&lt;G&gt;; }</code>?
    Back: An associated type that is itself generic &mdash; it can depend on a type parameter (like <code>X&lt;G&gt;</code> being some <code>Vec&lt;G&gt;</code>) or on a lifetime (<code>type X&lt;'a&gt;;</code>), set concretely in the implementation, e.g. <code>impl T for S { type X&lt;G&gt; = Vec&lt;G&gt;; }</code>.
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-generic-trait-vs-associated-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: How do a generic trait (<code>trait T&lt;X&gt; {}</code>) and an associated type (<code>trait T { type X; }</code>) differ in how many times a type can implement them?
    Back: A generic trait can be implemented multiple times for the same type, once per distinct <code>X</code> (e.g. <code>impl T&lt;u8&gt; for S</code> and <code>impl T&lt;u16&gt; for S</code> can coexist). A trait with an associated type can only be implemented <em>once</em> per type, since <code>X</code> is fixed by that single implementation.
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-generic-type-param
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What does <code>struct S&lt;T&gt; …</code> declare?
    Back: "A generic type: <code>T</code> is a placeholder type parameter that gets filled in with a concrete type whenever <code>S</code> is used, e.g. <code>S&lt;u32&gt;</code>."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-generic-vs-inherent-impl
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What's the difference between <code>impl&lt;T&gt; S&lt;T&gt; {}</code> and <code>impl S&lt;T&gt; {}</code> (where <code>T</code> is a specific concrete type, e.g. <code>u8</code>)?
    Back: "<code>impl&lt;T&gt; S&lt;T&gt; {}</code> is a generic implementation: it defines methods for <em>any</em> <code>T</code>. <code>impl S&lt;T&gt; {}</code>, without the leading <code>&lt;T&gt;</code>, is an inherent implementation for one exact, concrete type &mdash; e.g. only <code>S&lt;u8&gt;</code>, not other instantiations of <code>S</code>."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-impl-trait-vs-dyn-vs-generic-param
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "Compare <code>fn f(x: &amp;impl T)</code>, <code>fn f(x: &amp;dyn T)</code>, and <code>fn f&lt;X: T&gt;(x: X)</code>."
    Back: '<code>fn f(x: &amp;impl T)</code> is sugar roughly equivalent to <code>fn f&lt;X: T&gt;(x: &amp;X)</code> &mdash; a trait bound via "impl trait" argument position. <code>fn f&lt;X: T&gt;(x: X)</code> is fully generic: the compiler monomorphizes a separate copy of <code>f</code> per concrete <code>X</code>. <code>fn f(x: &amp;dyn T)</code> uses dynamic dispatch instead: <code>f</code> is compiled once, and calls go through a vtable at runtime &mdash; no per-type instantiation.'
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-lifetime-bounds
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "What do <code>where T: 'a</code> and <code>where T: 'static</code> actually guarantee?"
    Back: "<code>where T: 'a</code> means: if <code>T</code> contains any references, they must outlive <code>'a</code>. <code>where T: 'static</code> is the same idea with <code>'a = 'static</code> &mdash; it does <b>not</b> mean a value of type <code>T</code> <em>will</em> live for the whole program, only that it's <em>allowed</em> to (no shorter-lived borrows are hiding inside it)."
  tags:
    - rust
    - language-constructs
    - memory-lifetimes
- noteId: lc-lifetime-outlives-bound
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "What does <code>where 'b: 'a</code> mean?"
    Back: "A lifetime bound: <code>'b</code> must live at least as long as (outlive) <code>'a</code>."
  tags:
    - rust
    - language-constructs
    - memory-lifetimes
- noteId: lc-opt-out-sized
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "What does <code>where T: ?Sized</code> do?"
    Back: Opts a generic parameter out of the implicit <code>Sized</code> bound that type parameters get by default, allowing <code>T</code> to be an unsized type like <code>[U]</code> or <code>dyn Trait</code>.
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-rpit
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What does <code>fn f() -&gt; impl T</code> mean, and what is this pattern called?
    Back: "It's Return-Position Impl Trait (RPIT), aka an existential type: <code>f</code> returns some concrete type that implements <code>T</code>, but the caller isn't told which one &mdash; only that it satisfies <code>T</code>."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-rpit-capture-rules
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What's the difference between <code>-&gt; impl T + 'a</code> and <code>-&gt; impl T + use&lt;'a&gt;</code>?
    Back: "<code>-&gt; impl T + 'a</code> is a bound: it says the hidden returned type lives at least as long as <code>'a</code>. <code>-&gt; impl T + use&lt;'a&gt;</code> is a \"use bound\": it instead states which lifetimes (like <code>'a</code>) were actually captured by the hidden type, which is more precise about what the returned value depends on."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-shorthand-bound
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "How does <code>S&lt;T: R&gt;</code> compare to writing a separate <code>where T: R</code> clause?"
    Back: "They express the same trait bound; <code>S&lt;T: R&gt;</code> is just inline shorthand, more compact to write than a trailing <code>where</code> clause."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-trait-bounds-combining
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "Why does <code>where T: R, S</code> not do what you might expect, and what should you write instead?"
    Back: "<code>where T: R, S</code> is a compile error &mdash; the comma there separates independent bounds for <em>different</em> parameters (as in <code>where T: R, P: S</code>), it doesn't add a second trait requirement to <code>T</code>. To require <code>T</code> satisfy both traits, use a compound bound: <code>where T: R + S</code>."
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-turbofish
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: What is the "turbofish" (<code>S::&lt;T&gt;</code>) for, and where can the type argument go for a generic enum?
    Back: It disambiguates a generic type/function's type argument at the call site, e.g. <code>f::&lt;u32&gt;()</code>, when it can't be inferred. For a generic enum, the type parameter can go on the enum itself (<code>E::&lt;T&gt;::A</code>) or on the specific variant (<code>E::A::&lt;T&gt;</code>), as in <code>Ok::&lt;R, E&gt;(r)</code>.
  tags:
    - rust
    - language-constructs
    - generics
- noteId: lc-where-self-sized
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Generics & Constraints
  fields:
    Front: "Inside a trait definition, what does <code>fn f() where Self: Sized;</code> accomplish?"
    Back: It restricts <code>f</code> to only be callable on types known to be <code>Sized</code>, which opts <code>f</code> out of the trait's vtable &mdash; letting the trait as a whole still be used as <code>dyn T</code> even though this one method couldn't work through a vtable.
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-attribute-inner-outer
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Macros & Attributes
  fields:
    Front: What's the difference between <code>#[attr]</code> and <code>#![attr]</code>?
    Back: "<code>#[attr]</code> is an outer attribute: it annotates the item that follows it. <code>#![attr]</code> is an inner attribute: it annotates the item it's written <em>inside of</em> (commonly used at the top of a file to annotate the whole module/crate)."
  tags:
    - rust
    - language-constructs
    - macros
- noteId: lc-macro-fragment-specifier
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Macros & Attributes
  fields:
    Front: In a macro-by-example pattern, what do <code>$x:ty</code> and <code>$x</code> each do?
    Back: "<code>$x:ty</code> is a capture: the <code>:ty</code> fragment specifier declares what kind of syntax <code>$x</code> is allowed to match (here, a type). Plain <code>$x</code>, used in the macro's expansion body, substitutes in whatever was captured."
  tags:
    - rust
    - language-constructs
    - macros
- noteId: lc-macro-invocation-brackets
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Macros & Attributes
  fields:
    Front: Does it matter whether a macro is invoked as <code>m!()</code>, <code>m!{}</code>, or <code>m![]</code>?
    Back: All three are valid macro invocation syntax and are interchangeable as far as the macro itself is concerned; convention (not the macro's definition) usually dictates which bracket style is idiomatic for a given macro, e.g. <code>vec![]</code> or a struct-like <code>macro!{}</code>.
  tags:
    - rust
    - language-constructs
    - macros
- noteId: lc-macro-repetition
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Macros & Attributes
  fields:
    Front: What do <code>$(x),*</code>, <code>$(x),+</code>, and <code>$(x)?</code> each mean in a macro pattern?
    Back: <code>$(x),*</code> &mdash; repeat zero or more times, separated by commas. <code>$(x),+</code> &mdash; one or more times. <code>$(x)?</code> &mdash; zero or one time (no separator applies). The separator isn't fixed to a comma either &mdash; e.g. <code>$(x)&lt;&lt;+</code> uses <code>&lt;&lt;</code> as the separator instead.
  tags:
    - rust
    - language-constructs
    - macros
- noteId: lc-never-in-result
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What does <code>fn f() -&gt; Result&lt;(), !&gt; {}</code> signal?
    Back: The function's signature requires returning a <code>Result</code>, but using <code>!</code> as the error type signals that the <code>Err</code> case can never actually happen &mdash; it's structurally impossible to construct one.
  tags:
    - rust
    - language-constructs
    - types
- noteId: lc-never-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What is the never type <code>!</code>, and why can <code>fn f() -&gt; ! {}</code> be assigned to a variable of any type?
    Back: "<code>!</code> is a type with no values at all &mdash; a function returning it can never actually return (it always panics, loops forever, or exits). Because it never produces a value, it's compatible with any expected type at the call site, e.g. <code>let x: u8 = f();</code> type-checks even though <code>f</code> returns <code>!</code>."
  tags:
    - rust
    - language-constructs
    - types
- noteId: lc-numeric-literal-syntax
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What do <code>1_234_567</code>, <code>1_u8</code>, and <code>0xBEEF</code> / <code>0o777</code> / <code>0b1001</code> each demonstrate about numeric literal syntax?
    Back: <code>1_234_567</code> &mdash; underscores are purely visual separators for readability, ignored by the compiler. <code>1_u8</code> &mdash; a type suffix pins the literal's concrete numeric type. <code>0x</code> / <code>0o</code> / <code>0b</code> prefixes give hexadecimal, octal, and binary integer literals respectively.
  tags:
    - rust
    - language-constructs
    - numbers
- noteId: lc-operator-overloading
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: Do Rust's common operators (<code>+</code>, <code>*</code>, <code>%</code>, <code>=</code>, <code>==</code>, etc.) behave differently from other C-family languages, and can they be customized?
    Back: "No &mdash; they behave as you'd expect from any similar language. What's worth knowing is that they're overloadable: each corresponds to a trait in <code>std::ops</code> (e.g. <code>Add</code> for <code>+</code>), so user-defined types can implement that trait to support the operator themselves."
  tags:
    - rust
    - language-constructs
    - operators
- noteId: lc-raw-identifier
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What problem does a raw identifier like <code>r#foo</code> solve?
    Back: It lets you use a word that would otherwise be a reserved keyword (in this or a newer edition) as an ordinary identifier &mdash; useful for edition compatibility, e.g. when a name becomes a keyword in a later edition but existing code (or generated code) still needs to use it as a plain name.
  tags:
    - rust
    - language-constructs
    - misc
- noteId: lc-scientific-notation
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What do <code>12.3e4</code> and <code>1E-8</code> represent?
    Back: Floating-point literals written in scientific notation &mdash; <code>e</code>/<code>E</code> followed by an exponent (which can be negative).
  tags:
    - rust
    - language-constructs
    - numbers
- noteId: lc-statement-terminator
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What role does the semicolon play in <code>x;</code>?
    Back: It turns an expression into a statement, discarding its value (as <code>()</code>) rather than letting it be the trailing expression/value of the enclosing block.
  tags:
    - rust
    - language-constructs
    - misc
- noteId: lc-underscore-prefix-var
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What does prefixing a variable name with an underscore, like <code>_x</code>, do?
    Back: Suppresses the compiler's "unused variable" warning for that binding, while still keeping it as a real, usable named variable (unlike the wildcard <code>_</code>, which can't be read back).
  tags:
    - rust
    - language-constructs
    - misc
- noteId: lc-wildcard-vs-underscore-assign
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Miscellaneous
  fields:
    Front: What's the difference between <code>let _ = x;</code> and <code>_ = x;</code>?
    Back: "<code>let _ = x;</code> is a no-op binding: it does <b>not</b> move <code>x</code> out or extend its scope &mdash; <code>x</code> is dropped immediately, right there. <code>_ = x;</code> (no <code>let</code>) lets you assign any expression's result to <code>_</code> to explicitly discard it, e.g. <code>_ = ignore_rval();</code>, without needing a fresh binding."
  tags:
    - rust
    - language-constructs
    - ownership
- noteId: lc-extern-abi-blocks
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Organizing Code
  fields:
    Front: What's the difference between <code>extern "C" {}</code> and <code>extern "C" fn f() {}</code>?
    Back: <code>extern "C" {}</code> <em>declares</em> external (foreign) functions and the ABI used to call them, for FFI. <code>extern "C" fn f() {}</code> <em>defines</em> a Rust function to be exported using that ABI, so foreign code can call into it.
  tags:
    - rust
    - language-constructs
    - ffi
- noteId: lc-extern-crate-deprecated
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Organizing Code
  fields:
    Front: Is <code>extern crate a;</code> still needed to use an external crate?
    Back: No &mdash; it's deprecated. Since the 2018 edition, simply writing <code>use a::b</code> is enough to pull in a dependency listed in <code>Cargo.toml</code>.
  tags:
    - rust
    - language-constructs
    - cargo
- noteId: lc-mod-inline-vs-file
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Organizing Code
  fields:
    Front: What's the difference between <code>mod m {}</code> and <code>mod m;</code>?
    Back: <code>mod m {}</code> defines the module inline, with its contents inside the braces. <code>mod m;</code> declares the module but pulls its contents from a separate file, <code>m.rs</code> or <code>m/mod.rs</code>.
  tags:
    - rust
    - language-constructs
    - modules
- noteId: lc-path-roots
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Organizing Code
  fields:
    Front: What do the path prefixes <code>crate::b</code>, <code>self::b</code>, and <code>super::b</code> each search?
    Back: <code>crate::b</code> searches from the crate root. <code>self::b</code> searches the current module. <code>super::b</code> searches the parent module. (An older bare <code>::b</code> global-path form, searching the crate root or extern prelude, is deprecated in favor of these.)
  tags:
    - rust
    - language-constructs
    - modules
- noteId: lc-pub-use-reexport
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Organizing Code
  fields:
    Front: What does <code>pub use a::b;</code> do that plain <code>use a::b;</code> doesn't?
    Back: It both brings <code>b</code> into local scope <em>and</em> re-exports it, so code outside this module can reach <code>b</code> through this module's path too.
  tags:
    - rust
    - language-constructs
    - modules
- noteId: lc-use-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Organizing Code
  fields:
    Front: What do <code>use a::b as x;</code>, <code>use a::b as _;</code>, and <code>use a::*;</code> each do?
    Back: <code>use a::b as x;</code> imports <code>b</code> under a different local name. <code>use a::b as _;</code> imports it anonymously &mdash; useful for bringing a trait's methods into scope without a name that could clash. <code>use a::*;</code> glob-imports everything from <code>a</code>; recommended mainly when <code>a</code> is a designated prelude module.
  tags:
    - rust
    - language-constructs
    - modules
- noteId: lc-visibility-modifiers
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Organizing Code
  fields:
    Front: What do <code>pub(crate)</code>, <code>pub(super)</code>, and <code>pub(in a::b)</code> restrict visibility to?
    Back: <code>pub(crate)</code> &mdash; visible anywhere in the current crate. <code>pub(super)</code> &mdash; visible in the parent module (and below). <code>pub(in a::b)</code> &mdash; visible within the ancestor module path <code>a::b</code>. (Plain <code>pub(self)</code>, same as no modifier, restricts to the current module &mdash; though child modules always see everything in their ancestors regardless of visibility.)
  tags:
    - rust
    - language-constructs
    - modules
- noteId: lc-at-pattern-binding
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What does <code>let s @ S { x } = get();</code> bind?
    Back: "It's a pattern binding (<code>@</code>): <code>s</code> is bound to the whole matched value, while <code>x</code> is simultaneously bound to <code>s.x</code> via the nested destructuring pattern."
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-bare-identifier-match-ambiguity
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: In a match arm, when does the bare pattern <code>D =&gt; {}</code> match a specific enum variant versus bind a new variable?
    Back: If <code>D</code> names an in-scope enum variant (e.g. brought in via <code>use E::D;</code>), the pattern matches that variant. If <code>D</code> is <em>not</em> in scope as a variant, Rust silently treats it as a fresh binding that matches anything &mdash; a common gotcha ("false friend") when you meant to match <code>E::D</code> but forgot the <code>use</code>.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-fn-param-destructure
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: "What does <code>fn f(S { x }: S)</code> do?"
    Back: "Function parameters can destructure just like <code>let</code>: calling <code>f(s)</code> binds <code>x</code> to <code>s.x</code> directly inside the function body."
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-if-let-desugar
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What does <code>if let Ok(x) = f() {}</code> desugar to?
    Back: <code>match f() { Ok(x) =&gt; {}, _ =&gt; () }</code> &mdash; it's syntactic sugar for a match with a catch-all fallback, useful when you only care about one pattern branching.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-let-chains
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What do "let chains" (<code>if let ... &amp;&amp; let ... {}</code>) let you avoid?
    Back: They let you combine multiple pattern bindings and boolean conditions in one <code>if</code> without nesting separate <code>if let</code> blocks inside each other.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-let-destructure-partial
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: How much of a value do <code>let S(x) = get();</code> and <code>let S { x } = s;</code> bind?
    Back: <code>let</code> can destructure, not just simple-bind. <code>let S(x) = get();</code> binds only the tuple struct's field to <code>x</code>. <code>let S { x } = s;</code> binds only field <code>x</code> to a variable of the same name, ignoring any other fields.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-let-else
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What must the <code>else</code> block of <code>let Ok(x) = f() else {};</code> do, and why?
    Back: It must diverge &mdash; e.g. <code>break</code>, <code>return</code>, or <code>panic!()</code> &mdash; because if the pattern doesn't match, execution can't fall through with <code>x</code> left unbound; the surrounding scope needs <code>x</code> to be guaranteed valid afterward.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-match-arm-enum-variants
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: How do you match an enum's unit, tuple, and struct-like variants while ignoring their contents?
    Back: <code>E::A =&gt; {}</code> matches unit variant <code>A</code>. <code>E::B(..) =&gt; {}</code> matches tuple variant <code>B</code>, ignoring its fields. <code>E::C { .. } =&gt; {}</code> matches struct variant <code>C</code>, ignoring its fields.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-match-guard
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What does <code>S { x } if x &gt; 10 =&gt; {}</code> add on top of the pattern?
    Back: "A match guard: even if the pattern itself matches, the arm only fires if the extra boolean condition after <code>if</code> is also true."
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-nested-at-binding
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What does <code>Err(x @ Error { .. }) =&gt; {}</code> bind, and why combine <code>@</code> with match guards?
    Back: <code>x</code> is bound to the whole matched <code>Error</code> value while still asserting its shape via the nested pattern. This is especially handy paired with a match guard afterward, since the guard can then inspect <code>x</code> as a whole value.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-or-patterns
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: How do or-patterns work, e.g. <code>0 | 1 =&gt; {}</code>, <code>E::C {x} | E::D {x} =&gt; {}</code>, <code>Some(A | B) =&gt; {}</code>?
    Back: <code>|</code> lets a single arm match any of several alternatives. It works on plain values, enum variants, and can nest arbitrarily deep inside other patterns. When binding a variable across alternatives (like <code>x</code> in the <code>E::C</code>/<code>E::D</code> example), every alternative must bind it, with the same type.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-pathological-or-pattern
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What is a "pathological or-pattern", and why does <code>let (|x| x) = get();</code> look confusing?
    Back: A leading <code>|</code> before a pattern is simply ignored (it's not the start of a closure). So <code>|x| x =&gt; {}</code> is really just <code>x | x =&gt; {}</code>, i.e. plain <code>x</code>. In <code>let (|x| x) = get();</code>, the parens plus leading-pipe make it look like a closure, but it's actually equivalent to <code>let x = get();</code>.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-range-patterns
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: In match arms, what do <code>1 .. 3 =&gt; {}</code>, <code>1 ..= 3 =&gt; {}</code>, and <code>1 .. =&gt; {}</code> each match?
    Back: <code>1 .. 3</code> matches <code>1</code> and <code>2</code> (exclusive; partially unstable). <code>1 ..= 3</code> matches <code>1</code>, <code>2</code>, and <code>3</code> (inclusive). <code>1 ..</code> is an open range matching <code>1</code> and anything larger.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-refutable-let
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: Why does <code>let Ok(x) = f();</code> fail to compile in general, and what are the fixes?
    Back: A plain <code>let</code> pattern must be irrefutable &mdash; it must always match. <code>Ok(x)</code> can fail to match if <code>f()</code> returns <code>Err</code>, so it's rejected unless the <code>Err</code> case is provably uninhabited (e.g. <code>f</code> returns <code>Result&lt;T, !&gt;</code>). Otherwise, use <code>let ... else { ... }</code> or <code>if let</code> instead, which handle the non-matching case explicitly.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-rest-pattern-let
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: In <code>let (a, ..) = abc;</code> and <code>let (.., a, b) = (1, 2);</code>, what does <code>..</code> mean, and what wins if it overlaps with a named binding?
    Back: <code>..</code> means "ignore the rest" of a tuple/array/struct pattern. Specific named bindings always take precedence over <code>..</code> &mdash; in <code>let (.., a, b) = (1, 2);</code>, <code>a</code> is <code>1</code> and <code>b</code> is <code>2</code>, with <code>..</code> matching nothing.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-slice-patterns
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What do <code>[a, 0] =&gt; {}</code>, <code>[1, ..] =&gt; {}</code>, and <code>[1, x @ .., 5] =&gt; {}</code> match?
    Back: "<code>[a, 0]</code> &mdash; a slice pattern matching exactly two elements, any value bound to <code>a</code>, second must be <code>0</code>. <code>[1, ..]</code> &mdash; a subslice pattern: must start with <code>1</code>, any values after. <code>[1, x @ .., 5]</code> &mdash; must start with <code>1</code> and end with <code>5</code>, with everything in between bound to <code>x</code> as a slice."
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-struct-match-shorthand
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: "Contrast <code>S { x: 0, y: 1 }</code>, <code>S { x: a, y: b }</code>, and <code>S { x, y }</code> as match patterns."
    Back: "<code>S { x: 0, y: 1 } =&gt; {}</code> matches only when the fields hold those exact values. <code>S { x: a, y: b } =&gt; {}</code> matches any values, binding <code>s.x</code> to <code>a</code> and <code>s.y</code> to <code>b</code>. <code>S { x, y } =&gt; {}</code> is shorthand for the same, binding fields to same-named variables."
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-while-let
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What does <code>while let Ok(x) = f() {}</code> do?
    Back: Repeatedly calls <code>f()</code> and runs the loop body as long as the pattern <code>Ok(x)</code> keeps matching; stops the first time it doesn't.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-wildcard-match
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Pattern Matching
  fields:
    Front: What does <code>_ =&gt; {}</code> match in a <code>match</code> expression?
    Back: "It's the proper wildcard pattern: matches anything, commonly used as a catch-all \"everything else\" final arm."
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-borrow-vs-reference
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: <code>&amp;S</code> vs <code>&amp;s</code> &mdash; what's the conceptual difference?
    Back: "<code>&amp;S</code> names the reference <em>type</em>: a slot able to hold the address of any value of type <code>S</code>. <code>&amp;s</code> is the borrow <em>expression</em>: it produces a concrete reference value (address, and any extra metadata) pointing at this particular <code>s</code>."
  tags:
    - rust
    - language-constructs
    - references
- noteId: lc-dereference
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What does <code>*r</code> do, and what are the rules around assigning through or from it?
    Back: "<code>*r</code> dereferences <code>r</code> to access the pointed-to value. <code>*r = s;</code> (with <code>r: &amp;mut _</code>) moves or copies <code>s</code> into that memory. <code>s = *r;</code> only compiles if the pointee is <code>Copy</code>; otherwise it would move out of borrowed data, which isn't allowed &mdash; except for <code>Box&lt;T&gt;</code>, which is special-cased to permit moving its owned content out even when <code>T</code> isn't <code>Copy</code>."
  tags:
    - rust
    - language-constructs
    - ownership
- noteId: lc-fat-pointers
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What extra data do <code>&amp;[S]</code>, <code>&amp;str</code>, and <code>&amp;dyn T</code> carry beyond a plain address?
    Back: "They're \"fat pointers\": <code>&amp;[S]</code> carries (address, element count); <code>&amp;str</code> carries (address, byte length); <code>&amp;dyn T</code> carries (address, vtable pointer). For <code>&amp;dyn T</code> to exist, <code>T</code> must be dyn-compatible."
  tags:
    - rust
    - language-constructs
    - references
- noteId: lc-lifetime-annotations
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: "What do <code>struct S&lt;'a&gt; {}</code>, <code>trait T&lt;'a&gt; {}</code>, and <code>fn f&lt;'a&gt;(t: &amp;'a T)</code> each signal?"
    Back: "<ul><li><code>struct S&lt;'a&gt; {}</code> &mdash; <code>S</code> holds a reference with lifetime <code>'a</code>; whoever creates an <code>S</code> picks <code>'a</code>.</li><li><code>trait T&lt;'a&gt; {}</code> &mdash; any type implementing <code>T</code> might hold such a reference.</li><li><code>fn f&lt;'a&gt;(t: &amp;'a T)</code> &mdash; the function handles some borrowed reference; the <em>caller</em> picks <code>'a</code>.</li></ul>"
  tags:
    - rust
    - language-constructs
    - memory-lifetimes
- noteId: lc-lifetime-parameter
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What is <code>'a</code>, conceptually?
    Back: "A lifetime parameter: a name given to some span of program flow, used purely for static (compile-time) analysis of how long borrowed data stays valid. It doesn't exist at runtime."
  tags:
    - rust
    - language-constructs
    - memory-lifetimes
- noteId: lc-raw-pointers
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: How do <code>*const S</code> / <code>*mut S</code> differ from <code>&amp;S</code> / <code>&amp;mut S</code>?
    Back: "Raw pointers (<code>*const S</code>, <code>*mut S</code>) carry no memory-safety guarantees: no borrow checking, can be null or dangling, and dereferencing one requires an <code>unsafe</code> block. References always point to valid, aliasing-checked memory."
  tags:
    - rust
    - language-constructs
    - unsafe
- noteId: lc-raw-ref-operator
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What do <code>&amp;raw const s</code> and <code>&amp;raw mut s</code> do, and when are they needed?
    Back: They create a raw pointer to <code>s</code> without ever forming an intermediate reference (equivalent in spirit to <code>ptr::addr_of!()</code>). This matters for things like unaligned or packed struct fields, where even momentarily creating a <code>&amp;</code>/<code>&amp;mut</code> reference would be undefined behavior.
  tags:
    - rust
    - language-constructs
    - unsafe
- noteId: lc-ref-mut-destructure
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What does <code>let S { ref mut x } = s;</code> bind?
    Back: It's shorthand destructuring equivalent to <code>let x = &amp;mut s.x;</code> &mdash; <code>x</code> becomes a mutable reference into the field, rather than a copy or move of it.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-ref-pattern-binding
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What does <code>ref s</code> do in a pattern, and how does <code>let ref r = s;</code> compare to <code>let r = &amp;s;</code>?
    Back: <code>ref</code> makes a pattern binding a reference instead of moving/copying the matched value. <code>let ref r = s;</code> is equivalent to <code>let r = &amp;s;</code>. This form is considered deprecated in favor of just writing <code>&amp;</code> directly.
  tags:
    - rust
    - language-constructs
    - pattern-matching
- noteId: lc-ref-vs-mut-ref
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What's the difference between the reference types <code>&amp;S</code> and <code>&amp;mut S</code>?
    Back: "<code>&amp;S</code> is a shared reference: read-only access, any number of them can coexist. <code>&amp;mut S</code> is an exclusive reference: allows mutation, and the borrow checker guarantees it's the only live reference to that data."
  tags:
    - rust
    - language-constructs
    - references
- noteId: lc-static-lifetime
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::References & Pointers
  fields:
    Front: What does the <code>'static</code> lifetime mean?
    Back: It's a special lifetime lasting the entire program's execution &mdash; data with a <code>'static</code> reference (or bound) is valid for as long as the program runs.
  tags:
    - rust
    - language-constructs
    - memory-lifetimes
- noteId: lc-byte-string-literal
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Strings & Chars
  fields:
    Front: What type does a byte string literal <code>b"..."</code> produce, and what's the constraint on its content?
    Back: It produces a <code>&amp;'static [u8; N]</code> &mdash; a fixed-size byte array reference, not a <code>str</code>. Content must be ASCII-only. Raw variants <code>br"..."</code> / <code>br#"..."#</code> also exist.
  tags:
    - rust
    - language-constructs
    - strings
- noteId: lc-byte-vs-char-literal
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Strings & Chars
  fields:
    Front: How do <code>b'x'</code> and <code>'🦀'</code> differ?
    Back: "<code>b'x'</code> is an ASCII byte literal: a single <code>u8</code>. <code>'🦀'</code> is a character literal: a <code>char</code>, always 4 bytes, able to represent any Unicode scalar value &mdash; not just ASCII."
  tags:
    - rust
    - language-constructs
    - strings
- noteId: lc-c-string-literal
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Strings & Chars
  fields:
    Front: What is <code>c"..."</code>, and what is it for?
    Back: "A C string literal: produces a NUL-terminated <code>&amp;'static CStr</code>, intended for FFI where C code expects a null-terminated byte string. Raw variants <code>cr\"...\"</code> / <code>cr#\"...\"#</code> also exist."
  tags:
    - rust
    - language-constructs
    - ffi
- noteId: lc-debug-vs-display-escapes
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Strings & Chars
  fields:
    Front: If a string literal contains an actual newline or a <code>\n</code> escape, how do <code>Debug</code> and <code>Display</code> formatting differ when printing it?
    Back: <code>Debug</code> (e.g. <code>dbg!(x)</code>, <code>println!("{x:?}")</code>) tends to render the escape literally, showing <code>\n</code> as two characters. <code>Display</code> (e.g. <code>println!("{x}")</code>) renders it properly as an actual line break.
  tags:
    - rust
    - language-constructs
    - strings
- noteId: lc-raw-string-literal
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Strings & Chars
  fields:
    Front: What's the difference between <code>r"..."</code> and <code>r#"..."#</code>?
    Back: "Both are raw string literals: escape sequences like <code>\\n</code> are taken literally, not interpreted. <code>r\"...\"</code> can't itself contain a <code>\"</code> character; <code>r#\"...\"#</code> can, because the number of <code>#</code> delimiters can be increased as needed to disambiguate."
  tags:
    - rust
    - language-constructs
    - strings
- noteId: lc-string-literal-escapes
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Strings & Chars
  fields:
    Front: What type does a plain string literal <code>"..."</code> have, and what escape forms does it support?
    Back: It's a <code>&amp;'static str</code> (UTF-8). It supports common escapes like <code>\n</code>, <code>\r</code>, <code>\t</code>, <code>\0</code>, <code>\\</code>; ASCII escapes up to <code>\x7f</code> (e.g. <code>\x36</code> becomes the character <code>6</code>); and Unicode escapes up to 6 hex digits (e.g. <code>\u{7fff}</code>). It can also span multiple lines directly.
  tags:
    - rust
    - language-constructs
    - strings
- noteId: lc-disambiguate-as
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Type Aliases and Casts
  fields:
    Front: What is <code>&lt;S as T&gt;</code> used for?
    Back: It disambiguates type <code>S</code> viewed specifically as trait <code>T</code>, so you can call e.g. <code>&lt;S as T&gt;::f()</code> when multiple traits (or an inherent impl) on <code>S</code> define a method with the same name.
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-import-rename-vs-cast
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Type Aliases and Casts
  fields:
    Front: "Compare the two uses of the <code>as</code> keyword: <code>use a::S as R;</code> and <code>x as u32;</code>."
    Back: In a <code>use</code> declaration, <code>as</code> renames an imported symbol locally (<code>S</code> becomes usable as <code>R</code>). Outside of <code>use</code>, <code>x as u32</code> is a primitive type cast &mdash; converting <code>x</code>'s value to type <code>u32</code>, which can truncate or otherwise surprise (e.g. casting a large float or negative int).
  tags:
    - rust
    - language-constructs
    - type-conversions
- noteId: lc-receiver-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Type Aliases and Casts
  fields:
    Front: "What are <code>self</code>, <code>&amp;self</code>, <code>&amp;mut self</code>, and <code>self: Box&lt;Self&gt;</code> shorthand for?"
    Back: '<code>self</code> = <code>self: Self</code> (takes ownership). <code>&amp;self</code> = <code>self: &amp;Self</code> (shared borrow). <code>&amp;mut self</code> = <code>self: &amp;mut Self</code> (exclusive borrow). <code>self: Box&lt;Self&gt;</code> is an "arbitrary self type" letting a method only be callable through a <code>Box</code> (or other smart pointer).'
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-self-vs-Self
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Type Aliases and Casts
  fields:
    Front: What's the difference between <code>Self</code> and <code>self</code>?
    Back: '<code>Self</code> (capitalized) is a type alias for "the implementing type", e.g. in <code>fn new() -&gt; Self</code>. <code>self</code> (lowercase) is the method-subject parameter, shorthand for <code>self: Self</code>, e.g. in <code>fn f(self) {}</code>.'
  tags:
    - rust
    - language-constructs
    - traits
- noteId: lc-type-alias
  modelName: Basic
  deckName: Rust Cheat Sheet::Language Constructs::Type Aliases and Casts
  fields:
    Front: What does <code>type T = S;</code> do?
    Back: "Creates a type alias: <code>T</code> becomes another name for the type <code>S</code>. It's purely a naming convenience &mdash; the compiler treats <code>T</code> and <code>S</code> as fully interchangeable."
  tags:
    - rust
    - language-constructs
    - types
- noteId: mt1-bool-size
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: How many bytes does <code>bool</code> occupy in Rust?
    Back: 1 byte.
  tags:
    - rust
    - memory-layout
    - basic-types
    - sizeof
- noteId: mt1-cast-float-overflow-saturate
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What happens when a float-to-integer cast overflows the target type, e.g. <code>314_f32 as u8</code> or <code>f32::INFINITY as u8</code>?
    Back: "It saturates to the target type's closest representable value: both give <code>255</code> (treating <code>INFINITY</code> as an arbitrarily large number)."
  tags:
    - rust
    - memory-layout
    - basic-types
    - casting
- noteId: mt1-cast-float-to-int-truncate
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What does <code>3.9_f32 as u8</code> produce, and why?
    Back: <code>3</code> &mdash; casting a float to an integer truncates the fractional part (rounds toward zero). Call <code>.round()</code> first if you want rounding instead.
  tags:
    - rust
    - memory-layout
    - basic-types
    - casting
- noteId: mt1-cast-int-truncate-bits
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What does casting a larger integer down to a smaller one do, e.g. <code>314_i32 as u8</code> or <code>200_i32 as i8</code>?
    Back: "It truncates the excess high bits, keeping only the low bits of the target width. <code>314_i32 as u8</code> gives <code>58</code>. If the target is signed, that truncated bit pattern's top bit can flip the sign: <code>200_i32 as i8</code> gives <code>-56</code>."
  tags:
    - rust
    - memory-layout
    - basic-types
    - casting
- noteId: mt1-cast-nan-to-int
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What does <code>f32::NAN as u8</code> produce?
    Back: <code>0</code>.
  tags:
    - rust
    - memory-layout
    - basic-types
    - casting
- noteId: mt1-char-cannot-hold-emoji-literal
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: Why can a heart emoji <code>'&#10084;'</code> be a <code>char</code>, but the red-heart emoji <code>'&#10084;&#65039;'</code> can't?
    Back: The red-heart emoji is actually two Unicode scalar values (a base heart plus a variation selector), so it can't fit in one <code>char</code> &mdash; only in a multi-<code>char</code> <code>&amp;str</code>/<code>String</code>.
  tags:
    - rust
    - memory-layout
    - basic-types
    - strings
- noteId: mt1-char-size-and-domain
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: How many bytes is a <code>char</code>, and what can it hold?
    Back: Always 4 bytes; holds exactly one Unicode <i>scalar value</i>. It can't hold an arbitrary 32-bit pattern &mdash; not every bit pattern is a valid scalar value.
  tags:
    - rust
    - memory-layout
    - basic-types
    - strings
    - sizeof
- noteId: mt1-char-vs-grapheme
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: Does one <code>char</code> always correspond to what a user perceives as a single visible character?
    Back: No. Some emoji built with zero-width joiners are actually made of several <code>char</code>s that a rendering engine may fuse into one glyph or display separately, depending on its capabilities.
  tags:
    - rust
    - memory-layout
    - basic-types
    - strings
- noteId: mt1-char-vs-str-encoding
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: Does a <code>char</code> use the same byte encoding as that same character inside a <code>str</code>?
    Back: "No. A <code>char</code> stores the raw Unicode scalar value directly (4 bytes). A <code>str</code> stores it UTF-8 encoded, which is often fewer bytes: <code>&#10084;</code> (U+2764) is <code>64 27 00 00</code> as a <code>char</code>, but <code>e2 9d a4</code> (3 bytes) UTF-8-encoded inside a <code>str</code>."
  tags:
    - rust
    - memory-layout
    - basic-types
    - strings
- noteId: mt1-checked-wrapping-ops
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What's the recommended alternative to letting integer arithmetic panic or silently wrap on overflow?
    Back: Use the explicit <code>checked_*</code>, <code>wrapping_*</code>, <code>saturating_*</code>, or <code>overflowing_*</code> methods (e.g. <code>checked_add</code>) instead of the bare operator, so overflow behavior is deliberate.
  tags:
    - rust
    - memory-layout
    - basic-types
    - integers
- noteId: mt1-f32-bit-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: How are the 32 bits of an IEEE-754 <code>f32</code> divided up?
    Back: 1 sign bit + 8 exponent bits + 23 fraction (mantissa) bits.
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
- noteId: mt1-f64-bit-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: How are the 64 bits of an IEEE-754 <code>f64</code> divided up?
    Back: 1 sign bit + 11 exponent bits + 52 fraction (mantissa) bits.
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
- noteId: mt1-float-arithmetic-imprecision
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: Why doesn't <code>0.8_f32 + 0.1_f32</code> equal exactly <code>0.9</code>?
    Back: Binary floating-point can't represent 0.8, 0.1, or 0.9 exactly, so the sum comes out as <code>0.90000004</code> &mdash; a rounding artifact inherent to IEEE-754 floats.
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
- noteId: mt1-float-byte-sizes
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What are the byte sizes of Rust's floating-point types?
    Back: "<ul><li><code>f16</code> (experimental): 2 bytes</li><li><code>f32</code>: 4 bytes</li><li><code>f64</code>: 8 bytes</li><li><code>f128</code> (experimental): 16 bytes</li></ul>"
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
    - sizeof
- noteId: mt1-float-div-by-zero
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What does dividing floats by zero produce in Rust?
    Back: <code>1.0_f32 / 0.0_f32</code> gives <code>f32::INFINITY</code>; <code>0.0_f32 / 0.0_f32</code> gives <code>f32::NAN</code>. Unlike integer division, float division by zero never panics.
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
- noteId: mt1-float-max-lossless-int
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What is the largest integer each float type can represent losslessly (i.e. every integer from 0 up to it is exactly representable)?
    Back: "<ul><li><code>f32</code>: 16,777,216 (2<sup>24</sup>)</li><li><code>f64</code>: 9,007,199,254,740,992 (2<sup>53</sup>)</li></ul>Beyond this bound some larger integers may still happen to be representable, but not all of them are guaranteed to be."
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
- noteId: mt1-float-special-values
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: In an IEEE-754 float's exponent/fraction bits, which combinations mean zero, infinity, NaN, and a denormalized number?
    Back: "<ul><li>Exponent all zero, fraction zero: signed zero</li><li>Exponent all zero, fraction non-zero: denormalized number</li><li>Exponent all ones, fraction zero: infinity</li><li>Exponent all ones, fraction non-zero: NaN</li><li>Any other exponent: a normalized number</li></ul>"
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
- noteId: mt1-integer-byte-sizes
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What are the byte sizes of Rust's fixed-width integer types?
    Back: "<ul><li><code>u8</code>/<code>i8</code>: 1 byte</li><li><code>u16</code>/<code>i16</code>: 2 bytes</li><li><code>u32</code>/<code>i32</code>: 4 bytes</li><li><code>u64</code>/<code>i64</code>: 8 bytes</li><li><code>u128</code>/<code>i128</code>: 16 bytes</li></ul>"
  tags:
    - rust
    - memory-layout
    - basic-types
    - sizeof
- noteId: mt1-integer-div-by-zero
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What happens when a runtime integer value is divided by zero, e.g. <code>200_u8 / 0</code>?
    Back: It panics. (Dividing by a <i>literal</i> zero is instead caught as a compile error.)
  tags:
    - rust
    - memory-layout
    - basic-types
    - integers
- noteId: mt1-integer-division-truncates
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What does <code>1_u8 / 2_u8</code> evaluate to?
    Back: <code>0</code> &mdash; integer division truncates toward zero rather than producing a fraction.
  tags:
    - rust
    - memory-layout
    - basic-types
    - integers
- noteId: mt1-integer-overflow-debug-vs-release
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: How does integer overflow behave at runtime (with a value the compiler can't see through, not a literal) in debug vs release builds?
    Back: "Debug build: panics on overflow.<br>Release build: silently wraps around using two's-complement wraparound (e.g. adding 200 to 200 as <code>u8</code> values wraps to <code>144</code> instead of panicking)."
  tags:
    - rust
    - memory-layout
    - basic-types
    - integers
- noteId: mt1-integer-overflow-literal-compile-error
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What happens if an arithmetic expression made entirely of integer literals overflows, e.g. <code>200_u8 + 200_u8</code>?
    Back: Compile error &mdash; the compiler can detect overflow ahead of time when both operands are literal constants.
  tags:
    - rust
    - memory-layout
    - basic-types
    - integers
- noteId: mt1-nan-comparisons
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: How do comparisons involving <code>NaN</code> behave in Rust?
    Back: Every comparison against <code>NaN</code> &mdash; <code>&lt;</code>, <code>&gt;</code>, even <code>==</code> &mdash; returns <code>false</code>, including <code>NaN == NaN</code>. Use <code>x.is_nan()</code> to test for it instead.
  tags:
    - rust
    - memory-layout
    - basic-types
    - floats
- noteId: mt1-signed-range
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What is the value range of Rust's signed integer types?
    Back: "<ul><li><code>i8</code>: -128 to 127</li><li><code>i16</code>: -32,768 to 32,767</li><li><code>i32</code>: -2,147,483,648 to 2,147,483,647</li><li><code>i64</code>: -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807</li><li><code>i128</code>: symmetric around zero, roughly &plusmn;1.7&times;10<sup>38</sup></li></ul>Each signed type's range is asymmetric by one: one more negative value than positive, since 0 counts on the positive side."
  tags:
    - rust
    - memory-layout
    - basic-types
    - integers
- noteId: mt1-str-representation
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What is a <code>str</code> internally, and how is it normally used?
    Back: A <code>u8</code> array of unspecified, unknown-at-compile-time length, guaranteed to hold valid UTF-8. It's unsized, so it's rarely used directly &mdash; almost always seen behind a reference, as <code>&amp;str</code>.
  tags:
    - rust
    - memory-layout
    - basic-types
    - strings
- noteId: mt1-unsigned-max-values
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: What are the maximum values of Rust's unsigned integer types?
    Back: "<ul><li><code>u8</code>: 255</li><li><code>u16</code>: 65,535</li><li><code>u32</code>: 4,294,967,295</li><li><code>u64</code>: 18,446,744,073,709,551,615</li><li><code>u128</code>: 340,282,366,920,938,463,463,374,607,431,768,211,455</li></ul>"
  tags:
    - rust
    - memory-layout
    - basic-types
    - integers
- noteId: mt1-usize-isize-size
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Basic Types
  fields:
    Front: How big are <code>usize</code> and <code>isize</code>?
    Back: Same size as a pointer on the target platform — matches <code>u16</code>, <code>u32</code>, or <code>u64</code> (resp. the signed equivalents) depending on architecture.
  tags:
    - rust
    - memory-layout
    - basic-types
    - sizeof
- noteId: mt1-closure-capture-modes
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Closures
  fields:
    Front: What are the two ways a closure can capture a variable from its surrounding environment?
    Back: By <b>moved value</b> (the variable is moved into the closure's generated struct, which now owns it) or by <b>pointer/reference</b> (the closure stores a reference to the original variable instead).
  tags:
    - rust
    - memory-layout
    - closures
    - capture
- noteId: mt1-closure-generates-fn
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Closures
  fields:
    Front: Besides a data-holding type, what else does the compiler generate for a closure?
    Back: An anonymous function that takes the closure's captured data (by value for a move closure, by reference otherwise) plus the closure's declared parameters. Which of <code>FnOnce</code>, <code>FnMut</code>, <code>Fn</code> it can implement depends on the properties of the captured types.
  tags:
    - rust
    - memory-layout
    - closures
    - capture
- noteId: mt1-closure-is-anon-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Closures
  fields:
    Front: What is a Rust closure, structurally?
    Back: An anonymous, compiler-generated type holding whatever captured local variables it needs, paired with a generated function that operates on that type &mdash; a 'mini function' bundled with its own data.
  tags:
    - rust
    - memory-layout
    - closures
- noteId: mt1-move-closure-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Closures
  fields:
    Front: In <code>move |x| x + y.f() + z</code>, how are the captured variables <code>y</code> and <code>z</code> stored in the generated closure type?
    Back: Inline, by value &mdash; the generated closure struct directly contains owned copies of <code>y</code> and <code>z</code>, since they were moved into it.
  tags:
    - rust
    - memory-layout
    - closures
    - capture
- noteId: mt1-move-vs-nonmove-choice
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Closures
  fields:
    Front: What's the practical effect of writing <code>move |...| ...</code> versus a plain closure?
    Back: <code>move</code> forces captured variables to be moved (or copied) into the closure, so it owns them independently of the original scope's lifetime. Without <code>move</code>, captures are by reference, so the closure borrows from &mdash; and can't outlive &mdash; the original variables.
  tags:
    - rust
    - memory-layout
    - closures
    - capture
- noteId: mt1-nonmove-closure-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Closures
  fields:
    Front: In <code>|x| x + y.f() + z</code> (no <code>move</code>), how are the captured variables <code>y</code> and <code>z</code> stored in the generated closure type?
    Back: As pointers &mdash; the generated closure struct holds a reference to each captured variable in the outer scope, rather than owning a copy of it.
  tags:
    - rust
    - memory-layout
    - closures
    - capture
- noteId: mt1-custom-type-layout-intro
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: What determines a custom type's actual in-memory layout in Rust?
    Back: Its <b>representation</b> (default Rust repr vs a forced one like <code>#[repr(C)]</code>). Layout can include compiler-inserted padding, and by default is left unspecified.
  tags:
    - rust
    - memory-layout
    - custom-types
    - repr
- noteId: mt1-enum-tagged-union
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: How is a Rust <code>enum</code> such as <code>enum E { A, B, C }</code> represented in memory?
    Back: "As a <b>tagged union</b>: a tag saying which variant is active, plus storage sized for that variant's data. The compiler may pack the tag into otherwise-unused bits of a variant's data (niche optimization) instead of using a separate tag field."
  tags:
    - rust
    - memory-layout
    - custom-types
    - enums
- noteId: mt1-fixed-array-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: How is a fixed-size array <code>[T; n]</code> laid out in memory?
    Back: "As <code>n</code> values of <code>T</code> stored inline, back-to-back. It's a sized type: its length <code>n</code> is part of the type itself, known at compile time."
  tags:
    - rust
    - memory-layout
    - custom-types
    - arrays
- noteId: mt1-sized-vs-unsized-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: "What does the bound <code>T: ?Sized</code> mean, compared to a plain generic <code>T</code>?"
    Back: "Plain <code>T</code> implicitly means <code>T: Sized</code> &mdash; a fixed, compile-time-known size. <code>T: ?Sized</code> relaxes that, allowing <code>T</code> to also be a dynamically-sized type (DST) whose size isn't known until runtime."
  tags:
    - rust
    - memory-layout
    - custom-types
    - dst
- noteId: mt1-slice-type-unsized
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: What kind of type is the bare slice type <code>[T]</code> (no reference), and how is it normally used?
    Back: "A <b>slice type</b>: an unknown number of contiguous <code>T</code> elements. It's unsized &mdash; not <code>Sized</code>, and it doesn't itself carry a length &mdash; so it almost always appears behind a reference, as <code>&amp;[T]</code>."
  tags:
    - rust
    - memory-layout
    - custom-types
    - dst
- noteId: mt1-struct-field-reorder-padding
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: Can the compiler reorder fields or insert padding in a plain (non-<code>repr(C)</code>) Rust struct?
    Back: Yes to both &mdash; without a forced representation, the compiler may reorder a struct's fields and insert padding between them to satisfy alignment requirements.
  tags:
    - rust
    - memory-layout
    - custom-types
    - repr
- noteId: mt1-transmute-warning
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: Can two structs with the identical field lists, <code>A(X, Y)</code> and <code>B(X, Y)</code>, safely be converted into each other with <code>transmute()</code>?
    Back: Not safely, in general &mdash; identical fields don't guarantee identical layout. Never <code>transmute()</code> between types without an explicit, matching representation guarantee (e.g. both <code>#[repr(C)]</code>).
  tags:
    - rust
    - memory-layout
    - custom-types
    - unsafe
- noteId: mt1-tuple-layout-unspecified
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: Is the in-memory field order of a tuple <code>(A, B, C)</code> guaranteed to match its declared order?
    Back: No &mdash; unless a representation is explicitly forced (e.g. <code>#[repr(C)]</code>), the compiler is free to reorder a tuple's fields in memory however it wants.
  tags:
    - rust
    - memory-layout
    - custom-types
    - repr
- noteId: mt1-union-vs-enum
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: How does a Rust <code>union</code> differ from an <code>enum</code> in memory?
    Back: A <code>union</code> stores just one variant's data with no tag at all, so reading it as the wrong variant is undefined behavior; all field access is <code>unsafe</code>. An <code>enum</code> (tagged union) safely tracks which variant is currently active.
  tags:
    - rust
    - memory-layout
    - custom-types
    - unsafe
- noteId: mt1-zero-sized-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Custom Types
  fields:
    Front: How many bytes does a zero-sized type like <code>struct S;</code> occupy in memory?
    Back: Zero bytes. A unit struct (and other zero-sized types) has no runtime footprint.
  tags:
    - rust
    - memory-layout
    - custom-types
    - zst
- noteId: mt1-dst-struct-len-meta
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: "What is a reference's pointer metadata when it targets a dynamically-sized struct, e.g. <code>&amp;S</code> where <code>S { x: [u8] }</code>?"
    Back: "A <code>len</code> field: the count of elements in the struct's dynamically-sized trailing content."
  tags:
    - rust
    - memory-layout
    - references-pointers
    - fat-pointers
    - dst
- noteId: mt1-mut-ref-same-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: Do <code>&amp;mut T</code> and <code>*mut T</code> have a different memory layout from their immutable counterparts <code>&amp;T</code> / <code>*const T</code>?
    Back: No &mdash; the <code>mut</code> variants have an identical data layout to their immutable counterparts. Mutability is a compile-time access restriction, not a runtime layout difference.
  tags:
    - rust
    - memory-layout
    - references-pointers
- noteId: mt1-pointer-metadata-def
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: What is <b>pointer metadata</b>, and what's the difference between a <b>fat</b> and a <b>thin</b> pointer?
    Back: Pointer metadata is an extra field some reference/pointer types carry alongside the address &mdash; e.g. an element or byte length, or a pointer to a vtable. A pointer carrying such metadata is <b>fat</b>; one without it is <b>thin</b>.
  tags:
    - rust
    - memory-layout
    - references-pointers
    - fat-pointers
- noteId: mt1-raw-pointer-vs-ref
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: How does a raw pointer like <code>*const T</code> differ from a reference <code>&amp;T</code>, in layout and guarantees?
    Back: Same underlying layout (an address, plus metadata if <code>T</code> is unsized). But a raw pointer carries no compiler guarantees &mdash; it may be null, dangling, or unaligned &mdash; and using it requires <code>unsafe</code>.
  tags:
    - rust
    - memory-layout
    - references-pointers
    - unsafe
- noteId: mt1-ref-basic-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: What does a plain reference <code>&amp;'a T</code> look like in memory when <code>T</code> is sized?
    Back: Just a pointer-sized address (2, 4, or 8 bytes depending on platform) &mdash; a <b>thin pointer</b>. No extra metadata is needed since <code>T</code>'s size is known at compile time.
  tags:
    - rust
    - memory-layout
    - references-pointers
    - sizeof
- noteId: mt1-ref-validity-lifetime
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: What must a reference <code>&amp;'a T</code> guarantee about its target?
    Back: It must point at a valid, live value of <code>T</code>, and that target must remain valid for at least the lifetime <code>'a</code>.
  tags:
    - rust
    - memory-layout
    - references-pointers
    - lifetimes
- noteId: mt1-slice-ref-fat-pointer
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: What does a slice reference <code>&amp;[T]</code> consist of in memory?
    Back: "A fat pointer: an address (<code>ptr</code>) plus a <code>len</code> field giving the element count. <code>&amp;'a [T]</code> is the reference type of the unsized slice type <code>[T]</code>."
  tags:
    - rust
    - memory-layout
    - references-pointers
    - fat-pointers
- noteId: mt1-str-ref-fat-pointer
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: What does <code>&amp;str</code> consist of in memory, and what does its <code>len</code> field count?
    Back: "A fat pointer: an address (<code>ptr</code>) plus a <code>len</code> field. Unlike a slice's <code>len</code>, this one counts <b>bytes</b> of UTF-8 data, not characters."
  tags:
    - rust
    - memory-layout
    - references-pointers
    - fat-pointers
    - strings
- noteId: mt1-thin-pointer-sized-target
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: Is <code>&amp;T</code> thin or fat when <code>T</code> is a sized type?
    Back: Thin &mdash; no metadata is carried, since the size of a sized <code>T</code> is already known at compile time.
  tags:
    - rust
    - memory-layout
    - references-pointers
    - fat-pointers
- noteId: mt1-trait-object-fat-pointer
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: What does a trait object reference <code>&amp;dyn Trait</code> consist of in memory?
    Back: "A fat pointer with two pointer-sized fields: a <code>ptr</code> to the underlying data, and a second pointer to a <b>vtable</b>."
  tags:
    - rust
    - memory-layout
    - references-pointers
    - fat-pointers
    - trait-objects
- noteId: mt1-trait-object-vtable-contents
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::References & Pointers
  fields:
    Front: What does a trait object's vtable contain?
    Back: <ul><li>A pointer to the concrete type's <code>Drop::drop</code> implementation</li><li>The type's <code>size</code></li><li>The type's <code>align</code></li><li>A pointer to each trait method's <code>impl</code> for the concrete type</li></ul>
  tags:
    - rust
    - memory-layout
    - references-pointers
    - trait-objects
- noteId: mt2-binaryheap-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How is <code>BinaryHeap&lt;T&gt;</code> stored in memory?
    Back: "As a single flat heap-allocated array (<code>ptr</code>/<code>capacity</code>/<code>len</code>), not as linked nodes. It represents an implicit binary tree: layer <code>N</code> holds up to <code>2^N</code> elements, and every element is ordered larger than its two children (max-heap)."
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-box-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What does <code>Box&lt;T&gt;</code> store on the stack, and where does <code>T</code> live?
    Back: A pointer (plus, for unsized <code>T</code> like <code>Box&lt;[T]&gt;</code>, extra metadata such as a length) on the stack; the <code>T</code> itself is heap-allocated and singly owned by the box.
  tags:
    - rust
    - memory-layout
    - collections
    - smart-pointers
- noteId: mt2-cell-refcell-send-sync
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: Are <code>Cell&lt;T&gt;</code> and <code>RefCell&lt;T&gt;</code> <code>Send</code> and/or <code>Sync</code>?
    Back: Both are <code>Send</code> (they can move to another thread) but neither is <code>Sync</code> (no two threads may hold references to the same one at once) &mdash; their mutation isn't synchronized, so sharing across threads isn't safe.
  tags:
    - rust
    - memory-layout
    - concurrency
    - cells
- noteId: mt2-cell-use-case
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: When would you reach for <code>Cell&lt;T&gt;</code> instead of <code>RefCell&lt;T&gt;</code>?
    Back: When <code>T</code> is cheap to move/copy and you never need a live reference into it &mdash; just swap values in and out. <code>Cell</code> has no runtime borrow-check overhead and can't panic on a borrow conflict, unlike <code>RefCell</code>.
  tags:
    - rust
    - memory-layout
    - interior-mutability
    - cells
- noteId: mt2-cell-vs-refcell
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How do <code>Cell&lt;T&gt;</code> and <code>RefCell&lt;T&gt;</code> differ in how they enforce borrowing?
    Back: <code>Cell&lt;T&gt;</code> has no borrow tracking at all &mdash; it only lets you move <code>T</code> in and out (<code>get</code>/<code>set</code>/<code>replace</code>), never hands out a reference. <code>RefCell&lt;T&gt;</code> hands out real <code>&amp;T</code>/<code>&amp;mut T</code> references (as <code>Ref</code>/<code>RefMut</code>) but checks the borrow rules at runtime, panicking if they're violated.
  tags:
    - rust
    - memory-layout
    - interior-mutability
    - cells
- noteId: mt2-cow-semantics
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What does <code>Cow&lt;'a, T&gt;</code> represent?
    Back: "'Clone on write': an enum that's either a read-only borrowed reference to <code>T</code>, or an owned value (<code>T</code>'s <code>ToOwned</code> analog, e.g. <code>String</code> for <code>Cow&lt;str&gt;</code>). Lets code defer an allocation/clone until mutation is actually needed."
  tags:
    - rust
    - memory-layout
    - smart-pointers
- noteId: mt2-cow-use-case
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: Why use <code>Cow&lt;'a, T&gt;</code> instead of always taking an owned value?
    Back: It avoids cloning in the common case where the input can be used as-is (borrowed), while still letting the function fall back to owning/cloning only on the less-common path that needs to modify or outlive the borrow.
  tags:
    - rust
    - memory-layout
    - smart-pointers
- noteId: mt2-cstring-purpose
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What does <code>CString</code> guarantee that plain <code>String</code> doesn't, and why?
    Back: Its bytes are NUL-terminated with no interior NUL byte, matching what C APIs expect from a null-terminated string. <code>String</code> makes no such guarantee, so <code>CString</code> exists specifically for FFI interop with C.
  tags:
    - rust
    - memory-layout
    - strings
- noteId: mt2-hashmap-impl
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What underlying implementation does std's <code>HashMap&lt;K, V&gt;</code> use?
    Back: A SwissTable-style open-addressing hash table (the <code>hashbrown</code> crate), storing key-value pairs on the heap and using a control-byte array to probe for occupied/empty/deleted slots efficiently.
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-hashmap-no-order
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: Does <code>HashMap</code>'s iteration order reflect insertion order?
    Back: No. Placement is driven by each key's hash value, not insertion order, so iteration order is unspecified and can differ between runs of the same program.
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-hashset-vs-hashmap
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How does <code>HashSet&lt;T&gt;</code> relate to <code>HashMap&lt;K, V&gt;</code> in layout?
    Back: They're structurally identical &mdash; <code>HashSet&lt;T&gt;</code> is effectively a <code>HashMap&lt;T, ()&gt;</code>; the value type just disappears.
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-lazycell
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How does <code>LazyCell&lt;T, F&gt;</code> initialize its value?
    Back: "Lazily, on first access: it starts holding an uninitialized closure <code>F</code>, runs it the first time the value is needed, then stores the resulting <code>T</code> in place of the closure (or a poisoned state if that first run panicked)."
  tags:
    - rust
    - memory-layout
    - interior-mutability
    - cells
- noteId: mt2-linkedlist-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How is <code>LinkedList&lt;T&gt;</code> laid out, and why does it come with a warning?
    Back: It stores <code>head</code> and <code>tail</code> pointers plus a <code>len</code>; each node individually heap-allocates its <code>T</code> plus <code>next</code>/<code>prev</code> pointers. Because nodes scatter across the heap, iterating it is cache-hostile &mdash; prefer <code>Vec</code>/<code>VecDeque</code> unless you specifically need cheap mid-list splicing.
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-mutex-rwlock-sharing
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How do you actually share a <code>Mutex&lt;T&gt;</code> between independently-running threads?
    Back: Wrap it in an <code>Arc</code> so every thread holds a cloned, ref-counted handle to the same lock, or (for threads that don't outlive the current scope) use <code>thread::scope()</code> so a plain reference can be borrowed by the spawned threads instead.
  tags:
    - rust
    - memory-layout
    - concurrency
- noteId: mt2-oncecell
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What does <code>OnceCell&lt;T&gt;</code> guarantee?
    Back: It can be initialized at most once. Before that it holds no <code>T</code>; once set, it holds the value permanently and further writes are rejected.
  tags:
    - rust
    - memory-layout
    - interior-mutability
    - cells
- noteId: mt2-oncecell-vs-lazycell
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How do <code>OnceCell&lt;T&gt;</code> and <code>LazyCell&lt;T, F&gt;</code> differ?
    Back: <code>OnceCell</code> just remembers whether it has been set &mdash; you supply the value yourself (e.g. via <code>get_or_init</code>). <code>LazyCell</code> bundles the initialization closure <code>F</code> into the type itself, running it automatically the first time the value is accessed.
  tags:
    - rust
    - memory-layout
    - interior-mutability
    - cells
- noteId: mt2-osstring-purpose
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: Why does <code>OsString</code> exist alongside <code>String</code>?
    Back: Not every operating-system string is valid UTF-8. <code>OsString</code> encapsulates however the OS actually represents strings (e.g. WTF-8 on Windows) so it can round-trip real OS values that a UTF-8-only <code>String</code> couldn't hold.
  tags:
    - rust
    - memory-layout
    - strings
- noteId: mt2-owned-string-family
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: <code>String</code>, <code>CString</code>, <code>OsString</code>, <code>PathBuf</code> &mdash; what decides which one to use?
    Back: "<code>String</code>: general-purpose text, guaranteed UTF-8. <code>CString</code>: passing text across a C FFI boundary, needs NUL-termination. <code>OsString</code>: holding a raw OS string (env vars, args) that might not be UTF-8. <code>PathBuf</code>: an <code>OsString</code> specialized for filesystem paths."
  tags:
    - rust
    - memory-layout
    - strings
- noteId: mt2-pathbuf-relation
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How does <code>PathBuf</code> relate to <code>OsString</code>?
    Back: <code>PathBuf</code> wraps an <code>OsString</code> &mdash; it's the owned, growable filesystem-path type, using the same platform-defined encoding for the same reason (paths aren't guaranteed valid UTF-8 either).
  tags:
    - rust
    - memory-layout
    - strings
- noteId: mt2-rc-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What three things live in an <code>Rc&lt;T&gt;</code>'s single heap allocation?
    Back: A strong count, a weak count, and the <code>T</code> value itself &mdash; all colocated in one heap block. The <code>Rc</code> on the stack is just a pointer (plus metadata for unsized <code>T</code>).
  tags:
    - rust
    - memory-layout
    - smart-pointers
- noteId: mt2-rc-needs-cell-for-mutation
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: Can you mutate the <code>T</code> inside an <code>Rc&lt;T&gt;</code> or <code>Arc&lt;T&gt;</code> directly?
    Back: No &mdash; shared ownership alone only gives you shared (<code>&amp;T</code>) access. To mutate, nest a <code>Cell</code>/<code>RefCell</code> inside for <code>Rc</code>, or a <code>Mutex</code>/<code>RwLock</code>/atomic inside for <code>Arc</code>.
  tags:
    - rust
    - memory-layout
    - smart-pointers
    - interior-mutability
- noteId: mt2-rc-vs-arc
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What's the actual difference between <code>Rc&lt;T&gt;</code> and <code>Arc&lt;T&gt;</code>?
    Back: "Same layout and purpose &mdash; shared, reference-counted ownership &mdash; but <code>Rc</code>'s strong/weak counters are plain (non-atomic) integers, so it's neither <code>Send</code> nor <code>Sync</code>: single-thread only. <code>Arc</code> uses atomic counters, making it safe to share across threads provided the contained <code>T</code> is itself <code>Send</code> and <code>Sync</code>."
  tags:
    - rust
    - memory-layout
    - smart-pointers
    - concurrency
- noteId: mt2-string-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What's the stack layout of a <code>String</code>, and what invariant does it guarantee about its heap bytes?
    Back: "Like <code>Vec&lt;u8&gt;</code>: <code>ptr</code>/<code>capacity</code>/<code>len</code> pointing at a heap buffer. The guarantee <code>Vec&lt;u8&gt;</code> lacks is that those bytes are always valid UTF-8."
  tags:
    - rust
    - memory-layout
    - strings
- noteId: mt2-unsafecell-role
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What role does <code>UnsafeCell&lt;T&gt;</code> play in Rust's interior mutability story?
    Back: It's the one primitive the compiler special-cases to permit aliased mutation of the <code>T</code> inside it. Every other interior-mutability type (<code>Cell</code>, <code>RefCell</code>, <code>Mutex</code>, atomics, ...) is built on top of it; you almost never touch it directly.
  tags:
    - rust
    - memory-layout
    - interior-mutability
    - cells
- noteId: mt2-vec-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What three fields make up a <code>Vec&lt;T&gt;</code>'s stack representation?
    Back: <code>ptr</code>, <code>len</code>, and <code>capacity</code>. The pointer refers to a contiguous heap buffer; <code>len</code> elements are initialized, and <code>capacity</code> is how many could fit before a reallocation is needed.
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-vec-len-vs-capacity
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: What's the difference between a <code>Vec</code>'s <code>len</code> and its <code>capacity</code>?
    Back: <code>len</code> is how many elements are actually initialized and in use. <code>capacity</code> is the size of the underlying heap allocation &mdash; how many elements it could hold before <code>Vec</code> needs to grow (reallocate) again.
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-vec-vs-vecdeque-vs-linkedlist
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: Given the choice, when should you reach for <code>Vec</code>, <code>VecDeque</code>, or <code>LinkedList</code>?
    Back: <code>Vec</code> by default &mdash; contiguous and cache-friendly, cheap push/pop at the back. <code>VecDeque</code> when you need cheap push/pop at <i>both</i> ends (still one contiguous ring-buffer allocation). <code>LinkedList</code> almost never &mdash; its per-node heap allocations and pointer chasing make it slow in practice despite O(1) splicing.
  tags:
    - rust
    - memory-layout
    - collections
- noteId: mt2-vecdeque-layout
  modelName: Basic
  deckName: Rust Cheat Sheet::Memory Layout::Standard Library Types
  fields:
    Front: How does <code>VecDeque&lt;T&gt;</code> achieve O(1) push/pop at both ends?
    Back: "It's a ring buffer: one contiguous heap allocation (<code>ptr</code>/<code>capacity</code>) indexed with a <code>head</code> offset and a <code>len</code>. Elements can wrap around the end of the buffer, so the logically-ordered content may be split into two runs within the same allocation."
  tags:
    - rust
    - memory-layout
    - collections
- noteId: sl-iter-convenience-methods
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: Besides the trait impls, what convenience methods do collections conventionally expose for borrowing iteration?
    Back: <code>Collection::iter(&self) -&gt; Iter</code> and <code>Collection::iter_mut(&mut self) -&gt; IterMut</code>.
  tags:
    - rust
    - standard-library
    - iterators
- noteId: sl-iter-copy-gotcha
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: "Gotcha: <code>(&c).into_iter()</code> looks like it shouldn't consume anything, yet <code>into_iter()</code> always consumes its receiver. What's going on?"
    Back: It does consume its receiver &mdash; just not <code>c</code>. The receiver is <code>&c</code>, a reference, and references are <code>Copy</code>, so <code>into_iter()</code> consumes a copy of the reference and turns that into an iterator. The original <code>c</code> is untouched.
  tags:
    - rust
    - standard-library
    - iterators
- noteId: sl-iter-custom-collection-basics
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: To make your own <code>Collection&lt;T&gt;</code> iterable by value, what two things do you implement first?
    Back: |-
      A struct to hold iteration state (e.g. an index), and <code>Iterator</code> for it:<br>
      <code>struct IntoIter&lt;T&gt; { ... }</code><br>
      <code>impl Iterator for IntoIter&lt;T&gt; { type Item = T; ... }</code><br>
      This alone gives you something iterator-shaped, but no way to obtain it from <code>Collection&lt;T&gt;</code> yet.
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-extend-trait
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: What do you implement so users can do <code>c.extend(other)</code> on your custom collection?
    Back: <code>impl Extend for Collection&lt;T&gt;</code>.
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-extra-marker-traits
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: Beyond a bare <code>Iterator</code> impl, what extra <code>std::iter</code> traits should a well-behaved custom iterator (like <code>IntoIter</code>, <code>Iter</code>, <code>IterMut</code>) consider implementing?
    Back: <code>DoubleEndedIterator</code> (iterate from both ends), <code>ExactSizeIterator</code> (know the exact remaining length), and <code>FusedIterator</code> (guarantees <code>None</code> stays <code>None</code> once returned once).
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-for-loop-desugar
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: What does <code>for x in c { }</code> actually desugar to?
    Back: Syntactic sugar for calling <code>c.into_iter()</code> and looping, calling <code>.next()</code> on the resulting iterator until it returns <code>None</code>.
  tags:
    - rust
    - standard-library
    - iterators
- noteId: sl-iter-four-styles
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: What are the four broad styles for iterating a collection in Rust?
    Back: |-
      <ul>
      <li><code>for x in c { ... }</code> &mdash; imperative; good for side effects, interdependent steps, or early <code>break</code>.</li>
      <li><code>c.iter().map().filter()</code> &mdash; functional; often cleanest when you only want the results.</li>
      <li><code>c_iter.next()</code> &mdash; low-level, explicit <code>Iterator::next()</code> calls.</li>
      <li><code>c.get(n)</code> &mdash; manual indexing, bypassing iteration machinery entirely.</li>
      </ul>
  tags:
    - rust
    - standard-library
    - iterators
- noteId: sl-iter-fromiterator-collect
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: What do you implement so that any third-party iterator can <code>.collect()</code> into your custom collection?
    Back: <code>impl FromIterator for Collection&lt;T&gt;</code>. Once implemented, <code>some_iter.collect::&lt;Collection&lt;_&gt;&gt;()</code> works.
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-into-iter-basic
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: What does <code>c.into_iter()</code> do to a collection <code>c</code>, and what must <code>C</code> implement for it to exist?
    Back: "Turns <code>c</code> into an <code>Iterator</code> and <b>consumes</b> <code>c</code> in the process. Requires <code>C: IntoIterator</code>; the item type depends on what <code>C</code> was. This is the standard way to get an iterator."
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-intoiterator-three-forms
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: To make <code>for x in c</code>, <code>for x in &c</code>, and <code>for x in &mut c</code> all work for your own <code>Collection&lt;T&gt;</code>, what three impls do you need?
    Back: |-
      <code>impl IntoIterator for Collection&lt;T&gt;</code> (Item = <code>T</code>) enables <code>for x in c {}</code>.<br>
      <code>impl IntoIterator for &Collection&lt;T&gt;</code> (Item = <code>&T</code>) enables <code>for x in &c {}</code>.<br>
      <code>impl IntoIterator for &mut Collection&lt;T&gt;</code> (Item = <code>&mut T</code>) enables <code>for x in &mut c {}</code>.
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-iter-borrowing
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: How does <code>c.iter()</code> differ from <code>c.into_iter()</code>?
    Back: <code>c.iter()</code> is a courtesy method some collections provide; it returns a <b>borrowing</b> iterator and does not consume <code>c</code>. <code>c.into_iter()</code> always consumes.
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-iter-itermut-structs
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: What structs back the borrowing forms of iteration (<code>c.iter()</code> / <code>c.iter_mut()</code>) on a custom collection?
    Back: |-
      <code>Iter&lt;T&gt;</code>, holding <code>&Collection&lt;T&gt;</code> state, with <code>Item = &T</code>.<br>
      <code>IterMut&lt;T&gt;</code>, holding <code>&mut Collection&lt;T&gt;</code> state, with <code>Item = &mut T</code>.<br>
      Both implement <code>Iterator</code>; the code is essentially a repeat of the by-value case with <code>&T</code>/<code>&mut T</code> in place of <code>T</code>.
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-iter-mut
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: What does <code>c.iter_mut()</code> give you?
    Back: A mutably-borrowing iterator, letting you modify the collection's elements in place as you iterate.
  tags:
    - rust
    - standard-library
    - iterators
    - traits
- noteId: sl-iter-when-to-use-for
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Iterators
  fields:
    Front: When should you reach for a plain <code>for</code> loop instead of a functional <code>.iter()</code> chain?
    Back: When the chain would turn messy. The functional style is usually easiest to read, but readability wins over dogma &mdash; drop to <code>for</code> once the chain fights you.
  tags:
    - rust
    - standard-library
    - iterators
- noteId: sl-numconv-float-to-int-cast
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Number Conversions
  fields:
    Front: What does <code>as</code> do when casting a float to an integer (e.g. <code>x as u8</code>)?
    Back: |-
      It truncates the fractional part and saturates at the target type's bounds instead of wrapping or panicking:<br>
      <code>11.9_f32 as u8</code> gives <code>11</code> (truncated).<br>
      <code>1024_f32 as u8</code> gives <code>255</code> (saturated).
  tags:
    - rust
    - standard-library
    - numbers
    - conversions
- noteId: sl-numconv-int-narrowing
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Number Conversions
  fields:
    Front: How do you convert between integer types when the target might not be able to hold the value (narrowing)?
    Back: <code>u8::try_from(x)?</code> &mdash; fallible, returns a <code>Result</code>. If the source type is provably a subset of the target (widening), the infallible <code>From</code> works directly instead, e.g. <code>u32::from(my_u8)</code>.
  tags:
    - rust
    - standard-library
    - numbers
    - conversions
- noteId: sl-numconv-int-to-float-cast
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Number Conversions
  fields:
    Front: What can go wrong casting an integer to a float with <code>as</code> (e.g. <code>x as f32</code>)?
    Back: It can misrepresent the value once the integer exceeds the float's precision (e.g. <code>u64::MAX as f32</code> loses precision), or even produce <code>Inf</code> for values beyond the float's range (e.g. <code>u128::MAX as f32</code>).
  tags:
    - rust
    - standard-library
    - numbers
    - conversions
- noteId: sl-numconv-number-to-string
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Number Conversions
  fields:
    Front: "One-liner: convert any number (integer or float) into a <code>String</code>?"
    Back: <code>x.to_string()</code> &mdash; works for any type implementing <code>Display</code>, numbers included.
  tags:
    - rust
    - standard-library
    - numbers
    - conversions
- noteId: sl-numconv-string-to-number
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Number Conversions
  fields:
    Front: "One-liner: parse a <code>String</code> into a number?"
    Back: <code>x.parse::&lt;u8&gt;()?</code> or <code>x.parse::&lt;f32&gt;()?</code> &mdash; fallible, since the text might not be a valid number of that type.
  tags:
    - rust
    - standard-library
    - numbers
    - conversions
- noteId: sl-oneliner-cell-from-mut
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: iterate a <code>&mut [T]</code> (where <code>T: Copy</code>) while still being able to mutate individual elements during the iteration?"
    Back: <code>Cell::from_mut(mut_slice).as_slice_of_cells()</code><br>Turns the mutable slice into a slice of <code>Cell&lt;T&gt;</code>, sidestepping the usual one-mutable-borrow-at-a-time rule.
  tags:
    - rust
    - standard-library
    - one-liners
    - esoterics
- noteId: sl-oneliner-closure-capture-clone
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner idiom: pass a cloned value into a <code>move</code> closure without polluting the outer scope with the clone?"
    Back: |-
      <pre><code>wants_closure({
          let c = outer.clone();
          move || use_clone(c)
      })</code></pre>
      The clone is scoped to the block, so only the closure sees <code>c</code>.
  tags:
    - rust
    - standard-library
    - one-liners
    - closures
- noteId: sl-oneliner-concat-format
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: concatenate two <code>Display</code> values into a new string?"
    Back: <code>format!("{x}{y}")</code><br>Allocates a fresh <code>String</code>. If <code>x</code>/<code>y</code> aren't needed afterward, <code>write!</code> or <code>std::ops::Add</code> can avoid the extra allocation.
  tags:
    - rust
    - standard-library
    - one-liners
    - strings
- noteId: sl-oneliner-dyn-compat-canary
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: add a compile-time check ('canary') that trait <code>T</code> stays dyn-compatible (object-safe)?"
    Back: "<code>const _: Option&lt;&dyn T&gt; = None;</code><br>If <code>T</code> stops being dyn-compatible, this line fails to compile."
  tags:
    - rust
    - standard-library
    - one-liners
    - traits
- noteId: sl-oneliner-file-create
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: create a new file for writing?"
    Back: <code>File::create(PATH)?</code>
  tags:
    - rust
    - standard-library
    - one-liners
    - io
- noteId: sl-oneliner-file-create-openoptions
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: How do you create-or-truncate-and-open a file when you need more control than <code>File::create</code> gives you?
    Back: <code>OpenOptions::new().create(true).write(true).truncate(true).open(PATH)?</code>
  tags:
    - rust
    - standard-library
    - one-liners
    - io
- noteId: sl-oneliner-internal-macro-use
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: use a <code>macro_rules!</code> macro from elsewhere inside the same crate that defines it (without exporting it crate-wide)?"
    Back: |-
      Define it normally, then re-export it at the point of definition with restricted visibility:<br>
      <code>macro_rules! internal_macro {}</code> together with <code>pub(crate) use internal_macro;</code>
  tags:
    - rust
    - standard-library
    - one-liners
    - macros
- noteId: sl-oneliner-macro-var-args
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: How do you write a macro that accepts a variable number of arguments, and use them?
    Back: |-
      <pre><code>macro_rules! var_args {
          ($($args:expr),*) =&gt; {{ }}
      }</code></pre>
      Inside the body, expand over <code>$args</code> to repeat an operation per argument, e.g. calling <code>f</code> on each:<br>
      <code>$( f($args); )*</code>
  tags:
    - rust
    - standard-library
    - one-liners
    - macros
- noteId: sl-oneliner-read-to-string
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: read an entire file into a <code>String</code>?"
    Back: <code>read_to_string(path)?</code>
  tags:
    - rust
    - standard-library
    - one-liners
    - io
- noteId: sl-oneliner-semver-trick
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: What's the 'semver trick' for unifying two incompatible major versions of the same type across the ecosystem?
    Back: Depend on the newer crate as <code>my_crate = "next.version"</code> in <code>Cargo.toml</code>, then re-export its types from the old crate. Downstream code compiled against either version ends up with the same concrete type.
  tags:
    - rust
    - standard-library
    - one-liners
    - cargo
- noteId: sl-oneliner-split-lines
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::One-Liners
  fields:
    Front: "One-liner: split a string into lines?"
    Back: <code>s.lines()</code>
  tags:
