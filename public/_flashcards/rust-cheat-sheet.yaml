    - one-liners
    - strings
- noteId: sl-strconv-borrowed-osstr-path
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do you cheaply build the borrowed types <code>&OsStr</code> and <code>&Path</code> from a <code>&str</code>?
    Back: <code>OsStr::new(x)</code> and <code>Path::new(x)</code> &mdash; both borrow, no allocation. From the owned <code>OsString</code>/<code>PathBuf</code>, use <code>.as_os_str()</code> instead.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-bytes-to-string
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: Two ways to turn a <code>Vec&lt;u8&gt;</code> / <code>&[u8]</code> into a <code>String</code> &mdash; how do they differ?
    Back: |-
      <code>String::from_utf8(x)?</code> &mdash; strict, fails (returns <code>Err</code>) if the bytes aren't valid UTF-8.<br>
      <code>String::from_utf8_lossy(x).to_string()</code> &mdash; always succeeds, replacing invalid sequences with the replacement character.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-cstr-from-ptr
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do you wrap a raw <code>*const c_char</code> coming from FFI as a <code>&CStr</code>?
    Back: <code>unsafe { CStr::from_ptr(x) }</code> &mdash; unsafe because it trusts the caller that the pointer is valid and NUL-terminated.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-cstr-nul-requirement
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: What must a byte slice already satisfy before you can turn it into a <code>&CStr</code>, and what checks that?
    Back: It must already end with a terminating NUL byte (<code>0x0</code>). <code>CStr::from_bytes_with_nul(x)?</code> validates this and errors if it's missing; there's no shorthand from a plain <code>&str</code>, since those never carry a trailing NUL &mdash; go via an owned <code>CString</code> instead.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-cstring-new
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do you build a <code>CString</code> from a <code>String</code>, <code>&str</code>, or <code>Vec&lt;u8&gt;</code>, and when does it fail?
    Back: <code>CString::new(x)?</code> for all three. It fails if the data contains an interior NUL byte (<code>0x0</code>), since a C string can't represent one.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-cstring-raw-pointer
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do <code>CString</code> and a raw <code>*mut c_char</code> convert into each other?
    Back: |-
      <code>CString -&gt; *mut c_char</code>: hand it to FFI via <code>x.as_ptr()</code> (as <code>*const</code>) or <code>into_raw()</code>.<br>
      <code>*mut c_char -&gt; CString</code>: <code>unsafe { CString::from_raw(x) }</code> &mdash; the pointer <b>must</b> have originally come from a <code>CString</code>, or this is undefined behavior. Pointers from FFI/foreign code should go through <code>&CStr</code> instead.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-cstring-to-string
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do you get an owned <code>String</code> back out of a <code>CString</code>?
    Back: <code>x.into_string()?</code> &mdash; fails if the bytes aren't valid UTF-8 (C strings carry no encoding guarantee).
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-into-as-ref-shorthand
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: Across all these string-type conversions, when can you skip the named constructor and just write <code>x.into()</code> or <code>x.as_ref()</code>?
    Back: Whenever the target type can be inferred from context. <code>x.into()</code> substitutes for infallible owned conversions (e.g. building an <code>OsString</code>/<code>PathBuf</code> from a <code>String</code>); <code>x.as_ref()</code> substitutes for borrowing conversions (e.g. getting a <code>&Path</code>).
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-osstring-pathbuf-relation
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How are <code>OsString</code> and <code>PathBuf</code> related, conversion-wise?
    Back: "They share the same underlying encoded-byte representation &mdash; converting between them is a relabel, not a re-encode: <code>os_string.into()</code> / <code>PathBuf::from(os_string)</code> one way, <code>path_buf.into_os_string()</code> the other."
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-osstring-purpose
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: What is <code>OsString</code> for, and how do you build one from a Rust <code>String</code>?
    Back: "<code>OsString</code> represents a platform-native string (paths, env vars, args) that may not be valid UTF-8 on some platforms. From a valid-UTF-8 <code>String</code> or <code>&str</code>, conversion is infallible: <code>OsString::from(x)</code> (or <code>x.into()</code>)."
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-str-from-utf8-borrowed
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do you get a <code>&str</code> out of a <code>&[u8]</code> without allocating?
    Back: <code>std::str::from_utf8(x)?</code> &mdash; borrows the same bytes, but validates them as UTF-8 first and can fail.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-str-string-roundtrip
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do you convert between <code>&str</code> and owned <code>String</code>?
    Back: |-
      <code>&str -&gt; String</code>: <code>x.to_string()</code> (or <code>x.into()</code> if the target type is inferable).<br>
      <code>String -&gt; &str</code>: <code>x.as_str()</code>, a cheap borrow.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strconv-string-to-bytes
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Conversions
  fields:
    Front: How do you get the raw bytes out of a <code>String</code> vs. out of a <code>&str</code>?
    Back: |-
      <code>String -&gt; Vec&lt;u8&gt;</code>: <code>x.into_bytes()</code> &mdash; owned, no copy, since <code>String</code> already owns a UTF-8 byte buffer.<br>
      <code>&str -&gt; &[u8]</code>: <code>x.as_bytes()</code> &mdash; a cheap borrow.
  tags:
    - rust
    - standard-library
    - strings
    - conversions
- noteId: sl-strout-alternate-flag
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: What does the <code>#</code> flag do in a format spec?
    Back: "Selects 'alternate' formatting: it pretty-prints <code>Debug</code> output (<code>{:#?}</code> vs <code>{:?}</code>), and prefixes hex/octal/binary output with <code>0x</code>/<code>0o</code>/<code>0b</code> when combined with a numeric <code>type</code>."
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-argument-selector
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: Inside <code>{...}</code>, how can the <code>argument</code> part identify which value to format?
    Back: By position (<code>{0}</code>, <code>{1}</code>, ...), or by a variable/name captured from scope directly (<code>{x}</code>, edition '21+) &mdash; e.g. <code>print!("{x}")</code>.
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-display-vs-debug
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: In format strings, what's the difference between the <code>{}</code> and <code>{:?}</code> placeholders?
    Back: <code>{}</code> formats via the <code>Display</code> trait &mdash; only implemented for types with one sensible textual representation (numbers, <code>bool</code>, <code>char</code>, <code>String</code>, <code>&str</code>, ...). <code>{:?}</code> formats via <code>Debug</code>, which is implemented for almost everything, including containers and non-string types that don't implement <code>Display</code> at all.
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-dynamic-width-precision
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: How do you make a format spec's <code>width</code> or <code>precision</code> come from another argument at runtime, instead of being a fixed literal?
    Back: "Append <code>$</code> after the number: it's then read as an argument index rather than a literal value, e.g. <code>{val:^2$}</code> centers <code>val</code> with a width taken from the 3rd argument (index 2)."
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-fill-align-sign
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: In a format spec, what do <code>fill</code>, <code>align</code>, and <code>sign</code> control?
    Back: |-
      <code>fill</code> &mdash; the padding character used when <code>width</code> is set (default: space).<br>
      <code>align</code> &mdash; left (<code>&lt;</code>), center (<code>^</code>), or right (<code>&gt;</code>), also only relevant with a <code>width</code>.<br>
      <code>sign</code> &mdash; <code>+</code> forces the sign to always print, even for positive numbers.
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-format-macro-destinations
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: "Where does each of the format-macro family send its output: <code>format!</code>, <code>print!</code>/<code>println!</code>, <code>eprint!</code>/<code>eprintln!</code>, <code>write!</code>/<code>writeln!</code>?"
    Back: |-
      <code>format!</code> &mdash; returns a <code>String</code>.<br>
      <code>print!</code> / <code>println!</code> &mdash; writes to standard output.<br>
      <code>eprint!</code> / <code>eprintln!</code> &mdash; writes to standard error.<br>
      <code>write!</code> / <code>writeln!</code> &mdash; writes into an arbitrary <code>Write</code> destination (needs <code>use std::io::Write;</code> in scope).
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-format-spec-structure
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: What's the general structure of a format-string placeholder's spec, beyond a bare <code>{}</code> or <code>{argument}</code>?
    Back: |-
      <pre><code>{ [argument] ':' [[fill] align] [sign] ['#'] [width] ['.' precision] [type] }</code></pre>
      Everything after the <code>:</code> is optional and independently combinable.
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-full-example
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: What does <code>format!("{a:.3} {b:?}")</code> produce?
    Back: "A <code>String</code>: <code>a</code> formatted with 3 digits of precision, a space, then <code>b</code> formatted via <code>Debug</code>."
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-tostring-display
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: What does <code>x.to_string()</code> require of <code>x</code>'s type, and what does it produce?
    Back: Requires <code>Display</code> to be implemented for the type; produces an owned <code>String</code>.
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-type-specifiers
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: What are some of the <code>type</code> specifiers available at the end of a format spec, besides the default <code>Display</code>?
    Back: <code>?</code> for <code>Debug</code>, <code>x</code> for hex, <code>b</code> for binary, <code>o</code> for octal, <code>p</code> for pointer, <code>e</code> for exponential notation.
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-strout-width-vs-precision
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::String Output
  fields:
    Front: "Gotcha: <code>precision</code> in a format spec means different things depending on the argument type. What are the two meanings?"
    Back: For numeric types, it's the number of decimal digits to show. For non-numeric types (like strings), it's instead a maximum width &mdash; longer input gets truncated.
  tags:
    - rust
    - standard-library
    - strings
    - formatting
- noteId: sl-thread-async-block-send-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: When is an <code>async { }</code> block's resulting <code>Future</code> <code>Send</code>?
    Back: When no <code>!Send</code> type is held live across an <code>.await</code> point. E.g. <code>async { Rc::new(x) }</code> is <code>Send</code> (the <code>Rc</code> never crosses an <code>.await</code>), but <code>async { rc; x.await; rc; }</code> is <code>!Send</code> (an <code>Rc</code> is alive across the <code>.await</code>).
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-cell-send-only
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: Why is <code>Cell&lt;u32&gt;</code> <code>Send</code> but not <code>Sync</code>?
    Back: It can be safely moved (nothing thread-specific about owning it), but sharing <code>&Cell&lt;u32&gt;</code> across threads would let two threads mutate it concurrently through non-atomic writes &mdash; a data race.
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-closure-send-gotcha
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: "Gotcha: is <code>|x| { Rc::new(x) }</code> <code>Send</code>, given that <code>Rc</code> is not <code>Send</code>?"
    Back: Yes. The closure captures nothing from its environment &mdash; <code>Rc::new</code> only runs when called, on whichever thread calls it. <code>Rc</code>'s non-<code>Send</code>-ness only matters for values actually captured or held.
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-closure-send-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: When is a closure <code>Send</code>?
    Back: When everything it <b>captures</b> is <code>Send</code>. A closure that captures nothing (e.g. <code>|x| { x + 1 }</code> with no outer variables) is <code>Send</code> regardless of what it does with its argument.
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-mutex-both
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: Is <code>Mutex&lt;u32&gt;</code> <code>Send</code>, <code>Sync</code>, both, or neither?
    Back: Both. It can be safely moved to another thread, or lent by reference to another thread.
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-mutexguard-sync-only
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: Why is <code>MutexGuard&lt;u32&gt;</code> <code>Sync</code> but not <code>Send</code>?
    Back: The guard is tied to the thread that locked the mutex, so it can't be moved elsewhere. But sharing a reference to it is fine, since using that reference can't create a data race.
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-notsync-examples-table
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: Name common types that are <code>!Sync</code>, split by whether they're still <code>Send</code>.
    Back: "<code>!Sync</code> + <code>Send</code>: <code>Cell&lt;T&gt;</code>, <code>RefCell&lt;T&gt;</code> (when <code>T: Send</code>).<br><code>!Sync</code> + <code>!Send</code>: <code>Rc&lt;T&gt;</code>, <code>&dyn Trait</code>, <code>*const T</code>."
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-raw-pointer-send
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: Raw pointers (<code>*const T</code>) aren't <code>Send</code>. How do you send one across a thread boundary anyway?
    Back: |-
      Wrap it in a newtype and manually assert the promise:<br>
      <code>struct Ptr(*const u8);</code><br>
      <code>unsafe impl Send for Ptr {}</code><br>
      You're on the hook for making sure it's actually safe to send.
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-rc-neither
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: Why is <code>Rc&lt;u32&gt;</code> neither <code>Send</code> nor <code>Sync</code>?
    Back: Its internal reference count is a plain, non-atomic counter, and it's trivially cloneable &mdash; moving or sharing it across threads could corrupt the count.
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-send-enum-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: When is an <code>enum E { ... }</code> automatically <code>Send</code>?
    Back: When every field in every variant is <code>Send</code> (or manually <code>unsafe impl</code>'d).
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-send-generic-struct-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: When is a generic <code>struct S&lt;T&gt; { ... }</code> automatically <code>Send</code>?
    Back: When every field is <code>Send</code> <b>and</b> <code>T</code> itself is <code>Send</code> (or manually <code>unsafe impl</code>'d).
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-send-reference-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: When is <code>&T</code> <code>Send</code>?
    Back: When <code>T</code> is <code>Sync</code>. (This is exactly what <code>Sync</code> means.)
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-send-struct-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: When is a plain <code>struct S { ... }</code> automatically <code>Send</code>?
    Back: When every field is <code>Send</code> (or the trait is <code>unsafe impl</code>'d manually).
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-send-vs-sync
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: What do the <code>Send</code> and <code>Sync</code> marker traits each govern?
    Back: "<code>Send</code>: a value of this type may be <b>moved</b> to another thread.<br><code>Sync</code>: a <b>reference</b> to this type (<code>&T</code>) may be shared with another thread &mdash; equivalently, <code>&T</code> itself is <code>Send</code>."
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: sl-thread-sync-examples-table
  modelName: Basic
  deckName: Rust Cheat Sheet::Standard Library::Thread Safety
  fields:
    Front: Name common types that are <code>Sync</code>, split by whether they're also <code>Send</code>.
    Back: "<code>Sync</code> + <code>Send</code>: most types, plus <code>Arc&lt;T&gt;</code> and <code>Mutex&lt;T&gt;</code> (when <code>T</code> is <code>Send</code>/<code>Sync</code> as required).<br><code>Sync</code> + <code>!Send</code>: <code>MutexGuard&lt;T&gt;</code>, <code>RwLockReadGuard&lt;T&gt;</code> (when <code>T: Sync</code>)."
  tags:
    - rust
    - standard-library
    - concurrency
    - send-sync
- noteId: ml1-auto-traits
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What are <b>auto traits</b> in Rust?
    Back: Traits that get implemented automatically for your types, closures, and futures whenever possible, without you writing an explicit <code>impl</code>.
  tags:
    - rust
    - language-sugar
    - traits
- noteId: ml1-coercion
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What does a <b>coercion</b> do to a type in Rust?
    Back: It weakens a type to match an expected signature, e.g. converting <code>&amp;mut T</code> to <code>&amp;T</code>.
  tags:
    - rust
    - language-sugar
    - coercion
    - type-conversion
- noteId: ml1-deref-sugar
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What does Rust's automatic <b>deref</b> coercion do?
    Back: "Repeatedly dereferences a value <code>x: T</code> (<code>*x</code>, <code>**x</code>, &hellip;) until it reaches some target type <code>S</code> that's expected at the call site."
  tags:
    - rust
    - language-sugar
    - deref
- noteId: ml1-drop-hidden-flow
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: When can <code>T::drop()</code> get called implicitly by the compiler?
    Back: At the end of a block <code>{ ... }</code>, or when a value is assigned to <code>_</code>, the compiler may insert a call to <code>Drop::drop()</code>.
  tags:
    - rust
    - language-sugar
    - drop
- noteId: ml1-drop-not-callable
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: Why can't you call <code>value.drop()</code> directly?
    Back: The compiler forbids explicitly calling <code>T::drop()</code>; you must call <code>mem::drop()</code> instead, which takes ownership and lets the implicit drop run.
  tags:
    - rust
    - language-sugar
    - drop
- noteId: ml1-dual-definitions
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What are "dual definitions" for a tuple struct like <code>struct S(u8)</code>?
    Back: Defining the struct implicitly also defines a function of the same name (a constructor, roughly <code>fn S(u8) -&gt; S</code>).
  tags:
    - rust
    - language-sugar
    - structs
- noteId: ml1-lifetime-elision
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What does <b>lifetime elision</b> let you write?
    Back: "It lets you write <code>fn f(x: &amp;T)</code> instead of spelling out <code>fn f&lt;'a&gt;(x: &amp;'a T)</code> &mdash; the compiler infers the lifetime for you."
  tags:
    - rust
    - language-sugar
    - lifetimes
- noteId: ml1-lifetime-extension
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What does temporary <b>lifetime extension</b> do, e.g. in <code>let x = &amp;tmp().f;</code>?
    Back: It keeps a temporary value alive past the end of the line that created it, instead of dropping it immediately.
  tags:
    - rust
    - language-sugar
    - lifetimes
    - temporaries
- noteId: ml1-match-ergonomics
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What do <b>match ergonomics</b> do?
    Back: They repeatedly dereference the matched scrutinee and automatically add <code>ref</code> / <code>ref mut</code> to bindings, so you can match through a reference without manual derefs.
  tags:
    - rust
    - language-sugar
    - pattern-matching
    - references
- noteId: ml1-method-resolution
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: How does Rust find the right target for a method call like <code>x.f()</code>?
    Back: <b>Method resolution</b> automatically dereferences or borrows <code>x</code>, trying each step in turn, until a matching method <code>f</code> is found.
  tags:
    - rust
    - language-sugar
    - methods
    - deref
- noteId: ml1-prelude
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What is the Rust <b>prelude</b>?
    Back: A set of basic items (e.g. <code>Option</code>, <code>drop()</code>) that get imported automatically into every module, with no explicit <code>use</code> needed.
  tags:
    - rust
    - language-sugar
    - prelude
- noteId: ml1-reborrow
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: "Why doesn't passing an existing <code>x: &amp;mut T</code> somewhere move <code>x</code> itself?"
    Back: "<code>&amp;mut T</code> can't be copied, so Rust implicitly <b>reborrows</b>: it moves a fresh <code>&amp;mut *x</code> instead of consuming <code>x</code>."
  tags:
    - rust
    - language-sugar
    - reborrow
    - mutable-references
- noteId: ml1-rvalue-static-promotion
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Language Sugar
  fields:
    Front: What is <b>rvalue static promotion</b>?
    Back: It promotes references to constant values to <code>'static</code>, e.g. <code>&amp;42</code>, <code>&amp;None</code>, <code>&amp;mut []</code>, so they can outlive the expression that created them.
  tags:
    - rust
    - language-sugar
    - lifetimes
    - static
- noteId: ml1-async-stack-frame
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Is a variable declared with <code>let</code> always on the stack?
    Back: Not always &mdash; that holds for synchronous code, but an <code>async</code> function's stack frame may be placed on the heap instead, depending on the async runtime.
  tags:
    - rust
    - memory-lifetimes
    - stack
    - async
- noteId: ml1-binding-vs-reference-guarantee
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What's the difference between what a binding and a reference each guarantee?
    Back: A binding guarantees it always <b>holds</b> valid data. A reference guarantees it always <b>points to</b> valid data.
  tags:
    - rust
    - memory-lifetimes
    - references
    - ownership
- noteId: ml1-copy-types-moves
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: How do <code>Copy</code> types change move semantics?
    Back: The value is copied instead of moved, so the source is still valid afterward. <code>Copy</code> values also never get dropped, and never leave an "empty" variable location behind.
  tags:
    - rust
    - memory-lifetimes
    - copy
    - moves
- noteId: ml1-deref-assign-drops
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What happens on an assignment through a reference, like <code>*r = S(2);</code>?
    Back: The old value at that location is dropped before the new value is written in.
  tags:
    - rust
    - memory-lifetimes
    - references
    - drop
- noteId: ml1-deref-meaning
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What does the dereference <code>*r</code> refer to?
    Back: The location that <code>r</code> points to (its referent) &mdash; not the location of <code>r</code> itself, and not some value "inside" <code>r</code>.
  tags:
    - rust
    - memory-lifetimes
    - references
    - deref
- noteId: ml1-drop-exceptions
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What are some exceptions to a non-<code>Copy</code> value getting dropped?
    Back: <code>mem::forget()</code>, reference cycles in <code>Rc</code>, and process termination via <code>abort()</code>.
  tags:
    - rust
    - memory-lifetimes
    - drop
- noteId: ml1-drop-on-reassignment
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Besides leaving scope, when else does <code>Drop::drop()</code> get called on a location?
    Back: When a new value is assigned to an existing variable, e.g. <code>c = S(3);</code> drops the old value in <code>c</code> before the new one is stored.
  tags:
    - rust
    - memory-lifetimes
    - drop
- noteId: ml1-drop-scope-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: When, roughly, does a variable's value get dropped due to scope?
    Back: "Rule of thumb: when execution reaches the point where the variable's name leaves the <code>{}</code> block it was defined in (details get trickier for temporaries)."
  tags:
    - rust
    - memory-lifetimes
    - drop
    - scope
- noteId: ml1-function-call-stack
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What happens on the stack when a function is called?
    Back: Memory for its parameters (and return value) is reserved on the stack. The caller's argument value is moved into that agreed-upon location, where it acts as a local variable inside the callee.
  tags:
    - rust
    - memory-lifetimes
    - stack
    - functions
- noteId: ml1-lifetime-motivation
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Why do lifetimes exist, in terms of the stack?
    Back: Fixed-size stack values are trivial to manage on their own &mdash; but handing out pointers to these transient stack locations is exactly the problem that lifetimes exist to solve.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - stack
- noteId: ml1-memory-segments
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What regions is application memory typically segmented into?
    Back: <ul><li><b>Stack</b> &mdash; small, low-overhead; most variables live here</li><li><b>Heap</b> &mdash; large, flexible; always accessed via a stack proxy like <code>Box&lt;T&gt;</code></li><li><b>Static</b> &mdash; commonly holds the <code>str</code> part of <code>&amp;str</code></li><li><b>Code</b> &mdash; holds compiled function bitcode</li></ul>
  tags:
    - rust
    - memory-lifetimes
    - stack
    - heap
- noteId: ml1-move-semantics
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What happens when you write <code>let a = t;</code> and <code>S</code> is not <code>Copy</code>?
    Back: The value is <b>moved</b> from <code>t</code>'s location to <code>a</code>'s location. After the move, <code>t</code> is invalid and can no longer be read.
  tags:
    - rust
    - memory-lifetimes
    - moves
    - ownership
- noteId: ml1-move-undefined-behavior
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Is it safe to read a moved-from variable's bits via <code>unsafe</code>?
    Back: No. The bits left behind aren't necessarily empty, just <b>undefined</b> &mdash; even if they still look like a valid value, using them as one is undefined behavior.
  tags:
    - rust
    - memory-lifetimes
    - moves
    - unsafe
- noteId: ml1-mut-ref-restrictions
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What extra restrictions does <code>&amp;mut T</code> have, beyond what a plain variable needs?
    Back: It must never let you write invalid data through it, and never let you move data out through it &mdash; since that would leave its target empty without the owner knowing.
  tags:
    - rust
    - memory-lifetimes
    - references
    - mutability
- noteId: ml1-recursion-overflow
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What happens to the stack across recursive or nested function calls?
    Back: Each call extends the stack frame further. Too many nested invocations &mdash; especially unbounded recursion &mdash; grows the stack until it overflows, terminating the program.
  tags:
    - rust
    - memory-lifetimes
    - stack
    - recursion
- noteId: ml1-reference-holds-location
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What does a reference type like <code>&amp;S</code> hold?
    Back: The <b>location</b> of a value of type <code>S</code> &mdash; not the value itself. E.g. <code>let r = &amp;a;</code> makes <code>r</code> hold the address of <code>a</code>.
  tags:
    - rust
    - memory-lifetimes
    - references
- noteId: ml1-reference-type-inference
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "Do you need to spell out a reference's type, e.g. <code>let r: &amp;S = &amp;a;</code>?"
    Back: No &mdash; like most types, it can usually be inferred, so you can just write <code>let r = &amp;a;</code>.
  tags:
    - rust
    - memory-lifetimes
    - references
    - type-inference
- noteId: ml1-shared-vs-mut-ref
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What's the access difference between <code>&amp;S</code> and <code>&amp;mut S</code>?
    Back: <code>&amp;S</code> only allows <b>reading</b> from the location it points to. <code>&amp;mut S</code> allows both <b>reading and writing</b> to that location.
  tags:
    - rust
    - memory-lifetimes
    - references
    - mutability
- noteId: ml1-stack-repurposing
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What happens to a stack location after the function using it returns?
    Back: "It gets repurposed: memory that held one variable's value can later be reused, even partially, for an unrelated variable of a different type."
  tags:
    - rust
    - memory-lifetimes
    - stack
- noteId: ml1-type-conversion-rule
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "Do conversions between two Rust types succeed by default, e.g. <code>let c: S = M::new();</code>?"
    Back: No &mdash; conversions between types always fail unless an explicit rule permits it, such as a coercion or a cast.
  tags:
    - rust
    - memory-lifetimes
    - types
    - coercion
- noteId: ml1-type-purposes
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What three things does a variable's type control?
    Back: <ul><li>How its underlying bits should be interpreted</li><li>Which operations on those bits are well-defined</li><li>What other values/bits are allowed to be written there</li></ul>
  tags:
    - rust
    - memory-lifetimes
    - types
- noteId: ml1-variable-reserves
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What does <code>let t = S(1);</code> reserve?
    Back: A memory location named <code>t</code>, of type <code>S</code>, holding the value <code>S(1)</code>. With plain <code>let</code> in synchronous code, that location lives on the stack.
  tags:
    - rust
    - memory-lifetimes
    - stack
    - variables
- noteId: ml1-variable-three-meanings
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: The word "variable" is linguistically ambiguous &mdash; what three things can it mean?
    Back: <ul><li>The <b>name</b> in the source file</li><li>The <b>location</b> in the compiled program (an address)</li><li>The <b>value</b> stored there</li></ul>
  tags:
    - rust
    - memory-lifetimes
    - variables
- noteId: ml2-borrow-ends-when-unused
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: When does the original binding <code>b</code> become usable again after being borrowed?
    Back: As soon as the borrowing reference (<code>&amp;b</code> / <code>&amp;mut b</code>) stops being used, counted in lines of code &mdash; not necessarily at the end of its enclosing lexical block.
  tags:
    - rust
    - memory-lifetimes
    - borrowing
    - references
- noteId: ml2-borrow-marks-variable
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What happens to a variable once its address is taken with <code>&amp;b</code> or <code>&amp;mut b</code>?
    Back: The variable is marked as <b>borrowed</b>. While borrowed, its contents can no longer be modified through the original binding <code>b</code> &mdash; only through the reference that borrowed it.
  tags:
    - rust
    - memory-lifetimes
    - borrowing
    - references
- noteId: ml2-borrowed-state-example
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: |-
      Why does this fail to compile?<br><pre><code>let mut b = S(0);
      let r = &amp;mut b;

      b = S(4);   // ??

      print_byte(r);</code></pre>
    Back: <code>b</code> is mutably borrowed by <code>r</code>, and that borrow is still in use later (in <code>print_byte(r)</code>). While a borrow is alive, the original binding <code>b</code> cannot be reassigned.
  tags:
    - rust
    - memory-lifetimes
    - borrowing
    - references
- noteId: ml2-lifetime-def
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: In Rust terminology, what does <code>lifetime</code> refer to?
    Back: The lines of code (or actual time) between when a location starts being used in a particular way and when that usage stops, or between when a value is created and when it is dropped.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - terminology
- noteId: ml2-lifetime-param-meaning
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "For a lifetime parameter such as <code>r: &amp;'a S</code>, what does <code>'a</code> constrain?"
    Back: How long whatever <code>r</code> points to must stay accessible (or locked). It says nothing about how long <code>r</code> itself exists as a variable &mdash; only that <code>r</code> can't outlive <code>'a</code>.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - references
- noteId: ml2-lifetime-typelike
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "In what sense does a lifetime like <code>'c</code> in <code>r: &amp;mut 'c S</code> behave like a type?"
    Back: It constrains what can validly be assigned into <code>r</code>, the same way a type would. Assigning a reference whose target doesn't live at least as long as <code>'c</code> is rejected at compile time, even though <code>r</code> is otherwise a normal reassignable binding.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - references
- noteId: ml2-lifetime-typelike-example
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: |-
      In this nested-scope example, why does the second reassignment fail while the third succeeds?<br><pre><code>{
          let b = S(3);
          {
              let c = S(2);
              let r: &amp;'c S = &amp;c;
              {
                  let a = S(0);
                  r = &amp;a;   // ?
                  r = &amp;b;   // ?
              }
          }
      }</code></pre>
    Back: <code>r</code>'s type fixes its lifetime at <code>'c</code>, the scope of <code>c</code>. <code>b</code> was declared before <code>c</code> and outlives it, so <code>&amp;b</code> satisfies <code>'c</code>. <code>a</code> is declared in an inner block and is dropped before <code>c</code> is, so <code>&amp;a</code> doesn't live long enough and is rejected.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - references
- noteId: ml2-raw-pointer-deref-unsafe
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Why is dereferencing a raw pointer (e.g. <code>*p</code>) restricted to <code>unsafe</code> blocks?
    Back: Because nothing checks that the pointer is valid first. Treating an invalid <code>*p</code> as if it pointed to real data is undefined behavior, so the language forces you to opt in explicitly.
  tags:
    - rust
    - memory-lifetimes
    - raw-pointers
    - unsafe
- noteId: ml2-raw-pointer-guarantees
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What guarantees do raw pointers (<code>*const T</code> / <code>*mut T</code>) give you, compared to references?
    Back: Almost none. Unlike references, a raw pointer may point to invalid or non-existent data; the compiler tracks no lifetime or validity for it at all.
  tags:
    - rust
    - memory-lifetimes
    - raw-pointers
    - unsafe
- noteId: ml2-ref-triple-guarantee
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "Given a value <code>r: &amp;'c S</code>, what three guarantees does that type carry?"
    Back: <ul><li><code>r</code> holds the address of some <code>S</code></li><li>whatever that address points to is guaranteed to exist for at least <code>'c</code></li><li><code>r</code> itself cannot live longer than <code>'c</code></li></ul>
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - references
- noteId: ml2-scope-def
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: In Rust terminology, what does <code>scope</code> refer to?
    Back: The lines of code (LOC) over which a name/item is available (e.g. a module name), or the LOC between a variable's location being initialized with a value and that location being abandoned.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - terminology
- noteId: ml2-static-lifetime
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: What does the lifetime in <code>&amp;'static S</code> require?
    Back: That the referenced address stays valid for the entire run of the program &mdash; i.e. during all lines of code, not just some subset of them.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - references
- noteId: ml3-auto-coercion-mut-to-shared
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: If you pass a <code>&amp;mut S</code> value to a function parameter expecting <code>&amp;S</code>, what happens?
    Back: It's automatically coerced from mutable to shared. This has to happen because a target can't have a live shared reference and a live mutable reference to it at the same time.
  tags:
    - rust
    - memory-lifetimes
    - references
    - coercion
- noteId: ml3-binding-name-vs-underscore-drop
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: How does binding a value to a named variable differ from binding it to <code>_</code>, in terms of when it gets dropped?
    Back: A named binding keeps its value alive until the end of its scope, then drops it. A value bound to <code>_</code> is (usually) dropped immediately, right at the binding site.
  tags:
    - rust
    - memory-lifetimes
    - drop
    - ownership
- noteId: ml3-fn-refs-borrow-both-args
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: When a function takes two reference parameters and returns a reference, what happens to both argument variables at the call site?
    Back: Both become borrowed. The compiler doesn't know at compile time which of the two arguments the returned reference actually points to, so it conservatively locks both until that's resolved.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - borrowing
- noteId: ml3-lifetime-choice-callsite
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Who chooses the concrete lifetimes (like <code>'b</code>, <code>'c</code>) that fill in a generic function's lifetime parameters, and when?
    Back: The compiler, transparently, at the call site &mdash; based on the actual borrowed variables the caller passes in. You never write these lifetime arguments explicitly.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
- noteId: ml3-lifetime-params-purpose
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "What do named lifetime parameters (e.g. <code>'c</code> in <code>fn f&lt;'b, 'c&gt;(x: &amp;'b S, y: &amp;'c S) -&gt; &amp;'c u8</code>) actually communicate?"
    Back: "<ul><li>Outside the function: which input's address the output address could have come from, so unrelated inputs can be freed early.</li><li>Inside the function: a guarantee that only addresses living at least as long as <code>'c</code> get assigned to a <code>'c</code>-tagged reference.</li></ul>"
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
- noteId: ml3-lifetime-vs-scope
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Is a variable's "lifetime" the same thing as its "scope"?
    Back: "No. Scope is the full range from initialization to destruction. A lifetime is a smaller subset of that scope: just the lines where the value must actually stay borrowed to make a particular call and use its result."
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
- noteId: ml3-long-mut-ref-always-fails
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Can any variant of "return a long-lived mutable reference" out of a reference-to-reference parameter ever succeed?
    Back: "No, it always fails &mdash; it combines both problems: it needs a fully mutable chain to produce <code>&amp;mut</code> at all, and extending that to the long lifetime creates the same illegal aliasing as the long shared-reference case."
  tags:
    - rust
    - memory-lifetimes
    - references
    - mutability
- noteId: ml3-long-shared-ref-aliasing-failure
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: Why can't you extract a long-lived shared reference <code>&amp;'a S</code> out of a parameter typed <code>&amp;'b &amp;'a mut S</code>?
    Back: The original <code>&amp;'a mut S</code> is still alive for the whole <code>'a</code>. Handing back a same-lifetime shared reference to the same <code>S</code> would let a mutable and a shared reference to it coexist &mdash; illegal aliasing. Only the short-lived (<code>'b</code>) version is safe to return.
  tags:
    - rust
    - memory-lifetimes
    - references
    - aliasing
- noteId: ml3-mutable-ref-needs-full-mut-chain
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: To return a short-lived mutable reference <code>&amp;'b mut S</code> out of a reference-to-reference parameter, what must the parameter's type look like?
    Back: "The whole chain must be mutable: <code>rb: &amp;'b mut &amp;'a mut S</code>. If any layer in the chain is a shared reference instead, producing a mutable reference is illegal &mdash; you can't manufacture <code>&amp;mut</code> access through a shared reference."
  tags:
    - rust
    - memory-lifetimes
    - references
    - mutability
- noteId: ml3-outlives-bound-both-locked
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "If a function's signature ties two input lifetimes together with an outlives bound (e.g. <code>'c: 'b</code>) instead of keeping them independent, what happens to borrow-checking at the call site?"
    Back: The compiler still can't tell which argument the returned reference is really based on, so both arguments must stay locked (borrowed) for as long as the result might be used.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - borrowing
- noteId: ml3-return-ambiguity-without-lifetimes
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: If a function returns a reference that could be derived from either of two reference parameters, and nothing in the signature distinguishes them, can the compiler tell which argument stays locked?
    Back: No. Since only one address is actually returned, in principle one argument could be freed early &mdash; but without a signature that pins the return to a specific input, the compiler must assume either one could be the source, so both stay borrowed.
  tags:
    - rust
    - memory-lifetimes
    - lifetimes
    - borrowing
- noteId: ml3-short-ref-always-producible
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: "Given a reference-to-reference parameter <code>rb: &amp;'b &amp;'a S</code> (in any mix of <code>&amp;</code>/<code>&amp;mut</code> on the outer layer), can you always return the short-lived <code>&amp;'b S</code>?"
    Back: Yes. A short reference &mdash; one that only needs to live as long as the outer borrow <code>'b</code> &mdash; can always be produced, no matter how the inner reference is qualified.
  tags:
    - rust
    - memory-lifetimes
    - references
    - lifetimes
- noteId: ml3-tuple-drop-tied-to-ref
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: In <code>let (ref x3, _) = f(3, 6);</code>, why doesn't the second tuple element get dropped immediately even though it's bound to <code>_</code>?
    Back: Both elements come from the same tuple value. Taking a reference to one element (<code>ref x3</code>) keeps the whole tuple alive, so the other element can only be dropped once that reference goes out of scope.
  tags:
    - rust
    - memory-lifetimes
    - drop
    - ownership
- noteId: ml3-unlocking-last-use
  modelName: Basic
  deckName: Rust Cheat Sheet::The Abstract Machine::Memory & Lifetimes
  fields:
    Front: When does a borrowed variable become "unlocked" and usable by its owner again?
    Back: Once the last use of any reference that might point to it has happened &mdash; not necessarily at that reference's lexical scope end. Passing the reference along to another binding (e.g. <code>let s = r;</code>) prolongs the lock until <code>s</code>'s last use too.
  tags:
    - rust
    - memory-lifetimes
    - borrowing
    - non-lexical-lifetimes
- noteId: tool-cargo-build-vs-check
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What's the difference between <code>cargo build</code> and <code>cargo check</code>?
    Back: <code>cargo build</code> compiles the project fully, producing artifacts. <code>cargo check</code> only verifies it would compile, without codegen &mdash; much faster for iterating.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-doc-no-deps
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What does <code>cargo doc --no-deps --open</code> do?
    Back: Generates documentation for your own crate only, skipping dependencies, and opens it in the browser.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-info
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: How do you inspect metadata for a dependency crate, without opening its source?
    Back: <code>cargo info foo</code> &mdash; shows crate metadata for <code>foo</code>, by default for the version this project actually uses.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-init
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What does <code>cargo init</code> create?
    Back: A new project scaffold in the current directory, targeting the latest Rust edition.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-release-flag
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: How do you build a project with full optimizations turned on?
    Back: "<code>cargo build --release</code> (short form: <code>cargo build -r</code>)."
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-run-bin-vs-package
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What's the difference between <code>cargo run --bin b</code> and <code>cargo run --package w</code>?
    Back: <code>--bin b</code> runs binary <code>b</code>, but unifies features with other dependents in the build (can be surprising). <code>--package w</code> runs sub-workspace <code>w</code>'s main and treats features more sanely.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-timings
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What does adding <code>--timings</code> to a cargo command show you?
    Back: A breakdown of which crates in your dependency graph caused the build to take as long as it did.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-toolchain-override
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: How do you run a single cargo command against a specific toolchain, without changing your default?
    Back: "Prefix it: <code>cargo +nightly test</code>, or pin an exact version with <code>cargo +1.85.0 build</code>."
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-tree
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What do <code>cargo tree</code> and <code>cargo tree -i foo</code> each show?
    Back: "<code>cargo tree</code> shows the full transitive dependency graph. <code>cargo tree -i foo</code> is the inverse lookup: it explains why <code>foo</code> is pulled in."
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-cargo-unpretty-expanded
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: How do you see a macro's fully expanded output?
    Back: <code>cargo +nightly rustc -- -Zunpretty=expanded</code> &mdash; nightly-only, experimental.
  tags:
    - rust
    - tooling
    - cargo
    - macros
- noteId: tool-clippy-fmt-components
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What are <code>cargo clippy</code> and <code>cargo fmt</code>, and how do you get them?
    Back: Optional <code>rustup</code> components, installed via <code>rustup component add clippy</code> / <code>rustfmt</code>. <code>clippy</code> lints for common API misuse and unidiomatic code; <code>fmt</code> is the automatic code formatter.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-rustup-doc
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cargo
  fields:
    Front: What does <code>rustup doc</code> do, and when is it especially useful?
    Back: Opens the offline Rust documentation, including the books. Useful when you have no network access, e.g. on a plane.
  tags:
    - rust
    - tooling
    - cargo
- noteId: tool-crosscompile-build-target-flag
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cross Compilation
  fields:
    Front: Once the target and toolchain are set up, how do you actually invoke a cross-compiled build?
    Back: <code>cargo build --target=&lt;triple&gt;</code>, e.g. <code>cargo build --target=aarch64-linux-android</code>.
  tags:
    - rust
    - tooling
    - cross-compilation
- noteId: tool-crosscompile-check-target-supported
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cross Compilation
  fields:
    Front: What's the first step before cross-compiling to a new target?
    Back: Confirm the target is actually supported, by checking the Rust platform support list.
  tags:
    - rust
    - tooling
    - cross-compilation
- noteId: tool-crosscompile-env-vars-lazy
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cross Compilation
  fields:
    Front: When cross-compiling, when should you set env vars like <code>CC</code>, <code>CXX</code>, and <code>AR</code>?
    Back: Only as needed. Wait until the compiler actually complains about a missing tool before setting them &mdash; not every cross build needs every variable.
  tags:
    - rust
    - tooling
    - cross-compilation
- noteId: tool-crosscompile-linker-config
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cross Compilation
  fields:
    Front: How do you tell cargo which linker to use for a cross-compilation target?
    Back: |-
      Add a <code>[target.&lt;triple&gt;]</code> section with a <code>linker</code> key to <code>~/.cargo/config.toml</code>:<br><pre><code>[target.aarch64-linux-android]
      linker = "/path/to/aarch64-linux-android-clang"</code></pre>
  tags:
    - rust
    - tooling
    - cross-compilation
- noteId: tool-crosscompile-native-toolchain
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cross Compilation
  fields:
    Front: Besides installing the Rust target, what else does cross compilation usually require?
    Back: A native toolchain for the target, needed to link &mdash; typically obtained from the target's vendor (e.g. Google for Android, Apple for iOS). Availability varies by host OS; e.g. no iOS toolchain exists on Windows.
  tags:
    - rust
    - tooling
    - cross-compilation
- noteId: tool-crosscompile-path-sensitivity
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cross Compilation
  fields:
    Front: What's a common gotcha around path syntax when configuring a cross-compilation toolchain?
    Back: Some platforms and toolchains are extremely sensitive to path format (<code>\</code> vs <code>/</code>) and quoting &mdash; an otherwise-correct linker path can fail purely on this.
  tags:
    - rust
    - tooling
    - cross-compilation
- noteId: tool-rustup-target-install
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Cross Compilation
  fields:
    Front: How do you add a new compilation target to your Rust toolchain?
    Back: <code>rustup target install &lt;target-triple&gt;</code>, e.g. <code>rustup target install aarch64-linux-android</code>.
  tags:
    - rust
    - tooling
    - cross-compilation
- noteId: tool-bench-harness-setup
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What does <code>#![feature(test)]</code> plus <code>extern crate test;</code> enable in a <code>benches/</code> file, and what does <code>black_box</code> do there?
    Back: Enables the built-in <code>#[bench]</code> harness, which is still experimental and nightly-only. Wrapping the benchmarked call in <code>black_box(...)</code> stops the compiler from optimizing it away.
  tags:
    - rust
    - tooling
    - testing
    - project-layout
- noteId: tool-benches-dir
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What goes in a Rust project's <code>benches/</code> directory, and what's required to run it?
    Back: Benchmarks for the crate, run via <code>cargo bench</code>; requires nightly by default. On stable, use the Criterion crate instead.
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-build-rs-purpose
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What is <code>build.rs</code> used for?
    Back: A pre-build script that cargo compiles and runs before the main build &mdash; useful for generating code, compiling C/FFI dependencies, and similar setup work.
  tags:
    - rust
    - tooling
    - build-scripts
    - project-layout
- noteId: tool-buildrs-target-os-lookup
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: Inside <code>build.rs</code>, how do you find out which target platform you're compiling for?
    Back: Read the <code>CARGO_CFG_TARGET_OS</code> environment variable (and related <code>CARGO_CFG_*</code> vars) &mdash; <code>#[cfg(...)]</code> attributes describe the host running the build script, not the target, from inside <code>build.rs</code>.
  tags:
    - rust
    - tooling
    - build-scripts
    - project-layout
- noteId: tool-cargo-config-toml
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What is <code>.cargo/config.toml</code> for?
    Back: Project-local cargo configuration &mdash; build settings, aliases, linker overrides, etc. &mdash; scoped to just this project.
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-cargo-toml-vs-lock
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: <code>Cargo.toml</code> vs <code>Cargo.lock</code> &mdash; what's the difference, and which should you commit to git?
    Back: "<code>Cargo.toml</code> is the project manifest: dependencies, metadata, build targets. <code>Cargo.lock</code> pins exact dependency versions for reproducible builds. Convention: commit it for applications; often skip it for libraries."
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-examples-vs-tests-dir
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What's the difference between the <code>examples/</code> and <code>tests/</code> directories in a cargo project?
    Back: <code>examples/</code> holds example programs that see your crate the way an external user would; run one with <code>cargo run --example name</code>. <code>tests/</code> holds integration tests, run via <code>cargo test</code>. Unit tests usually stay inside <code>src/</code> instead.
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-functions-namespace-members
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: Which namespace do <code>fn</code>, <code>const</code>, and <code>static</code> occupy?
    Back: The Functions namespace &mdash; despite the name, constants and statics live here too.
  tags:
    - rust
    - tooling
    - namespaces
- noteId: tool-integration-vs-unit-test-visibility
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: How do integration tests in <code>tests/</code> differ from unit tests in what they can access?
    Back: Integration tests depend on your crate like an external third party would, so they only see public items. Unit tests in <code>src/</code> can reach private items via <code>super</code>.
  tags:
    - rust
    - tooling
    - testing
    - project-layout
- noteId: tool-macros-namespace
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: Which namespace does a <code>macro_rules!</code> definition occupy?
    Back: The Macros namespace &mdash; separate from both Types and Functions, so a macro's name never collides with a type or function of the same name.
  tags:
    - rust
    - tooling
    - namespaces
    - macros
- noteId: tool-main-vs-lib-rs
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What's the difference between <code>src/main.rs</code> and <code>src/lib.rs</code>?
    Back: <code>main.rs</code> is the default entry point for a binary/application &mdash; what <code>cargo run</code> uses. <code>lib.rs</code> is the default entry point for a library; path lookup for <code>my_crate::f()</code> starts there.
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-mod-inline-vs-mod-semicolon
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What's the difference between <code>mod m {}</code> and <code>mod m;</code>?
    Back: <code>mod m {}</code> defines the module inline, in the same file. <code>mod m;</code> tells the compiler to load the module's contents from <code>m.rs</code> or <code>m/mod.rs</code>.
  tags:
    - rust
    - tooling
    - modules
- noteId: tool-module-tree-not-from-filesystem
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: Is Rust's module tree derived automatically from the directory layout on disk?
    Back: No. The module tree must be explicitly declared with <code>mod</code> statements; it is not implicitly built from the filesystem tree.
  tags:
    - rust
    - tooling
    - modules
- noteId: tool-module-visibility-needs-public-path
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: |-
      In this <code>src/lib.rs</code>, why is <code>g()</code> unreachable from outside the crate?<br><pre><code>pub fn f() {}

      mod m {
          pub fn g() {}
      }</code></pre>
    Back: <code>f</code> is public and sits at the crate root, so it's reachable. <code>g</code> is marked <code>pub</code> too, but its parent module <code>m</code> is not public &mdash; visibility requires an unbroken public path from the root, so <code>g</code> stays inaccessible from outside the crate.
  tags:
    - rust
    - tooling
    - modules
    - visibility
- noteId: tool-namespace-collision-example
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: "Why can <code>enum X {}</code> and <code>fn X() {}</code> coexist in one scope, but <code>struct X;</code> and <code>const X: u8 = 1;</code> cannot?"
    Back: <code>enum X {}</code> lives in the Types namespace and <code>fn X() {}</code> in the Functions namespace, so they don't collide. <code>struct X;</code> already occupies both Types <em>and</em> Functions (it defines a type and a constant named <code>X</code>), so it collides with another Functions-namespace <code>X</code> like <code>const X</code>.
  tags:
    - rust
    - tooling
    - namespaces
- noteId: tool-nested-mod-file-path
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: For <code>mod a { mod b { mod c; } }</code>, where does the compiler look for <code>c</code>'s source?
    Back: Either <code>a/b/c.rs</code> or <code>a/b/c/mod.rs</code> &mdash; the path is built from the nesting of <code>mod</code> declarations down from the module tree root.
  tags:
    - rust
    - tooling
    - modules
- noteId: tool-proc-macro-crate-setup
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What two things does a crate need to define a procedural macro?
    Back: "In <code>Cargo.toml</code>: <code>[lib]\\nproc-macro = true</code>. In <code>src/lib.rs</code>: <code>extern crate proc_macro;</code> plus a function tagged e.g. <code>#[proc_macro_attribute]</code> that takes and returns <code>TokenStream</code>."
  tags:
    - rust
    - tooling
    - macros
    - project-layout
- noteId: tool-rust-toolchain-toml
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What does <code>rust-toolchain.toml</code> control?
    Back: Overrides the Rust toolchain (channel, components, targets) used for this specific project, regardless of the developer's default toolchain.
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-rustfmt-vs-clippy-toml
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What's the difference between <code>.rustfmt.toml</code> and <code>.clippy.toml</code>?
    Back: <code>.rustfmt.toml</code> customizes how <code>cargo fmt</code> formats code. <code>.clippy.toml</code> configures certain lints used by <code>cargo clippy</code>.
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-src-bin-dir
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: How do you add extra binaries to a project, even one that's primarily a library?
    Back: Place them in <code>src/bin/</code>, e.g. <code>src/bin/extra.rs</code>; run with <code>cargo run --bin extra</code>.
  tags:
    - rust
    - tooling
    - cargo
    - project-layout
- noteId: tool-three-namespaces
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What are Rust's three item namespaces?
    Back: Types, Functions, and Macros. An item's namespace determines which other items it may coexist with in the same scope.
  tags:
    - rust
    - tooling
    - namespaces
    - modules
- noteId: tool-tuple-struct-namespaces
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What does a tuple struct <code>struct X();</code> define, in terms of namespaces?
    Back: Both a type <code>X</code> (Types namespace) and a constructor function <code>X</code> (Functions namespace) simultaneously.
  tags:
    - rust
    - tooling
    - namespaces
- noteId: tool-types-namespace-members
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: Which namespace do <code>mod</code>, <code>trait</code>, <code>enum</code>, <code>union</code>, and <code>struct</code> occupy?
    Back: The Types namespace.
  tags:
    - rust
    - tooling
    - namespaces
- noteId: tool-unit-struct-namespaces
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What does a unit struct <code>struct X;</code> define, in terms of namespaces?
    Back: Both a type <code>X</code> (Types namespace) and a constant <code>X</code> (Functions namespace) simultaneously.
  tags:
    - rust
    - tooling
    - namespaces
- noteId: tool-unit-test-location
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What attribute marks a unit test function, and where do unit tests conventionally live?
    Back: <code>#[test]</code>, typically inside a <code>#[cfg(test)] mod test { ... }</code> block in the same file as the code under test. That inner module uses <code>use super::...;</code> to reach the parent module's items, including private ones.
  tags:
    - rust
    - tooling
    - testing
    - project-layout
- noteId: tool-unreferenced-rs-file-ignored
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: What happens to a <code>.rs</code> file that no <code>mod</code> statement ever reaches from the module tree root?
    Back: The compiler ignores it entirely &mdash; it is not compiled, even if it physically sits inside <code>src/</code>.
  tags:
    - rust
    - tooling
    - modules
- noteId: tool-use-imports-all-namespaces
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Project Anatomy
  fields:
    Front: When you write <code>use my_mod::X;</code>, what exactly gets imported?
    Back: Every item named <code>X</code> in <code>my_mod</code>, across all of its namespaces &mdash; a type, a function, and a macro all named <code>X</code> would all be imported at once.
  tags:
    - rust
    - tooling
    - namespaces
    - modules
- noteId: tool-attr-alloc-error-handler
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[alloc_error_handler]</code> mark?
    Back: A function of shape <code>fn(Layout) -&gt; !</code> as the handler invoked when allocation fails.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-bench
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[bench]</code> mark, and what's its stability status?
    Back: Marks a function in <code>benches/</code> as a benchmark runnable via <code>cargo bench</code>; it's still an experimental, nightly-only feature.
  tags:
    - rust
    - tooling
    - attributes
    - testing
- noteId: tool-attr-cold
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[cold]</code> hint to the compiler?
    Back: That the function is unlikely to be called, letting the compiler optimize the surrounding hot path better around the call site.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-crate-name
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![crate_name = "x"]</code> do?
    Back: Explicitly sets the crate's name, useful when not building via cargo.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-crate-type
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![crate_type = "bin"]</code> control, and what other values can it take?
    Back: The kind of build artifact produced &mdash; values include <code>bin</code>, <code>lib</code>, <code>dylib</code>, <code>cdylib</code>.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-deprecated
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[deprecated = "msg"]</code> do?
    Back: Marks an item as deprecated, producing a compiler warning with the given message wherever it's used.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-derive
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[derive(X)]</code> do?
    Back: Invokes a procedural macro that generates a default implementation of trait <code>X</code> for the annotated type.
  tags:
    - rust
    - tooling
    - attributes
    - macros
- noteId: tool-attr-diagnostic-on-unimplemented
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[diagnostic::on_unimplemented]</code> do?
    Back: Lets a trait author customize the compiler error message shown when the trait isn't implemented for a type, improving diagnostics for users of the trait.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-doc-alias
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[doc(alias = "other")]</code> do?
    Back: Registers an additional searchable name for the item in generated docs, without renaming the item itself.
  tags:
    - rust
    - tooling
    - attributes
    - docs
- noteId: tool-attr-doc-eq-comment
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: How does <code>#[doc = "Explanation"]</code> relate to a <code>///</code> doc comment?
    Back: They're equivalent &mdash; <code>#[doc = "Explanation"]</code> is simply the attribute form of writing <code>/// Explanation</code>.
  tags:
    - rust
    - tooling
    - attributes
    - docs
- noteId: tool-attr-doc-hidden
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[doc(hidden)]</code> do?
    Back: Hides the item from generated documentation, even though it may still technically be public and usable.
  tags:
    - rust
    - tooling
    - attributes
    - docs
- noteId: tool-attr-doc-html-favicon-logo
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What do the crate-level attributes <code>#![doc(html_favicon_url = "")]</code> and <code>#![doc(html_logo_url = "")]</code> set?
    Back: The favicon and the logo image used in the crate's generated documentation, respectively.
  tags:
    - rust
    - tooling
    - attributes
    - docs
- noteId: tool-attr-doc-html-playground-root-source
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What do <code>#![doc(html_playground_url = "")]</code>, <code>#![doc(html_root_url = "")]</code>, and <code>#![doc(html_no_source)]</code> each control?
    Back: '<code>html_playground_url</code>: adds "Run" buttons in doc examples, using the given playground service.<br><code>html_root_url</code>: the base URL used for links to external crates.<br><code>html_no_source</code>: excludes the source-code view from generated docs.'
  tags:
    - rust
    - tooling
    - attributes
    - docs
- noteId: tool-attr-expect
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: How does <code>#[expect(X)]</code> differ from <code>#[allow(X)]</code>?
    Back: Like <code>#[allow(X)]</code>, it suppresses lint <code>X</code> &mdash; but <code>#[expect(X)]</code> also warns you if the lint never actually triggers, catching stale suppressions that are no longer needed.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-export-name-vs-link-name
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What's the difference between <code>#[unsafe(export_name = "foo")]</code> and <code>#[link_name = "foo"]</code>?
    Back: <code>export_name</code> sets the symbol name under which <em>your</em> <code>fn</code>/<code>static</code> is exported. <code>link_name</code> sets the symbol name to search for when resolving an <code>extern fn</code> you're importing.
  tags:
    - rust
    - tooling
    - attributes
    - linking
- noteId: tool-attr-feature-flag
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![feature(a, b, c)]</code> do?
    Back: Opts into unstable, nightly-only compiler features named <code>a</code>, <code>b</code>, <code>c</code>; documented in the Unstable Book, only usable on the nightly toolchain.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-global-allocator
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[global_allocator]</code> mark?
    Back: A static item implementing <code>GlobalAlloc</code> as the process's global memory allocator.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-ignore-test
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[ignore = "msg"]</code> do on a test?
    Back: Compiles the test but skips running it by default, recording the given reason.
  tags:
    - rust
    - tooling
    - attributes
    - testing
- noteId: tool-attr-inline-variants
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What's the difference between <code>#[inline]</code>, <code>#[inline(always)]</code>, and <code>#[inline(never)]</code>?
    Back: <code>#[inline]</code> politely suggests inlining at call sites. <code>#[inline(always)]</code> strongly pushes the compiler to inline it. <code>#[inline(never)]</code> instructs it not to inline the function at all.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-link-name-kind
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[link(name = "x", kind = "y")]</code> do?
    Back: Declares a native library to link against when resolving symbols inside an <code>extern</code> block.
  tags:
    - rust
    - tooling
    - attributes
    - linking
- noteId: tool-attr-link-section
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[unsafe(link_section = ".x")]</code> do?
    Back: Places the function or static in a specific named section of the compiled object file.
  tags:
    - rust
    - tooling
    - attributes
    - linking
- noteId: tool-attr-lint-escalation
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What's the escalation order of <code>#[allow]</code>, <code>#[warn]</code>, <code>#[deny]</code>, and <code>#[forbid]</code> on a lint?
    Back: "<code>allow</code>: ignore that class of issue entirely.<br><code>warn</code>: emit a warning.<br><code>deny</code>: fail compilation.<br><code>forbid</code>: fail compilation and also prevent a later <code>allow</code> from overriding it."
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-macro-export
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[macro_export]</code> do on a <code>macro_rules!</code> macro?
    Back: Exports it as <code>pub</code> at the crate root, making it usable by dependent crates.
  tags:
    - rust
    - tooling
    - attributes
    - macros
- noteId: tool-attr-macro-use
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[macro_use]</code> do?
    Back: Lets macros defined in a module remain visible past that module's own scope, or imports macros from an <code>extern crate</code>.
  tags:
    - rust
    - tooling
    - attributes
    - macros
- noteId: tool-attr-must-use
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[must_use = "msg"]</code> do?
    Back: Makes the compiler warn if the item's return value isn't used or processed by the caller, showing the given message.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-no-implicit-prelude
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![no_implicit_prelude]</code> do?
    Back: Stops the automatic prelude import (e.g. <code>None</code>, <code>Vec</code>), so you must import those manually. Applies at crate or module level.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-no-link
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[no_link]</code> do on an <code>extern crate</code>?
    Back: Skips linking that crate's code when you only want to use its macros.
  tags:
    - rust
    - tooling
    - attributes
    - linking
- noteId: tool-attr-no-main
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![no_main]</code> do?
    Back: Suppresses Rust's generated <code>main()</code> entry point, for when you provide your own. Crate level.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-no-mangle
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[unsafe(no_mangle)]</code> do?
    Back: Uses the item's name directly as its symbol name, instead of the compiler's usual name mangling.
  tags:
    - rust
    - tooling
    - attributes
    - linking
- noteId: tool-attr-no-std
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![no_std]</code> do?
    Back: Stops the automatic import of <code>std</code>; you use <code>core</code> instead. Applies at crate level.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-non-exhaustive
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[non_exhaustive]</code> communicate about a <code>struct</code> or <code>enum</code>?
    Back: That it may grow new fields or variants in the future &mdash; external code can't exhaustively match or construct it without a wildcard arm (or <code>..</code>).
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-on-column-codes
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: In an attribute reference table, what do the placement codes <code>C</code>, <code>M</code>, <code>F</code>, <code>S</code>, and <code>T</code> mean?
    Back: "<code>C</code>: crate level (usually as <code>#![attr]</code> in the top-level file).<br><code>M</code>: modules.<br><code>F</code>: functions.<br><code>S</code>: statics.<br><code>T</code>: types."
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-panic-handler
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[panic_handler]</code> mark?
    Back: A function of shape <code>fn(&amp;PanicInfo) -&gt; !</code> as the application's panic handler &mdash; needed e.g. in <code>no_std</code> contexts without the standard panic runtime.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-path
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[path = "x.rs"]</code> do on a module declaration?
    Back: Loads that module's contents from a non-standard file path, instead of the usual <code>name.rs</code> / <code>name/mod.rs</code> convention.
  tags:
    - rust
    - tooling
    - attributes
    - modules
- noteId: tool-attr-proc-macro-kinds
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What's the difference between <code>#[proc_macro]</code>, <code>#[proc_macro_derive(Foo)]</code>, and <code>#[proc_macro_attribute]</code>?
    Back: <code>#[proc_macro]</code> marks a function-like macro callable as <code>m!()</code>. <code>#[proc_macro_derive(Foo)]</code> marks a derive macro usable as <code>#[derive(Foo)]</code>. <code>#[proc_macro_attribute]</code> marks an attribute macro usable as a new <code>#[x]</code>.
  tags:
    - rust
    - tooling
    - attributes
    - macros
- noteId: tool-attr-recursion-limit
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![recursion_limit = "123"]</code> control?
    Back: The compile-time recursion limit used for things like deref chains and macro expansion.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-repr-align
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[repr(align(8))]</code> do, and when might you want it?
    Back: Raises a struct's alignment to the given value &mdash; useful e.g. when the type needs to match the alignment requirements of SIMD instructions.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-repr-c
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[repr(C)]</code> do, and why reach for it?
    Back: Uses a C-compatible, predictable memory layout instead of Rust's default layout &mdash; needed for FFI, and safe to rely on for <code>transmute</code>.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-repr-c-enum-discriminant
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[repr(C, u8)]</code> do on an enum?
    Back: Uses the C representation while also fixing the enum's discriminant to the given integer type, here <code>u8</code>.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-repr-combinable
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: Can representation modifiers on <code>#[repr(...)]</code> be combined?
    Back: Yes &mdash; e.g. <code>#[repr(C, packed(1))]</code> combines a C-compatible layout with packed alignment.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-repr-packed
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[repr(packed(1))]</code> do, and what's the risk?
    Back: Lowers the alignment of a struct and its fields, packing them tighter. It's mildly UB-prone, since it can produce unaligned field access.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-repr-transparent
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[repr(transparent)]</code> guarantee?
    Back: For a single-field type, it gets exactly the same layout as its contained field.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-rustfmt-skip
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[rustfmt::skip]</code> do?
    Back: Prevents <code>cargo fmt</code> from reformatting the annotated item.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-rustfmt-skip-scoped
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What do <code>#![rustfmt::skip::macros(x)]</code> and <code>#![rustfmt::skip::attributes(x)]</code> each do?
    Back: The first tells <code>rustfmt</code> to skip formatting invocations of macro <code>x</code>. The second tells it to skip formatting a specific attribute <code>x</code>.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-should-panic
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[should_panic]</code> require of a <code>#[test]</code> function?
    Back: The test must actually panic to be considered passing; if it doesn't panic, the test fails.
  tags:
    - rust
    - tooling
    - attributes
    - testing
- noteId: tool-attr-target-feature
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[target_feature(enable = "avx2")]</code> do?
    Back: Enables a specific CPU feature for the code of an <code>unsafe fn</code>, letting the compiler emit those instructions inside it.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-track-caller
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[track_caller]</code> enable?
    Back: Lets a function retrieve its caller's source location via <code>Location::caller()</code>, improving panic message quality.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-type-length-limit
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![type_length_limit = "456"]</code> do?
    Back: Limits the maximum number of type substitutions the compiler performs, guarding against runaway type complexity.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-attr-used
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#[used]</code> do on a <code>static</code>?
    Back: Prevents it from being optimized away even though it looks unused &mdash; e.g. because it's actually read from outside Rust's own visibility analysis, such as assembly or a linker script.
  tags:
    - rust
    - tooling
    - attributes
    - linking
- noteId: tool-attr-windows-subsystem
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does <code>#![windows_subsystem = "x"]</code> control?
    Back: On Windows, whether the binary is built as a <code>console</code> app or a <code>windows</code> (GUI, no console) app.
  tags:
    - rust
    - tooling
    - attributes
- noteId: tool-buildrs-cdylib-link-arg
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What does printing <code>cargo::rustc-cdylib-link-arg=FLAG</code> from <code>build.rs</code> do?
    Back: Passes an extra linker flag, but only when building a <code>cdylib</code> artifact.
  tags:
    - rust
    - tooling
    - build-scripts
    - linking
- noteId: tool-buildrs-cfg-env
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: How does <code>build.rs</code> see the crate's <code>cfg</code> settings, and how are multi-valued ones represented?
    Back: Via <code>CARGO_CFG_*</code> environment variables (dashes converted to underscores), e.g. <code>CARGO_CFG_TARGET_OS=macos</code>. Multi-valued cfgs are comma-joined, e.g. <code>CARGO_CFG_TARGET_FEATURE=avx,avx2</code>.
  tags:
    - rust
    - tooling
    - build-scripts
    - cfg
- noteId: tool-buildrs-core-vars
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: In <code>build.rs</code>, what do the <code>OUT_DIR</code>, <code>TARGET</code>, <code>HOST</code>, and <code>PROFILE</code> environment variables tell you?
    Back: "<code>OUT_DIR</code>: where to place generated output.<br><code>TARGET</code>: the target triple being compiled for.<br><code>HOST</code>: the triple of the machine running the build script.<br><code>PROFILE</code>: <code>debug</code> or <code>release</code>."
  tags:
    - rust
    - tooling
    - build-scripts
- noteId: tool-buildrs-feature-env
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: How does <code>build.rs</code> find out which cargo features are enabled?
    Back: One environment variable per activated feature, e.g. <code>CARGO_FEATURE_SOMETHING</code> for feature <code>something</code>. Dashes in feature names become underscores, so feature <code>some-feature</code> shows up as <code>CARGO_FEATURE_SOME_FEATURE</code>.
  tags:
    - rust
    - tooling
    - build-scripts
- noteId: tool-buildrs-link-lib-vs-search
  modelName: Basic
  deckName: Rust Cheat Sheet::Tooling::Tooling Directives
  fields:
    Front: What's the difference between <code>cargo::rustc-link-lib=[KIND=]NAME</code> and <code>cargo::rustc-link-search=[KIND=]PATH</code>, printed from <code>build.rs</code>?
    Back: <code>rustc-link-lib</code> links a native library into the build, as if via <code>-l</code>. <code>rustc-link-search</code> adds a search path for finding native libraries, as if via <code>-L</code>.
  tags:
